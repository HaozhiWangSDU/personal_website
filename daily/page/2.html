<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>山大信息日报历史</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --ink: #172033;
      --muted: #627086;
      --line: #dfe5ee;
      --panel: #ffffff;
      --accent: #0f766e;
      --accent-2: #1d4ed8;
      --warn: #b45309;
      --ok-bg: #e8f5f2;
      --review-bg: #fff4df;
      --checked-bg: #edf2ff;
    }
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.65;
    }
    a { color: var(--accent-2); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    h1, h2, h3, p, a, span, strong, dd {
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .page {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 52px;
    }
    .hero {
      max-width: 100%;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .hero.compact { margin-bottom: 18px; }
    .topnav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
    }
    .topnav a, .pagination a {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 6px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      text-decoration: none;
      color: var(--ink);
    }
    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.9rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .disclaimer {
      max-width: 780px;
      margin: 14px 0 0;
      color: var(--muted);
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 22px 0 0;
    }
    .meta-grid div {
      min-width: 0;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }
    .meta-grid dt {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .meta-grid dd {
      margin: 0;
      font-weight: 700;
      overflow-wrap: anywhere;
    }
    .notice {
      max-width: 100%;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--ok-bg);
      color: #115e59;
    }
    .section-nav {
      max-width: 100%;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 14px 2px;
      margin: 10px 0 4px;
    }
    .section-nav a {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-size: 0.92rem;
      text-decoration: none;
    }
    .sections {
      display: grid;
      gap: 16px;
    }
    .section-block {
      max-width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 22px;
    }
    .section-block h2 {
      margin: 0 0 12px;
      font-size: 1.35rem;
      line-height: 1.3;
      letter-spacing: 0;
    }
    .section-block p, .feed-item p { margin: 8px 0 0; }
    .items {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }
    .feed-item {
      max-width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      padding: 16px;
    }
    .feed-item h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
      line-height: 1.4;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }
    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink);
      background: #eef2f7;
    }
    .pill.enough { background: var(--ok-bg); color: #115e59; }
    .pill.checked { background: var(--checked-bg); color: #1e3a8a; }
    .pill.review { background: var(--review-bg); color: var(--warn); }
    .source-link {
      display: inline-flex;
      margin-top: 12px;
      font-weight: 700;
    }
    .empty { color: var(--muted); }
    .archive-list {
      display: grid;
      gap: 10px;
    }
    .archive-row {
      max-width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .archive-row a {
      display: grid;
      gap: 2px;
      min-width: 0;
      text-decoration: none;
      color: var(--ink);
    }
    .archive-row strong { overflow-wrap: anywhere; }
    .archive-date, .archive-count {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .pagination {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-top: 22px;
      color: var(--muted);
    }
    @media (max-width: 760px) {
      .page { width: min(100% - 18px, 1120px); padding-top: 12px; }
      .hero, .section-block { padding: 18px; }
      .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .items { grid-template-columns: 1fr; }
      .archive-row { grid-template-columns: 1fr; align-items: start; }
    }
    @media (max-width: 430px) {
      .hero, .section-block { padding: 16px; }
      .meta-grid { grid-template-columns: 1fr; }
      .topnav a, .pagination a { min-height: 34px; padding: 5px 10px; }
    }
  </style>
</head>
<body>
  <main class="page index-page">
    <header class="hero compact">
      <nav class="topnav" aria-label="日报导航">
        <a href="../latest.html">最新</a>
        <a href="../index.html">历史</a>
      </nav>
      <h1>山大信息日报历史</h1>
      <p class="disclaimer">仅收录公开 summary 页面；原始链接以每日页内来源为准。</p>
    </header>
    <section class="archive-list" aria-label="历史日报"><article class="archive-row"><a href="../2026-06-06.html"><span class="archive-date">2026-06-06</span><strong>山大信息日报 2026-06-06</strong></a><span class="archive-count">6 条</span><span class="pill review">需核查 1</span></article></section>
    <nav class="pagination" aria-label="分页"><a href="../index.html">上一页</a><span>第 2 / 2 页</span></nav>
  </main>
</body>
</html>
