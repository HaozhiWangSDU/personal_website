<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>断层解剖学期末复习智能指南</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Dark Theme (Default) */
      --bg-primary: #0b0f19;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.7);
      --bg-card-hover: rgba(31, 41, 55, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-color-hover: rgba(6, 182, 212, 0.4);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      
      --accent-primary: #06b6d4; /* Cyan */
      --accent-primary-glow: rgba(6, 182, 212, 0.15);
      --accent-secondary: #a855f7; /* Purple */
      --accent-secondary-glow: rgba(168, 85, 247, 0.15);
      --accent-success: #10b981; /* Green */
      --accent-success-glow: rgba(16, 185, 129, 0.15);
      --accent-warning: #f59e0b; /* Gold */
      --accent-warning-glow: rgba(245, 158, 11, 0.15);
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-glow: 0 0 20px rgba(6, 182, 212, 0.15);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-hover: rgba(255, 255, 255, 0.95);
      --border-color: rgba(0, 0, 0, 0.08);
      --border-color-hover: rgba(8, 145, 178, 0.4);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      
      --accent-primary: #0891b2;
      --accent-primary-glow: rgba(8, 145, 178, 0.1);
      --accent-secondary: #9333ea;
      --accent-secondary-glow: rgba(147, 51, 234, 0.1);
      --accent-success: #059669;
      --accent-success-glow: rgba(5, 150, 105, 0.1);
      --accent-warning: #d97706;
      --accent-warning-glow: rgba(217, 119, 6, 0.1);
      
      --shadow-glow: 0 0 15px rgba(8, 145, 178, 0.08);
    }

    [data-theme="cyberpunk"] {
      --bg-primary: #05050a;
      --bg-secondary: #0a0a16;
      --bg-card: rgba(10, 10, 26, 0.8);
      --bg-card-hover: rgba(18, 18, 38, 0.9);
      --border-color: #ff007f;
      --border-color-hover: #00ffff;
      --text-primary: #00ffff;
      --text-secondary: #ff007f;
      --text-muted: #8b5cf6;
      
      --accent-primary: #00ffff;
      --accent-primary-glow: rgba(0, 255, 255, 0.2);
      --accent-secondary: #ff007f;
      --accent-secondary-glow: rgba(255, 0, 127, 0.2);
      --accent-success: #39ff14;
      --accent-success-glow: rgba(57, 255, 20, 0.2);
      --accent-warning: #ffff00;
      --accent-warning-glow: rgba(255, 255, 0, 0.2);
      
      --shadow-glow: 0 0 25px rgba(255, 0, 127, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition-normal), color var(--transition-normal);
      overflow-x: hidden;
    }

    /* Grid Background Effect (Dark Mode only) */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(var(--border-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      opacity: 0.4;
      pointer-events: none;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-primary);
    }

    /* Container */
    .app-container {
      display: flex;
      flex: 1;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
      gap: 24px;
      position: relative;
    }

    /* Sidebar */
    aside {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sticky-sidebar {
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-height: calc(100vh - 40px);
    }

    /* Main Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }

    /* Common Card Styles */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      transition: all var(--transition-normal);
    }

    .glass-card:hover {
      border-color: var(--border-color-hover);
      box-shadow: var(--shadow-glow), var(--shadow-lg);
    }

    /* Brand / Header */
    .brand-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand-title {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    /* Progress Widget */
    .progress-widget {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
    }

    .progress-bar-bg {
      height: 8px;
      background: var(--border-color);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-success));
      width: 0%;
      border-radius: 4px;
      transition: width var(--transition-slow);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 5px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px;
      text-align: center;
      transition: all var(--transition-fast);
    }

    [data-theme="light"] .stat-box {
      background: rgba(0, 0, 0, 0.02);
    }

    .stat-box.active {
      border-color: var(--accent-warning);
      background: var(--accent-warning-glow);
    }

    .stat-val {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Region Selector Menu */
    .region-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      max-height: 400px;
      padding-right: 5px;
    }

    .region-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      transition: all var(--transition-normal);
    }

    .region-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-primary);
    }

    [data-theme="light"] .region-item:hover {
      background: rgba(0, 0, 0, 0.03);
    }

    .region-item.active {
      background: var(--accent-primary-glow);
      border-color: rgba(6, 182, 212, 0.3);
      color: var(--accent-primary);
    }

    .region-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .region-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      background: var(--border-color);
      color: var(--text-secondary);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      transition: all var(--transition-fast);
    }

    .region-item.active .region-badge {
      background: var(--accent-primary);
      color: #000;
    }

    /* Main Toolbar */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .toolbar-row-1 {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition: all var(--transition-normal);
    }

    [data-theme="light"] .search-input {
      background: rgba(0, 0, 0, 0.02);
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 0 3px var(--accent-primary-glow);
    }

    /* Filter Segments */
    .segmented-control {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border-color);
      padding: 4px;
      border-radius: var(--radius-md);
      gap: 4px;
    }

    [data-theme="light"] .segmented-control {
      background: rgba(0, 0, 0, 0.04);
    }

    .segment-btn {
      padding: 10px 16px;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-normal);
    }

    .segment-btn:hover {
      color: var(--text-primary);
    }

    .segment-btn.active {
      background: var(--bg-card);
      color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
    }

    /* Toolbar Actions Row */
    .toolbar-row-2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .mode-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
    }

    [data-theme="light"] .mode-btn:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    .mode-btn.active {
      border-color: var(--accent-primary);
      background: var(--accent-primary-glow);
      color: var(--accent-primary);
    }

    .mode-btn svg {
      width: 16px;
      height: 16px;
    }

    .action-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .btn-icon:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* Card Details */
    .study-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .study-card.mastered {
      opacity: 0.65;
      border-color: rgba(16, 185, 129, 0.2);
    }

    .study-card.mastered:hover {
      opacity: 1;
      border-color: var(--accent-success);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .badge-term {
      background: var(--accent-primary-glow);
      color: var(--accent-primary);
      border: 1px solid rgba(6, 182, 212, 0.2);
    }

    .badge-question {
      background: var(--accent-secondary-glow);
      color: var(--accent-secondary);
      border: 1px solid rgba(168, 85, 247, 0.2);
    }

    .badge-region {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    [data-theme="light"] .badge-region {
      background: rgba(0, 0, 0, 0.03);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-action-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .card-action-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    .card-action-btn.star-btn:hover,
    .card-action-btn.star-btn.active {
      color: var(--accent-warning);
      border-color: rgba(245, 158, 11, 0.4);
      background: var(--accent-warning-glow);
    }

    .card-action-btn.check-btn:hover,
    .card-action-btn.check-btn.active {
      color: var(--accent-success);
      border-color: rgba(16, 185, 129, 0.4);
      background: var(--accent-success-glow);
    }

    .card-action-btn svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .card-action-btn.active svg {
      fill: currentColor;
    }

    /* Content Area */
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.4;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
    }

    .english-title {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .card-body {
      font-size: 15px;
      line-height: 1.6;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      transition: max-height var(--transition-normal), opacity var(--transition-normal);
    }

    .card-body strong {
      color: var(--text-primary);
      font-weight: 600;
      background: linear-gradient(120deg, var(--accent-primary-glow) 0%, var(--accent-primary-glow) 100%);
      padding: 0 4px;
      border-radius: 3px;
    }

    .card-body ul, .card-body ol {
      padding-left: 20px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-body li {
      margin-bottom: 4px;
    }

    /* Active Recall / Hide mode styling */
    .card-body.hidden-answer {
      max-height: 0;
      padding-top: 0;
      border-top-color: transparent;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .flashcard-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all var(--transition-normal);
      user-select: none;
    }

    [data-theme="light"] .flashcard-placeholder {
      background: rgba(0, 0, 0, 0.01);
    }

    .flashcard-placeholder:hover {
      color: var(--accent-primary);
      border-color: var(--accent-primary);
      background: var(--accent-primary-glow);
    }

    /* Single Quiz Panel */
    .quiz-view-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      min-height: 400px;
    }

    .quiz-card-wrapper {
      width: 100%;
      max-width: 700px;
      perspective: 1000px;
    }

    .quiz-card {
      width: 100%;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .quiz-actions-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 700px;
      margin-top: 10px;
    }

    .quiz-btn {
      flex: 1;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition-normal);
    }

    .quiz-btn-primary {
      background: var(--accent-primary);
      color: #000;
      border: none;
    }

    .quiz-btn-primary:hover {
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
      transform: translateY(-1px);
    }

    .quiz-btn-easy {
      background: var(--accent-success-glow);
      color: var(--accent-success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    .quiz-btn-easy:hover {
      background: var(--accent-success);
      color: #fff;
    }

    .quiz-btn-hard {
      background: var(--accent-warning-glow);
      color: var(--accent-warning);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .quiz-btn-hard:hover {
      background: var(--accent-warning);
      color: #fff;
    }

    .quiz-progress-text {
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      color: var(--border-color);
    }

    /* Quick Tip Box */
    .tip-box {
      display: flex;
      gap: 12px;
      background: var(--accent-primary-glow);
      border-left: 4px solid var(--accent-primary);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 16px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .tip-box svg {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      color: var(--accent-primary);
    }

    /* Theme and config buttons in sidebar footer */
    .sidebar-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }

    .theme-selector {
      display: flex;
      gap: 8px;
    }

    .theme-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition-fast);
      position: relative;
    }

    .theme-dot.active {
      transform: scale(1.15);
    }

    .theme-dot-dark {
      background: #0f172a;

    document.documentElement.setAttribute('data-theme', currentTheme);

    // Initial load

      initThemeDots();
      renderRegions();
      updateStats();

      document.getElementById('search-box').addEventListener('input', () => {

        renderContent();

    });

    // Theme Management
    function setTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('anatomy_theme', theme);
      initThemeDots();
    }

    function initThemeDots() {
      document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
      if (currentTheme === 'dark') document.querySelector('.theme-dot-dark').classList.add('active');
      else if (currentTheme === 'light') document.querySelector('.theme-dot-light').classList.add('active');
      else if (currentTheme === 'cyberpunk') document.querySelector('.theme-dot-cyber').classList.add('active');
    }

    // Render Regions Menu
    function renderRegions() {
      const regionList = document.getElementById('region-list');
      
      // Calculate item count per region
      const counts = { all: DATA.length };
      DATA.forEach(item => {
        counts[item.region] = (counts[item.region] || 0) + 1;
      });

      const regions = ["all", "头部 / 脑", "颌面部 / 颈部", "胸部", "腹部", "脊柱区 / 四肢", "男性盆部 / 会阴"];
      
      regionList.innerHTML = regions.map(reg => {
        const displayName = reg === "all" ? "全部区域" : reg;
        const isActive = currentRegion === reg ? "active" : "";
        const count = counts[reg] || 0;
        
        return `
          <button class="region-item ${isActive}" onclick="selectRegion('${reg}')">

              <span>${displayName}</span>
            </div>
            <span class="region-badge">${count}</span>
          </button>
        `;
      }).join('');
    }

    function selectRegion(reg) {
      currentRegion = reg;
      renderRegions();
      if (viewMode === 'quiz') {
        // Restart quiz for that region
        startQuiz();
      } else {
        renderContent();
      }
    }

    // Filter controls
    function setFilterType(type) {
      filterType = type;
      document.querySelectorAll('.segment-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`type-${type}`).classList.add('active');
      
      if (viewMode === 'quiz') {
        startQuiz();
      } else {
        renderContent();
      }
    }

      filterStarred = !filterStarred;

        btn.classList.add('active');
        // Uncheck unstudied if checked
        if (filterUnstudied) {
          filterUnstudied = false;
          document.getElementById('filter-unstudied-btn').classList.remove('active');
        }
      } else {
        btn.classList.remove('active');
      }
      renderContent();
    }

      filterUnstudied = !filterUnstudied;
      const btn = document.getElementById('filter-unstudied-btn');
      if (filterUnstudied) {
        btn.classList.add('active');
        if (filterStarred) {
          filterStarred = false;
          document.getElementById('filter-starred-btn').classList.remove('active');
        }
      } else {
        btn.classList.remove('active');
      }
      renderContent();

    // View Mode Management
    function setViewMode(mode) {
      viewMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`mode-${mode}`).classList.add('active');
      
      const tipText = document.getElementById('tip-text');
      if (mode === 'browse') {
        tipText.innerHTML = "当前为<strong>列表浏览模式</strong>。你可以点击卡片右上角的 🌟 标记需要重点复习的考点，点击对勾 ✔️ 标记为已掌握。";
      } else if (mode === 'recall') {
        tipText.innerHTML = "当前为<strong>主动回忆模式</strong>。答案已被隐藏。试着在大脑中拼图，然后<strong>点击卡片空白处或点击“显示答案”</strong>来核对。";
      } else if (mode === 'quiz') {
        tipText.innerHTML = "当前为<strong>闪卡测验模式</strong>。系统将随机抽取您选定区域的卡片。点击“显示解析”核对后，标记“已掌握”或“需复习”以调整队列。";
        startQuiz();
        return; // quiz renders separately
      }
      
      renderContent();
    }

    // Stats Management
    function updateStats() {
      const total = DATA.length;
      const mastered = masteredItems.length;
      const starred = starredItems.length;
      
      // Update stats displays
      document.getElementById('stat-mastered').innerText = mastered;
      document.getElementById('stat-starred').innerText = starred;
      
      const percent = total > 0 ? Math.round((mastered / total) * 100) : 0;
      document.getElementById('progress-percent').innerText = `${percent}%`;
      document.getElementById('progress-bar').style.width = `${percent}%`;
      
      // Save stats
      localStorage.setItem('anatomy_mastered', JSON.stringify(masteredItems));
      localStorage.setItem('anatomy_starred', JSON.stringify(starredItems));
    }

    function resetProgress() {
      if (confirm("确定要清空您的所有学习掌握记录与标星标记吗？此操作无法撤销。")) {
        masteredItems = [];
        starredItems = [];
        expandedAnswers = [];
        updateStats();
        if (viewMode === 'quiz') {
          startQuiz();
        } else {
          renderContent();
        }
      }
    }

    // Star & Check actions
    function toggleStar(id, event) {
      if (event) event.stopPropagation();
      const idx = starredItems.indexOf(id);
      if (idx > -1) {
        starredItems.splice(idx, 1);
      } else {
        starredItems.push(id);
        // If we star it, remove from mastered (needs more study)
        const masteredIdx = masteredItems.indexOf(id);
        if (masteredIdx > -1) {
          masteredItems.splice(masteredIdx, 1);
        }
      }
      updateStats();
      
      if (viewMode === 'quiz') {
        updateQuizCardState();
      } else {
        renderContent();
      }
    }

    function toggleMastered(id, event) {
      if (event) event.stopPropagation();
      const idx = masteredItems.indexOf(id);
      if (idx > -1) {
        masteredItems.splice(idx, 1);
      } else {
        masteredItems.push(id);
        // If mastered, remove from starred
        const starredIdx = starredItems.indexOf(id);
        if (starredIdx > -1) {
          starredItems.splice(starredIdx, 1);
        }
      }
      updateStats();
      
      if (viewMode === 'quiz') {
        updateQuizCardState();
      } else {
        renderContent();
      }
    }

    // Filter Helper
    function getFilteredData() {
      const searchVal = document.getElementById('search-box').value.trim().toLowerCase();
      
      return DATA.filter(item => {
        // Region filter
        if (currentRegion !== 'all' && item.region !== currentRegion) return false;
        
        // Type filter
        if (filterType !== 'all' && item.type !== filterType) return false;
        
        // Starred filter
        if (filterStarred && !starredItems.includes(item.id)) return false;
        
        // Unstudied filter
        if (filterUnstudied && (masteredItems.includes(item.id) || starredItems.includes(item.id))) return false;
        
        // Search filter
        if (searchVal) {
          const matchTitle = item.title.toLowerCase().includes(searchVal);
          const matchEnglish = item.english.toLowerCase().includes(searchVal);
          const matchContent = item.content.toLowerCase().includes(searchVal);
          const matchRegion = item.region.toLowerCase().includes(searchVal);
          return matchTitle || matchEnglish || matchContent || matchRegion;
        }
        
        return true;
      });
    }

    // Toggle reveal for Recall mode
    function toggleRevealAnswer(id) {
      const idx = expandedAnswers.indexOf(id);
      if (idx > -1) {
        expandedAnswers.splice(idx, 1);
      } else {
        expandedAnswers.push(id);
      }
      renderContent();
    }

    // Main Renderer for Browse & Recall Modes
    function renderContent() {
      const container = document.getElementById('content-container');
      const filtered = getFilteredData();
      
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="glass-card empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div style="font-weight: 500; font-size: 16px;">没有找到符合当前筛选条件的题目</div>
            <div style="font-size: 13px; color: var(--text-muted);">可以尝试清除搜索框、更改题型选项或切换区域。</div>
          </div>
        `;
        return;
      }
      
      let html = `<div class="cards-grid">`;
      
      filtered.forEach(item => {
        const isMastered = masteredItems.includes(item.id);
        const isStarred = starredItems.includes(item.id);
        const typeLabel = item.type === "term" ? "名词解释" : "问答简答";
        const typeClass = item.type === "term" ? "badge-term" : "badge-question";
        
        const isAnswerRevealed = viewMode === 'browse' || expandedAnswers.includes(item.id);
        
        html += `
          <div class="glass-card study-card ${isMastered ? 'mastered' : ''}" id="card-${item.id}" onclick="handleCardClick(${item.id})">

            <div class="card-meta">
              <div class="card-badges">
                <span class="badge-tag ${typeClass}">${typeLabel}</span>

              </div>

              </div>
            `}
          </div>
        `;
      });
      
      html += `</div>`;
      container.innerHTML = html;
    }

    function handleCardClick(id) {
      if (viewMode === 'recall') {
        toggleRevealAnswer(id);
      }
    }

    // Quiz Mode Logic
    function startQuiz() {
      // Get filtered queue
      const candidates = getFilteredData();
      
      if (candidates.length === 0) {
        document.getElementById('content-container').innerHTML = `
          <div class="glass-card empty-state">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div style="font-weight: 500; font-size: 16px;">测验队列为空</div>
            <div style="font-size: 13px; color: var(--text-muted);">请调整检索条件，或者标记部分卡片为“需复习”。</div>
          </div>
        `;
        return;
      }
      
      // Shuffle the copy
      quizQueue = [...candidates].sort(() => Math.random() - 0.5);
      quizIndex = 0;
      quizShowAnswer = false;
      renderQuizCard();
    }

    function renderQuizCard() {
      const container = document.getElementById('content-container');
      if (quizQueue.length === 0 || quizIndex >= quizQueue.length) {
        container.innerHTML = `
          <div class="glass-card empty-state">
            <svg style="color:var(--accent-success);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div style="font-weight: 600; font-size: 18px; color: var(--text-primary);">太棒了！本轮测验已完成</div>
            <div style="font-size: 13px; color: var(--text-muted); max-width:400px; line-height:1.6; margin-top:5px;">
              您已经测验完了这一组所有的 <strong>${quizQueue.length}</strong> 道题。可以切换分类/区域，或者点击下方重新开始新一轮乱序抽题。

          </div>

        return;

      const item = quizQueue[quizIndex];

      const typeClass = item.type === "term" ? "badge-term" : "badge-question";

      container.innerHTML = `

                          onclick="toggleStar(${item.id}, event)" 
                          data-tooltip="标星（需复习）">
                    <svg viewBox="0 0 24 24">
                      <path d="M11.48 3.499c.174-.427.772-.427.946 0l2.22 5.438a.5.5 0 00.376.315l5.88.756c.465.06.65.632.314.952l-4.4 4.192a.5.5 0 00-.14.453l1.196 5.8a.5.5 0 00-.736.564L12 18.9l-5.02 2.915a.5.5 0 00-.736-.564L7.44 15.44a.5.5 0 00-.14-.453l-4.4-4.192a.5.5 0 00.314-.952l5.88-.756a.5.5 0 00.376-.315l2.22-5.438z" />
                    </svg>
                  </button>
                  <button class="card-action-btn check-btn ${isMastered ? 'active' : ''}" 
                          onclick="toggleMastered(${item.id}, event)" 
                          data-tooltip="标为已掌握">
                    <svg viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                  </button>
                </div>
              </div>
              
              <!-- Content -->
              <div>
                <h3 class="card-title" style="font-size:22px; margin-bottom:15px;">
                  <span>${item.title}</span>
                  ${item.english ? `<span class="english-title" style="font-size:16px;">${item.english}</span>` : ''}
                </h3>
                
                ${quizShowAnswer ? `
                  <div class="card-body" style="display:block;">
                    ${item.content}
                  </div>
                ` : `
                  <div class="flashcard-placeholder" onclick="revealQuizAnswer()" style="padding:40px;">
                    <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />

              <button class="quiz-btn quiz-btn-primary" onclick="revealQuizAnswer()">显示解析 (Show Answer)</button>
            ` : `
              <button class="quiz-btn quiz-btn-hard" onclick="markQuizCard(false)">
                <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                仍需复习 (Star)
              </button>
              <button class="quiz-btn quiz-btn-easy" onclick="markQuizCard(true)">
                <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                已经掌握 (Got it)
              </button>
            `}
          </div>
        </div>
      `;

      // Allow spacebar key to reveal/confirm
      document.onkeydown = function(e) {
        if (viewMode !== 'quiz') return;
        if (e.keyCode === 32) { // Space
          e.preventDefault();
          if (!quizShowAnswer) {
            revealQuizAnswer();
          }
        } else if (e.keyCode === 49 && quizShowAnswer) { // "1" key
          markQuizCard(false);
        } else if (e.keyCode === 50 && quizShowAnswer) { // "2" key
          markQuizCard(true);
        }
      }
    }

    function revealQuizAnswer() {
      quizShowAnswer = true;
      renderQuizCard();
    }

    function markQuizCard(isGot) {
      const item = quizQueue[quizIndex];
      if (isGot) {
        // Mastered
        if (!masteredItems.includes(item.id)) masteredItems.push(item.id);
        const starIdx = starredItems.indexOf(item.id);
        if (starIdx > -1) starredItems.splice(starIdx, 1);
      } else {
        // Need Review
        if (!starredItems.includes(item.id)) starredItems.push(item.id);
        const masteredIdx = masteredItems.indexOf(item.id);
        if (masteredIdx > -1) masteredItems.splice(masteredIdx, 1);
      }
      
      updateStats();
      
      // Proceed to next card
      quizIndex++;
      quizShowAnswer = false;
      renderQuizCard();
    }

    function updateQuizCardState() {
      // Updates visual indicators in the card itself without reloading the whole queue
      const item = quizQueue[quizIndex];
      if (!item) return;
      const isMastered = masteredItems.includes(item.id);
      const isStarred = starredItems.includes(item.id);
      
      const starBtn = document.querySelector('.quiz-card .star-btn');
      const checkBtn = document.querySelector('.quiz-card .check-btn');
      
      if (starBtn && checkBtn) {
        if (isStarred) starBtn.classList.add('active');
        else starBtn.classList.remove('active');
        
        if (isMastered) checkBtn.classList.add('active');
        else checkBtn.classList.remove('active');
      }
    }

  </script>
</body>
</html>
