/* ---------- 考试/刷题引擎 ---------- */
let STATE=null;
let examSeq=0;
function leaveQuiz(){ if(STATE && STATE._iv){clearInterval(STATE._iv); STATE._iv=null;} }
function startExam(mode){
  let qs;
  if(mode==='full') qs=shuffle(QUIZ).slice(0,100);
  else if(mode==='all') qs=QUIZ.slice();
  else qs=shuffle(QUIZ).slice(0,100);
  beginQuiz(qs, mode==='full'?'模拟考试(100题)':'全题库练习');
}
function beginQuiz(qs, title){
  const limit= title.includes('模拟')?120*60:0;
  const myId=++examSeq;
  if(STATE && STATE._iv) clearInterval(STATE._iv);
  STATE={qs, idx:0, picks:new Array(qs.length).fill(-1), answered:new Array(qs.length).fill(false), title, start:Date.now(), limit, _id:myId};
  renderQuiz();
}
function renderQuiz(){
  const {qs,idx}=STATE;
  const q=qs[idx];
  const subj=REVIEW[q.s].subject;
  const ch=REVIEW[q.s].chapters[q.c].name;
  let html=`<div class="card">
    <div class="qbar">
      <span class="tag">${STATE.title}</span>
      <span class="tag">${subj}</span>
      <span class="tag">第 ${idx+1}/${qs.length} 题</span>
      ${STATE.limit?`<span class="tag" id="timer"></span>`:''}
      <span class="tag">已答 ${STATE.answered.filter(Boolean).length}</span>
    </div>`;
  // progress dots
  html+=`<div class="qnav">`;
  qs.forEach((x,i)=>{
    let cls='dot';
    if(STATE.answered[i]) cls+= STATE.picks[i]===x.a?' done':' bad';
    html+=`<div class="${cls}" onclick="gotoQ(${i})">${i+1}</div>`;
  });
  html+=`</div>`;
  html+=`<div style="font-size:16px;font-weight:600;margin:6px 0 4px">${q.q}</div>`;
  q.o.forEach((o,i)=>{
    let cls='opt';
    if(STATE.answered[idx]){
      if(i===q.a) cls+=' correct';
      else if(i===STATE.picks[idx]) cls+=' wrong';
    } else if(STATE.picks[idx]===i) cls+=' sel';
    html+=`<div class="${cls}" onclick="pickOpt(${i})"><span class="lk">${'ABCD'[i]}</span>${o}</div>`;
  });
  if(STATE.answered[idx]){
    const right=STATE.picks[idx]===q.a;
    html+=`<div class="exp"><b>${right?'✅ 回答正确':'❌ 回答错误'} · 正确答案：${'ABCD'[q.a]}</b><br>${q.e}</div>`;
  }
  html+=`<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">`;
  if(!STATE.answered[idx]){
    html+=`<button class="btn" onclick="submitAns()">确定答案</button>`;
  } else if(idx<qs.length-1){
    html+=`<button class="btn" onclick="gotoQ(${idx+1})">下一题 →</button>`;
    html+=`<button class="btn ghost sm" onclick="gotoQ(${idx-1})">← 上一题</button>`;
  } else {
    html+=`<button class="btn" onclick="finishQuiz()">交卷查看成绩</button>`;
    html+=`<button class="btn ghost sm" onclick="gotoQ(${idx-1})">← 上一题</button>`;
  }
  html+=`<button class="btn ghost sm" onclick="renderMenu()">退出</button>`;
  html+=`</div></div>`;
  main.innerHTML=html;
  if(STATE.limit) startTimer();
}
function startTimer(){
  const el=document.getElementById('timer');
  const myId=STATE._id;
  function t(){
    if(!STATE || STATE._id!==myId) return;   // 只响应本场考试的计时，杜绝旧定时器干扰
    const left=STATE.limit - Math.floor((Date.now()-STATE.start)/1000);
    if(left<=0){el.textContent='时间到';finishQuiz();return;}
    const m=Math.floor(left/60),s=left%60;
    el.textContent=`⏱ ${m}:${String(s).padStart(2,'0')}`;
  }
  t(); clearInterval(STATE._iv); STATE._iv=setInterval(t,1000);
}
function pickOpt(i){ if(STATE.answered[STATE.idx])return; STATE.picks[STATE.idx]=i;
  document.querySelectorAll('.opt').forEach((o,k)=>{o.classList.toggle('sel',k===i);}); }
function submitAns(){
  const i=STATE.idx;
  if(STATE.picks[i]<0){toast('请先选择一个答案');return;}
  if(!STATE.answered[i]){
    STATE.answered[i]=true;
    if(STATE.picks[i]!==STATE.qs[i].a){
      const key=STATE.qs[i].id;
      if(!WRONG.includes(key)){WRONG.push(key);saveWrong();}
    }
  }
  renderQuiz();
}
function gotoQ(i){ if(i<0||i>=STATE.qs.length)return; STATE.idx=i; renderQuiz(); }
function finishQuiz(){
  clearInterval(STATE._iv);
  const {qs}=STATE;
  const right=qs.filter((q,i)=>STATE.picks[i]===q.a).length;
  const pct=Math.round(right/qs.length*100);
  let html=`<div class="card" style="text-align:center">
    <h2>成绩报告</h2>
    <div class="score">${right} / ${qs.length}</div>
    <div class="small">正确率 ${pct}%</div>
    <div class="stat" style="justify-content:center">
      <div class="box"><b>${right}</b><span>正确</span></div>
      <div class="box"><b>${qs.length-right}</b><span>错误</span></div>
      <div class="box"><b>${Math.round((Date.now()-STATE.start)/1000/60)}</b><span>用时(分)</span></div>
    </div>
    <button class="btn" onclick="renderMenu()">返回刷题中心</button>
    <button class="btn ghost" onclick="reviewWrongInExam()">只看错题</button>
  </div>`;
  main.innerHTML=html;
  buildNav(); // refresh wrong count
}
function reviewWrongInExam(){
  const wrong=STATE.qs.filter((q,i)=>STATE.picks[i]!==q.a);
  if(!wrong.length){toast('本次没有错题 🎉');return;}
  beginQuiz(wrong,'本次错题回顾');
}

/* ---------- 错题本 ---------- */
function renderWrong(){
  leaveQuiz();
  const qs=QUIZ.filter(q=>WRONG.includes(q.id));
  if(!qs.length){main.innerHTML=`<div class="card"><h2>错题本</h2><p class="small">还没有错题。去刷题吧！</p><button class="btn" onclick="renderMenu()">去刷题</button></div>`;return;}
  main.innerHTML=`<div class="card"><h2>错题本 (${qs.length})</h2>
    <div class="lead">这些是你曾经答错的题，建议反复练习直到全对。</div>
    <button class="btn" onclick="beginQuiz(shuffle(QUIZ.filter(q=>WRONG.includes(q.id))),'错题重练')">开始重练全部错题</button>
    <button class="btn ghost sm" onclick="clearWrong()">清空错题本</button></div>`;
}
function clearWrong(){WRONG=[];saveWrong();buildNav();renderWrong();toast('已清空');}

/* ---------- 启动 ---------- */
buildNav();
renderMenu();
</script>
</body>
</html>
