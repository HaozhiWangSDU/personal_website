<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基础医学综合考试 · 复习与刷题</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#e5e7eb;
    --brand:#2563eb; --brand2:#1d4ed8; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
    --chip:#eef2ff; --soft:#f1f5f9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.7; font-size:15px;}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,#2563eb,#1e40af);
    color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
  header .meta{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:13px}
  header .cd{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px}
  header .cd b{color:#fde68a}
  .wrap{display:flex;min-height:calc(100vh - 52px)}
  nav{width:268px;flex:0 0 268px;background:var(--panel);border-right:1px solid var(--line);
    overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
  nav .nsec{padding:8px 12px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:1px}
  nav a{display:block;padding:9px 16px;color:var(--ink);text-decoration:none;cursor:pointer;border-left:3px solid transparent;font-size:14px}
  nav a:hover{background:var(--soft)}
  nav a.active{background:var(--chip);border-left-color:var(--brand);color:var(--brand2);font-weight:600}
  nav .subj{font-weight:700;color:var(--brand2)}
  nav .ch{font-size:13px;color:#374151;padding-left:30px}
  main{flex:1;padding:20px 28px 80px;max-width:1100px;margin:0 auto;width:100%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{margin:0 0 4px;font-size:20px;color:var(--brand2)}
  .card .lead{color:var(--sub);font-size:13px;margin-bottom:12px}
  .pill{display:inline-block;background:var(--chip);color:var(--brand2);border-radius:999px;padding:2px 10px;font-size:12px;margin:0 6px 6px 0}
  .search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:14px}
  .chapter{margin-bottom:26px}
  .chapter > h3{font-size:17px;border-left:4px solid var(--brand);padding-left:10px;margin:22px 0 10px;color:#111827}
  .kp{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:10px}
  .kp b{color:var(--brand2)}
  .kp ul{margin:6px 0 0;padding-left:20px}
  .kp li{margin:2px 0}
  mark{background:#fde68a;padding:0 2px;border-radius:3px}
  /* quiz */
  .qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .qbar .tag{background:var(--chip);color:var(--brand2);border-radius:8px;padding:4px 10px;font-size:13px}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:8px 0;cursor:pointer;transition:.15s;background:#fff}
  .opt:hover{border-color:var(--brand)}
  .opt.sel{border-color:var(--brand);background:var(--chip)}
  .opt.correct{border-color:var(--ok);background:#dcfce7}
  .opt.wrong{border-color:var(--bad);background:#fee2e2}
  .opt .lk{font-weight:700;margin-right:8px}
  .btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;font-weight:600}
  .btn:hover{background:var(--brand2)}
  .btn.ghost{background:#fff;color:var(--brand2);border:1px solid var(--brand)}
  .btn.sm{padding:6px 12px;font-size:13px}
  .exp{margin-top:12px;padding:12px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:14px}
  .exp b{color:var(--warn)}
  .qnav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
  .qnav .dot{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;background:#fff}
  .qnav .dot.done{border-color:var(--brand);color:var(--brand2);font-weight:700}
  .qnav .dot.bad{background:#fee2e2;border-color:var(--bad);color:var(--bad)}
  .score{font-size:34px;font-weight:800;color:var(--brand2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
  .menu{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:.15s}
  .menu:hover{border-color:var(--brand);box-shadow:0 4px 14px rgba(37,99,235,.12)}
  .menu h4{margin:0 0 4px;color:var(--brand2)}
  .menu p{margin:0;color:var(--sub);font-size:13px}
  .stat{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 14px}
  .stat .box{background:var(--soft);border-radius:10px;padding:10px 16px;text-align:center}
  .stat .box b{display:block;font-size:22px;color:var(--brand2)}
  .stat .box span{font-size:12px;color:var(--sub)}
  .hidden{display:none}
  .small{font-size:13px;color:var(--sub)}
  .foot{color:var(--sub);font-size:12px;text-align:center;margin-top:30px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
  .toast.show{opacity:.95}
</style>
</head>

<script>
const REVIEW = [{"subject": "生物化学", "score": 20, "hours": "约10小时", "chapters": [{"name": "一、蛋白质的结构与功能", "html": "\n<div class=\"kp\"><b>⭐1. 氨基酸结构与分类</b>\n<ul>\n<li>组成蛋白质的基本单位：<b>L-α-氨基酸</b>（甘氨酸除外无手性）。</li>\n<li>分类：①非极性疏水（丙、缬、亮、异亮、苯丙、色、蛋/甲硫、脯）；②极性不带电（丝、苏、半胱、酪、天冬酰胺、谷氨酰胺、甘）；③酸性（天冬、谷，带负电）；④碱性（赖、精、组，带正电）。</li>\n<li><b>含硫氨基酸</b>：蛋氨酸(甲硫)、半胱、胱（二硫键）；<b>含芳环</b>：苯丙、酪、色；<b>亚氨基酸</b>：脯、羟脯。</li>\n<li>两性解离与等电点 pI：溶液 pH=pI 时呈兼性离子，净电荷为零。</li>\n</ul></div>\n<div class=\"kp\"><b>2. 肽键与肽链</b>\n<ul><li>肽键 = 一分子氨基酸的 α-羧基与另一分子 α-氨基脱水缩合形成的酰胺键（—CO—NH—），具有<b>部分双键性质</b>（不能自由旋转），6 原子共面（肽单元/酰胺平面）。</li>\n<li>方向性：N 端（氨基端）→ C 端（羧基端）。</li></ul></div>\n<div class=\"kp\"><b>3–5. 蛋白质各级结构</b>\n<ul>\n<li><b>一级结构</b>：氨基酸的线性排列顺序，连接键为<b>肽键</b>（维系稳定=肽键+二硫键）。一级结构决定高级结构与功能。</li>\n<li><b>二级结构</b>：主链局部空间构象，靠<b>氢键</b>维系。类型：α-螺旋、β-折叠、β-转角、无规卷曲。\n <br><b>α-螺旋要点</b>：右手螺旋，每圈 3.6 个氨基酸，螺距 0.54nm；侧链伸向外侧；氢键环内（第 n 与 n+4）。</li>\n<li><b>三级结构</b>：整条肽链全部原子的空间排布，靠<b>次级键</b>（疏水作用、氢键、离子键、范德华力、二硫键）维系。<b>蛋白质一定具有三级结构</b>（单链蛋白三级即具活性）。</li>\n<li><b>四级结构</b>：多条具独立三级结构的亚基聚合，连接键为次级键；<b>并非所有蛋白质都有</b>（单体蛋白无四级结构，也无亚基）。</li>\n</ul></div>\n<div class=\"kp\"><b>6–7. 结构与功能关系</b>\n<ul><li>一级结构相似→功能相似；一级结构改变（如镰刀型贫血 Hbβ 第6位 Glu→Val）可致疾病。</li>\n<li>高级结构改变（变性）使活性丧失，但一级结构不变。</li></ul></div>\n<div class=\"kp\"><b>⭐8. 蛋白质理化性质</b>\n<ul>\n<li><b>两性解离</b>：电泳、层析分离基础。</li>\n<li><b>紫外吸收</b>：色、酪氨酸 280nm 处有最大吸收（定量为常用）。</li>\n<li><b>变性</b>：理化因素破坏<b>次级键</b>（不破坏肽键），使空间构象破坏、理化性质改变、生物活性丧失；溶解度↓、黏度↑、易被蛋白酶水解。<b>凝固、沉淀≠变性</b>（盐析不引起变性）。</li>\n</ul></div>"}, {"name": "二、核酸的结构与功能", "html": "\n<div class=\"kp\"><b>1. 核苷酸组成</b>\n<ul><li>基本单位：核苷酸 = 碱基 + 戊糖 + 磷酸。DNA 戊糖为<b>脱氧核糖</b>，RNA 为<b>核糖</b>。</li>\n<li>碱基：嘌呤（A、G）+ 嘧啶（T、C、U）。DNA：A/T/G/C；RNA：A/U/G/C。</li></ul></div>\n<div class=\"kp\"><b>⭐2. DNA 结构与功能</b>\n<ul>\n<li><b>Chargaff 规则</b>（碱基组成规律）：A=T，G=C，A+G=C+T（嘌呤=嘧啶）。</li>\n<li><b>一级结构</b>：4 种 dNTP 的排列顺序。</li>\n<li><b>双螺旋（Watson-Crick）</b>：右手螺旋；直径 2nm；碱基互补配对（A=T 2氢键，G≡C 3氢键）；靠<b>碱基堆积力+氢键</b>维系；大沟小沟是蛋白识别部位；两条链反向平行。</li>\n<li><b>核小体</b>：DNA 缠绕组蛋白八聚体（H2A/H2B/H3/H4 各2），是染色质基本单位；连接区为 H1。DNA→核小体→螺线管→染色体。</li>\n</ul></div>\n<div class=\"kp\"><b>3. 变性/复性/杂交</b>\n<ul><li><b>变性</b>：加热等使双链解开成单链，氢键断裂，<b>不破坏磷酸二酯键</b>；A260 增色效应↑；Tm 为 50% 变性温度（GC 含量越高 Tm 越高）。</li>\n<li><b>复性/退火</b>：缓慢冷却恢复双链。<b>分子杂交</b>：不同来源核酸单链按碱基互补形成杂化双链。</li></ul></div>\n<div class=\"kp\"><b>⭐4. RNA 种类与功能</b>\n<ul>\n<li><b>mRNA</b>：携带遗传信息，作为翻译模板；5′帽、3′poly(A)尾；有遗传密码。</li>\n<li><b>tRNA</b>：转运氨基酸；含<b>反密码子</b>识别 mRNA 密码子；3′端 CCA 结合氨基酸；有稀有碱基（假尿苷等）；三叶草结构。</li>\n<li><b>rRNA</b>：核糖体组成成分，含量最多（约占 RNA 80%）。</li>\n</ul></div>"}, {"name": "三、酶和酶促反应", "html": "\n<div class=\"kp\"><b>1–2. 活性中心、同工酶、辅酶</b>\n<ul><li><b>活性中心</b>：酶分子中直接与底物结合并催化反应的部位（必需基团组成）。</li>\n<li><b>同工酶</b>：催化相同反应、但酶蛋白分子结构/理化/免疫不同（如 LDH 五种，CK 三种）。</li>\n<li>辅酶/辅基多为<b>维生素</b>衍生物：NAD⁺(Vit B3/烟酸)、FAD/FMN(Vit B2)、CoA(Vit B5)、TPP(Vit B1)、磷酸吡哆醛(Vit B6)、生物素(Vit B7)、叶酸(Vit B9)、B12。</li></ul></div>\n<div class=\"kp\"><b>3–4. 酶促特点与动力学</b>\n<ul>\n<li>特点：高效、专一（特异性）、可调节、不稳定性；<b>不改变化学平衡</b>。</li>\n<li><b>Km</b>：反应速率达 Vmax/2 时的底物浓度；反映酶与底物亲和力，Km 越小亲和力越大；<b>是酶的特征常数</b>。</li>\n<li><b>Vmax</b>：酶完全被底物饱和时的最大速率。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐5. 抑制作用</b>\n<ul>\n<li><b>不可逆抑制</b>：共价结合（如有机磷抑制胆碱酯酶、重金属、青霉素抑制转肽酶）。</li>\n<li><b>可逆性抑制</b>：\n <br>· <b>竞争性</b>：抑制剂与底物结构相似，竞争活性中心；Km↑，Vmax 不变（加大底物可解除，如磺胺、甲氨蝶呤）。\n <br>· 非竞争性：Km 不变，Vmax↓。\n <br>· 反竞争性：Km↓，Vmax↓。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐6. 酶活性调节</b>\n<ul>\n<li><b>别构调节</b>：别构酶（多亚基）受别构效应剂调节，无共价键变化（如 PFK-1 受 AMP/F-2,6-BP 激活、ATP/柠檬酸抑制）。</li>\n<li><b>共价修饰</b>：磷酸化/去磷酸化最常见（蛋白激酶使酶<b>磷酸化</b>而激活或抑制）。</li>\n<li><b>酶原激活</b>：无活性的酶原切除肽段形成活性中心（胰蛋白酶原→胰蛋白酶；胃蛋白酶原；凝血酶原）。</li>\n</ul></div>"}, {"name": "四、糖代谢", "html": "\n<div class=\"kp\"><b>⭐1. 糖酵解</b>（胞浆，无氧）\n<ul><li>关键酶：<b>己糖激酶(肝为葡萄糖激酶)、6-磷酸果糖激酶-1(PFK-1)、丙酮酸激酶</b>。</li>\n<li>关键反应：葡萄糖→…→2 丙酮酸；净生成 <b>2 ATP + 2 NADH</b>。</li>\n<li>生理意义：迅速供能（红细胞、视网膜、睾丸、无氧运动）；是某些组织主要途径。</li></ul></div>\n<div class=\"kp\"><b>2. 糖有氧氧化</b>\n<ul><li>胞浆+线粒体；丙酮酸→乙酰CoA（丙酮酸脱氢酶复合体，关键酶）→TCA。</li>\n<li>1 分子葡萄糖彻底氧化净生成 <b>30 或 32 ATP</b>。</li>\n<li><b>柠檬酸循环(TCA)意义</b>：三大营养物质最终氧化途径、物质代谢枢纽；产生 NADH/FADH₂ 与 CO₂。</li></ul></div>\n<div class=\"kp\"><b>⭐4. 磷酸戊糖途径</b>\n<ul><li>关键酶：<b>6-磷酸葡萄糖脱氢酶</b>（缺乏致蚕豆病）。</li>\n<li>重要产物：<b>NADPH</b>（供氢、抗氧化、参与合成）、<b>5-磷酸核糖</b>（核苷酸合成）。</li></ul></div>\n<div class=\"kp\"><b>⭐5. 糖原合成与分解</b>\n<ul>\n<li>合成关键酶：<b>糖原合酶</b>（激活剂：胰岛素、葡萄糖-6-P）；分解关键酶：<b>糖原磷酸化酶</b>（激活剂：胰高血糖素、肾上腺素）。</li>\n<li><b>肝糖原</b>可补充血糖（有葡萄糖-6-磷酸酶）；<b>肌糖原</b>不能补充血糖（肌肉无 G-6-P 酶），仅供肌肉自身。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐6. 糖异生</b>（肝为主，线粒体+胞浆）\n<ul><li>原料：乳酸、生糖氨基酸、甘油。</li>\n<li>关键酶（绕过糖酵解不可逆步）：<b>丙酮酸羧化酶、PEP羧激酶、果糖-1,6-二磷酸酶、葡萄糖-6-磷酸酶</b>。</li>\n<li>意义：空腹/饥饿维持血糖；<b>短期饥饿时肝糖异生活跃增强</b>。</li></ul></div>\n<div class=\"kp\"><b>⭐7–8. 乳酸循环 & 血糖调节</b>\n<ul>\n<li><b>乳酸循环(Cori)</b>：肌肉乳酸→血→肝→葡萄糖→血→肌肉，避免乳酸浪费并防酸中毒。</li>\n<li>血糖来源：食物、肝糖原分解、糖异生；去路：氧化、合成糖原/脂肪/氨基酸。</li>\n<li>调节：<b>胰岛素</b>降血糖（促进糖原合成、糖氧化、抑制糖异生）；<b>胰高血糖素</b>升血糖（促进糖原分解、糖异生）。</li>\n</ul></div>"}, {"name": "五、生物氧化", "html": "\n<div class=\"kp\"><b>核心概念</b>\n<ul>\n<li><b>氧化磷酸化</b>：代谢物脱下的氢经呼吸链传给 O₂ 生成水，释放能量驱动 ATP 合酶合成 ATP（<b>最主要供能方式</b>）。</li>\n<li><b>两条呼吸链</b>：NADH 呼吸链（复合体Ⅰ→Ⅲ→Ⅳ，P/O≈2.5）；FADH₂ 呼吸链（琥珀酸→复合体Ⅱ→Ⅲ→Ⅳ，P/O≈1.5）。</li>\n<li><b>ATP 合酶</b>：F₀（质子通道）+ F₁（催化亚基，β 亚基催化 ATP 合成），靠质子梯度驱动旋转。</li>\n<li>调节因素：ADP（主要）、甲状腺素（↑耗氧↑产热）、解偶联剂（如 DNP、解偶联蛋白，使产热不产 ATP，如棕色脂肪）。</li>\n</ul></div>"}, {"name": "六、脂质代谢", "html": "\n<div class=\"kp\"><b>⭐2–4. 消化、合成与脂肪动员</b>\n<ul>\n<li>消化：胆汁酸盐乳化 + 胰脂酶；产物形成<b>乳糜微粒(CM)</b>经淋巴入血。</li>\n<li><b>脂肪动员</b>：脂肪组织甘油三酯被脂肪酶水解为脂肪酸+甘油入血；激素敏感性脂肪酶受胰高血糖素/肾上腺素激活、胰岛素抑制。</li>\n<li>脂肪酸合成部位<b>胞浆</b>（肝为主），原料 <b>乙酰CoA + NADPH + ATP</b>；乙酰CoA 由柠檬酸-丙酮酸循环运出线粒体。</li></ul></div>\n<div class=\"kp\"><b>⭐5–6. β-氧化 & 酮体</b>\n<ul>\n<li><b>脂肪酸 β-氧化</b>（线粒体）：活化→入线粒体（肉碱穿梭，CATⅠ 限速）→脱氢、加水、再脱氢、硫解，每轮少 2C 生成 1 乙酰CoA+NADH+FADH₂。</li>\n<li><b>酮体</b>（肝生成、肝外利用）：乙酰乙酸、β-羟丁酸、丙酮。原料=乙酰CoA；生成关键酶=<b>HMG-CoA 合酶</b>。</li>\n<li>生理意义：饥饿/低血糖时脑组织重要能源。<b>酮症酸中毒</b>：糖尿病/长期饥饿时酮体过多（酸性）。</li></ul></div>\n<div class=\"kp\"><b>7–8. 磷脂 & 胆固醇</b>\n<ul>\n<li>甘油磷脂合成原料：甘油、脂肪酸、磷酸、胆碱/乙醇胺/丝氨酸/肌醇。</li>\n<li><b>胆固醇</b>：合成部位肝（胞浆+内质网），原料<b>乙酰CoA</b>，关键酶 <b>HMG-CoA 还原酶</b>（他汀类抑制之→降血脂）。</li>\n<li>转化：胆汁酸（主要）、类固醇激素、Vit D₃。</li></ul></div>\n<div class=\"kp\"><b>⭐9–10. 血浆脂蛋白</b>\n<ul>\n<li>分类（密度法）：CM、VLDL、LDL、HDL；电泳法：乳糜微粒、前β、β、α。</li>\n<li>功能：CM 转运外源TG；VLDL 转运内源TG；<b>LDL 转运胆固醇至外周（致动脉粥样硬化）</b>；<b>HDL 逆向转运胆固醇回肝（抗动脉粥样硬化）</b>。</li>\n<li>高脂蛋白血症：Ⅰ型CM↑、Ⅱa型LDL↑、Ⅳ型VLDL↑等。</li></ul></div>"}, {"name": "七、蛋白质消化吸收和氨基酸代谢", "html": "\n<div class=\"kp\"><b>⭐1–2. 营养 & 消化吸收</b>\n<ul>\n<li><b>8 种必需氨基酸</b>：缬、异亮、亮、苯丙、蛋(甲硫)、色、苏、赖（口诀：写一两本亮色书来）。</li>\n<li>消化：胃蛋白酶（胃）+ 胰蛋白酶/糜蛋白酶/羧肽酶（小肠）；吸收以二肽/氨基酸形式。</li>\n<li><b>腐败作用</b>：肠道细菌对未消化蛋白的分解（产生氨、胺类、吲哚等）。</li></ul></div>\n<div class=\"kp\"><b>3–5. 脱氨基、氨代谢</b>\n<ul>\n<li>脱氨基主要方式：<b>联合脱氨基</b>（转氨基+谷氨酸氧化脱氨，最重要）。</li>\n<li><b>体内氨来源</b>：氨基酸脱氨、肠道吸收、肾谷氨酰胺分解。<b>转运</b>：<b>丙氨酸-葡萄糖循环</b>（肌→肝）、<b>谷氨酰胺</b>（脑/肌→肝/肾）。</li>\n<li><b>氨的去路</b>：肝合成<b>尿素</b>（鸟氨酸循环，主要解毒途径，关键酶=精氨酸代琥珀酸合成酶）；肾排 NH₄⁺。</li>\n<li><b>高血氨</b>：肝性脑病；临床灌肠用<b>酸性溶液</b>（使 NH₃→NH₄⁺减少吸收）。</li></ul></div>\n<div class=\"kp\"><b>⭐6–8. 一碳单位、甲硫氨酸、苯丙/酪</b>\n<ul>\n<li><b>一碳单位</b>：甲基、亚甲基等，载体=<b>四氢叶酸(FH₄)</b>；来源丝、甘、组、色；意义：核苷酸合成、甲硫氨酸生成；缺乏→巨幼贫。</li>\n<li><b>甲硫氨酸循环</b>：甲硫氨酸→S-腺苷甲硫氨酸(SAM，活性甲基供体)→同型半胱氨酸→甲硫氨酸（需 FH₄、Vit B12）。</li>\n<li><b>苯丙氨酸→酪氨酸</b>（需<b>苯丙氨酸羟化酶</b>，辅酶四氢生物蝶呤）；缺乏→<b>苯丙酮尿症(PKU)</b>，酪氨酸供给不足使毛发/皮肤色素少、尿有鼠臭味。</li>\n<li>酪氨酸代谢：黑色素（酪氨酸酶缺乏→白化病）、儿茶酚胺、甲状腺素。</li></ul></div>"}, {"name": "八、核苷酸代谢", "html": "\n<div class=\"kp\"><b>⭐要点</b>\n<ul>\n<li><b>嘌呤从头合成原料</b>：天冬氨酸、谷氨酰胺、甘氨酸、CO₂、一碳单位、PRPP（<b>不是</b>尿素循环成分）。产物 IMP→AMP/GMP。</li>\n<li><b>嘌呤分解终产物</b>：<b>尿酸</b>（人/灵长类）；过高→痛风。痛风治疗 <b>别嘌醇</b>抑制黄嘌呤氧化酶。</li>\n<li><b>嘧啶从头合成原料</b>：天冬氨酸、谷氨酰胺、CO₂（先成嘧啶环再加核糖）。</li>\n<li><b>核苷酸抗代谢物</b>：① 嘌呤类似物（6-巯基嘌呤 6-MP）；② 嘧啶类似物（5-氟尿嘧啶 5-FU，抑制胸苷酸合成酶）；③ 叶酸类似物（甲氨蝶呤 MTX，抑制二氢叶酸还原酶）；④ 氨基酸类似物。</li>\n</ul></div>"}, {"name": "九–十四、基因、复制、修复、转录、翻译、调控", "html": "\n<div class=\"kp\"><b>⭐中心法则 & 复制</b>\n<ul>\n<li><b>中心法则</b>：DNA→(复制)DNA；DNA→(转录)RNA→(翻译)蛋白质；RNA→(逆转录)DNA（病毒）。</li>\n<li><b>DNA 复制</b>：半保留、半不连续（领头链连续、随从链冈崎片段）、双向；需要解旋酶、拓扑异构酶、引物酶、DNA 聚合酶(Ⅲ延伸、Ⅰ切除引物)、连接酶。</li>\n<li><b>端粒/端粒酶</b>：解决末端缩短；端粒酶含 RNA 模板，与肿瘤、衰老相关。</li>\n<li><b>逆转录</b>：逆转录酶以 RNA 为模板合成 DNA（HIV 等）。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐DNA 损伤修复</b>\n<ul>\n<li>类型：碱基错配、缺失/插入、嘧啶二聚体（UV 致 TT  dimer）等。</li>\n<li>修复途径：<b>光修复</b>（光解酶）、切除修复（主要）、重组修复、<b>SOS 修复</b>（错误倾向，易突变）。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐转录 & 翻译</b>\n<ul>\n<li>转录模板=反义链(模板链)，酶=RNA 聚合酶（原核一种，真核 RNA pol Ⅰ/Ⅱ/Ⅲ）；真核转录后加工：5′加帽、3′加尾(polyA)、<b>剪接去除内含子</b>。</li>\n<li><b>遗传密码</b>：64 个密码子，AUG 起始兼甲硫；UAA/UAG/UGA 终止；<b>简并性、通用性、方向性(5′→3′)</b>。</li>\n<li>⭐<b>密码子的摆动性(wobble)</b>：tRNA 反密码子第 1 位（5′端）与 mRNA 密码子第 3 位（3′端）配对不严格，使一种 tRNA 可识别多种同义密码子。</li>\n<li>翻译体系：mRNA(模板)、tRNA(转运并解读密码)、rRNA(核糖体，肽键形成场所)。</li>\n</ul></div>\n<div class=\"kp\"><b>基因表达调控</b>\n<ul>\n<li>原核：<b>乳糖操纵子</b>（CAP 正调控 + Lac 阻遏蛋白负调控；别乳糖为诱导物）。</li>\n<li>真核：多层次（染色质、转录、转录后、翻译、翻译后）；<b>顺式作用元件</b>（启动子/增强子/沉默子）+ <b>反式作用因子</b>（转录因子）。</li>\n</ul></div>"}, {"name": "十五、细胞信号转导", "html": "\n<div class=\"kp\"><b>⭐核心概念</b>\n<ul>\n<li><b>受体分类</b>：膜受体（离子通道型、G 蛋白偶联 GPCR、酶偶联/单次跨膜）；胞内受体（甾体激素、甲状腺素）。</li>\n<li><b>第二信使</b>：cAMP、cGMP、IP₃、DAG、Ca²⁺、<b>NOT</b> ATP/AC。<b>AC(腺苷酸环化酶)是酶不是第二信使</b>。</li>\n<li><b>cAMP-PKA 通路</b>：激素→GPCR→Gs→AC→cAMP↑→PKA 激活。</li>\n<li><b>IP₃/DAG-Ca²⁺-PKC 通路</b>：Gq→PLC→PIP₂ 分解为 IP₃（释 Ca²⁺）+ DAG（激活 PKC）。</li>\n<li><b>酪氨酸激酶通路</b>：胰岛素/生长因子受体自身磷酸化（如 RTK、JAK-STAT）。</li>\n<li>胞内受体：类固醇激素/甲状腺素入核，与核受体结合调节基因转录。</li>\n</ul></div>"}, {"name": "十六–十八、重组DNA、癌基因、血液生化", "html": "\n<div class=\"kp\"><b>重组 DNA 技术</b>\n<ul><li>步骤：获取目的基因→载体(质粒/噬菌体)→连接→转化→筛选→表达。应用：生物制药（胰岛素、生长激素）、基因诊断/治疗。</li></ul></div>\n<div class=\"kp\"><b>癌基因 & 抑癌基因</b>\n<ul><li><b>病毒癌基因(v-onc)</b>源于细胞<b>原癌基因(c-onc)</b>；原癌基因激活→癌变。</li>\n<li><b>抑癌基因</b>：Rb、p53（ guardian of genome）等丢失/失活促癌。</li></ul></div>\n<div class=\"kp\"><b>血液 & 肝生化</b>\n<ul>\n<li>血浆蛋白：白蛋白（维持胶渗压）、球蛋白、纤维蛋白原；多由肝合成。</li>\n<li><b>血红素合成</b>：原料=甘氨酸+琥珀酰CoA+Fe²⁺；部位=骨髓幼红细胞/网织红细胞（线粒体+胞浆）；关键酶=<b>ALA 合酶</b>（受血红素反馈抑制）。</li>\n<li><b>成熟红细胞</b>：无线粒体，仅靠<b>糖酵解+磷酸戊糖途径</b>供能，生成 2,3-BPG 调节 Hb 携氧。</li>\n<li><b>肝生物转化</b>：第一相（氧化/还原/水解）+ 第二相（结合，如葡萄糖醛酸）；意义：解毒、增溶排泄。</li>\n<li>⭐<b>胆红素</b>：游离(间接)胆红素脂溶性、不能尿排、与白蛋白结合转运；肝中与葡糖醛酸结合成<b>结合(直接)胆红素</b>水溶性可尿排。溶血→间接↑；胆道梗阻→直接↑。</li>\n</ul></div>"}, {"name": "十九、肝的生物化学", "html": "\n<div class=\"kp\"><b>⭐肝代谢与黄疸</b>\n<ul>\n<li>肝是物质代谢中枢：糖(糖原、糖异生)、脂(合成、酮体、脂蛋白)、蛋白(合成血浆蛋白、尿素)、生物转化、胆汁酸代谢、胆红素代谢。</li>\n<li><b>胆汁酸</b>：由胆固醇在肝合成，胆汁酸盐乳化脂肪；肠肝循环。7α-羟化酶为限速酶。</li>\n<li><b>黄疸类型</b>：溶血性（间接胆红素↑）、肝细胞性（两者均↑）、阻塞性（直接胆红素↑，陶土样便、浓茶色尿）。</li>\n</ul></div>"}]}, {"subject": "生理学（含病理生理学）", "score": 20, "hours": "约10小时", "chapters": [{"name": "一、绪论 & 二、细胞基本功能", "html": "\n<div class=\"kp\"><b>⭐生命活动特征 & 稳态</b>\n<ul>\n<li>基本特征：<b>新陈代谢、兴奋性、适应性、生殖</b>。</li>\n<li><b>内环境</b>=细胞外液；<b>稳态</b>=内环境理化性质相对稳定（动态平衡）。</li>\n<li>调节方式：神经（快、准、短）、体液（慢、广、久）、自身调节。<b>反馈</b>：负反馈（维持稳态，多数）、正反馈（排便、分娩、凝血、动作电位 Na⁺内流）。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐跨膜转运</b>\n<ul>\n<li><b>单纯扩散</b>：脂溶性、O₂/CO₂/水(部分)；不耗能。</li>\n<li><b>易化扩散</b>：经通道（离子，速度极快，有门控）、经载体（葡萄糖、氨基酸，有饱和/竞争）。</li>\n<li><b>主动转运</b>：<b>原发性</b>=Na⁺-K⁺泵（耗 ATP，3Na⁺出2K⁺进，维持膜内外梯度、静息电位基础）；<b>继发性</b>=依赖离子梯度（如葡萄糖/氨基酸在小肠肾小管经 Na⁺-葡萄糖共转运；<b>碘离子入甲状腺上皮=继发性主动转运</b>；Na⁺-K⁺-2Cl⁻ 共转运体在髓袢升支粗段）。</li>\n<li>胞吞/胞吐：大分子（递质、激素）。</li></ul></div>\n<div class=\"kp\"><b>⭐静息/动作电位</b>\n<ul>\n<li><b>静息电位</b>：K⁺外流（接近 K⁺平衡电位），主要因膜对 K⁺通透 + Na⁺-K⁺泵。</li>\n<li><b>动作电位</b>：上升支=Na⁺内流（达 Na⁺平衡电位）；下降支=K⁺外流；机制=Na⁺通道开闭。</li>\n<li><b>兴奋性</b>：受刺激产生动作电位的能力；<b>衡量指标=阈值</b>（阈值↓兴奋性↑）。</li>\n<li><b>细胞兴奋过程兴奋性变化</b>：绝对不应期→相对不应期→超常期→低常期。<b>绝对不应期兴奋性=0</b>（不能产生任何兴奋，保证不融合、单方向传导）。</li>\n<li>局部电位：等级性、衰减、可总和；动作电位：全或无、不衰减传导。</li>\n</ul></div>\n<div class=\"kp\"><b>神经-骨骼肌接头 & 收缩</b>\n<ul>\n<li>接头传递：AP 到轴突末梢→Ca²⁺内流→ACh 释放→终板膜<b>N₂受体</b>→终板电位(EPP，属<b>局部兴奋最先发生于突触后膜/终板膜</b>)→肌膜 AP。</li>\n<li><b>兴奋-收缩耦联</b>：电→机械，关键因子 <b>Ca²⁺</b>，三联管；肌丝滑行（细肌丝向粗肌丝滑行）。</li>\n<li>前负荷(初长)、后负荷(动脉压)、肌肉收缩能力影响收缩。</li>\n</ul></div>"}, {"name": "三、血液", "html": "\n<div class=\"kp\"><b>⭐血液 & 凝血</b>\n<ul>\n<li>血量≈体重 7-8%；血浆渗透压=晶体(主要 NaCl) + 胶体(白蛋白)。</li>\n<li><b>红细胞</b>：无核成熟；生成在红骨髓，受 EPO 促进；破坏在脾。<b>巨幼贫</b>=缺叶酸/B12；<b>缺铁性贫血</b>=小细胞低色素。</li>\n<li><b>血小板</b>：参与生理止血（黏附、聚集、释放、促凝血）。</li>\n<li><b>生理性止血</b>：血管收缩→血小板血栓→血液凝固。</li>\n<li><b>凝血途径</b>：<b>内源性</b>（Ⅻ启动，接触异物，慢）、<b>外源性</b>（Ⅲ/组织因子启动，快）。共同途径：Ⅹ→凝血酶原→凝血酶→纤维蛋白。</li>\n<li><b>ABO 血型</b>：A(A抗原抗B)、B、AB、O；<b>Rh</b>：D 抗原（Rh⁻母亲怀 Rh⁺胎儿可致新生儿溶血症）。输血原则：同型，交叉配血主侧不凝。</li>\n</ul></div>"}, {"name": "四、循环", "html": "\n<div class=\"kp\"><b>⭐心肌电生理与泵血</b>\n<ul>\n<li><b>快反应细胞</b>（工作肌、心房心室肌、浦肯野）：0 期 Na⁺内流，去极快。</li>\n<li><b>慢反应细胞</b>（窦房结、房室结）：0 期 Ca²⁺内流。</li>\n<li><b>心脏快反应自律细胞</b>：浦肯野细胞（4 期自动去极，If 电流）。<b>窦房结</b>是正常起搏点（慢反应）。</li>\n<li>心肌特性：兴奋性、自律性、传导性、收缩性；<b>有效不应期长</b>→不发生强直收缩。</li>\n<li><b>心动周期</b>：收缩期+舒张期；<b>心输出量=每搏量×心率</b>；影响：前负荷(回心血量)、后负荷(动脉压)、心肌收缩力、心率。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐血压 & 调节</b>\n<ul>\n<li><b>动脉血压</b>：收缩压靠心输出量，舒张压靠外周阻力。<b>形成条件</b>：循环血量、心射血、外周阻力、大动脉弹性。</li>\n<li>影响因素：每搏量↑→收缩压↑为主；心率↑/外周阻力↑→舒张压↑为主。</li>\n<li><b>中心静脉压(CVP)</b>：右心房压力，反映回心血量与心功能。</li>\n<li><b>压力感受器(颈动脉窦、主动脉弓)</b>：对<b>动脉血压(尤其 100mmHg 左右)最敏感</b>，减压反射维持血压稳定。</li>\n<li>化学感受器（颈动脉体、主动脉体）：低 O₂、高 CO₂、H⁺↑→升压呼吸。</li>\n<li>⭐<b>心力衰竭</b>：机制=心肌收缩力↓（能量代谢障碍、Ca²⁺转运异常、细胞损伤）；代偿=心率↑、心脏扩大、心室重塑；表现=<b>体/肺循环淤血</b>（下肢水肿因<b>毛细血管静水压升高</b>）、肺水肿、肝大。</li>\n</ul></div>"}, {"name": "五、呼吸", "html": "\n<div class=\"kp\"><b>⭐肺通气 & 换气</b>\n<ul>\n<li><b>原动力</b>=呼吸肌收缩舒张；<b>直接动力</b>=肺内压与大气压差；<b>胸膜腔负压</b>维持肺扩张（吸气更负）。</li>\n<li><b>肺表面活性物质</b>（Ⅱ型肺泡细胞分泌，二棕榈酰卵磷脂）：降低表面张力，防肺泡萎陷、减少肺含水。</li>\n<li>肺容积/容量：潮气量、补吸气、补呼气、残气；<b>肺活量=潮气+补吸+补呼</b>；<b>时间肺活量(FEV₁)更敏感</b>。</li>\n<li><b>肺泡通气量=(潮气量-无效腔)×呼吸频率</b>（深慢呼吸效率更高）。</li>\n<li>换气：O₂/CO₂ 经分压差扩散；<b>通气/血流比值≈0.84</b> 最佳；增大/减小均降低效率。</li>\n<li>气体运输：O₂ 靠 Hb（HbO₂）；CO₂ 主要为 HCO₃⁻（其次氨基甲酸 Hb、溶解）。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐呼吸调节 & 呼吸衰竭</b>\n<ul>\n<li>中枢化学感受器（延髓，对脑脊液 H⁺敏感）<；外周（颈动脉体/主动脉体，对低 O₂ 敏感）。</li>\n<li><b>CO₂ 是维持呼吸最重要化学刺激</b>；H⁺↑、低 O₂ 也兴奋呼吸。</li>\n<li><b>呼吸衰竭</b>：PaO₂<60mmHg 伴/不伴 PaCO₂>50mmHg。机制：通气不足（限制性/阻塞性）、弥散障碍、通气血流比失调。并发症：<b>肺心病、肺性脑病</b>。</li>\n</ul></div>"}, {"name": "六、消化 & 七、能量代谢体温", "html": "\n<div class=\"kp\"><b>⭐消化液与作用</b>\n<ul>\n<li><b>胃液</b>：盐酸(激活胃蛋白酶原、杀菌、促胰液胆汁分泌、促铁钙吸收；<b>不促进 VitB12 吸收</b>——B12 吸收靠内因子)、胃蛋白酶、内因子、黏液。</li>\n<li><b>胰液</b>：最重要消化液（含胰淀粉酶、脂肪酶、蛋白酶）；胆汁（肝分泌，不含消化酶，乳化脂肪，促脂溶性Vit吸收）。</li>\n<li><b>胃肠激素</b>：胃泌素、促胰液素、CCK、抑胃肽。</li>\n<li><b>吸收部位</b>：糖类/蛋白/脂肪主要<b>小肠</b>（尤其是十二指肠、空肠）；胆盐在回肠重吸收（肠肝循环）。</li>\n</ul></div>\n<div class=\"kp\"><b>能量代谢 & 体温</b>\n<ul>\n<li>主要供能：<b>糖(脑依赖糖)、脂肪(储能)、蛋白质</b>。机体最主要供能方式=<b>氧化磷酸化</b>。</li>\n<li><b>基础代谢率(BMR)</b>：清醒、静卧、空腹、20-25℃、安静时。甲亢↑、甲低↓。</li>\n<li>体温调节：<b>视前区-下丘脑前部</b>为调定点；散热（辐射/传导/对流/蒸发）；产热（寒战、代谢）。</li>\n<li><b>发热</b>：调定点上移；时相：体温上升期(寒战)、高温持续期、体温下降期(出汗)。</li>\n</ul></div>"}, {"name": "八、尿的生成和排出", "html": "\n<div class=\"kp\"><b>⭐肾单位 & 滤过</b>\n<ul>\n<li>肾单位=肾小体(肾小球+包曼囊)+肾小管(近端、髓袢、远端、集合管)。</li>\n<li><b>肾小球滤过</b>：动力=有效滤过压=毛细血管压−(胶渗压+囊内压)。<b>滤过率 GFR</b>≈125ml/min。</li>\n<li><b>影响滤过</b>：滤过面积/通透性、有效滤过压、肾血浆流量。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐肾小管重吸收</b>\n<ul>\n<li><b>近端小管</b>：重吸收量最大（约 65-70% Na⁺/水、几乎全部糖/氨基酸/蛋白）；等渗性重吸收；<b>Na⁺-葡萄糖同向转运</b>；泌 H⁺、泌 K⁺、泌 NH₃。</li>\n<li>髓袢升支粗段：Na⁺-K⁺-2Cl⁻ 共转运（髓袢利尿剂作用点）。</li>\n<li>远端/集合管：受醛固酮(保 Na⁺排 K⁺)、ADH(保水)调节。</li>\n<li><b>肾糖阈</b>≈180mg/dl（超过则尿糖）。</li>\n<li><b>肾髓质高渗</b>：靠 NaCl+尿素，由髓袢+集合管建立，直小血管维持；是尿液浓缩基础。</li>\n<li><b>渗透性利尿</b>：小管液溶质↑(如甘露醇、糖尿)→水重吸收↓→尿多。<b>球-管平衡</b>：近端重吸收随 GFR 变动按比例。</li>\n</ul></div>\n<div class=\"kp\"><b>肾衰</b>\n<ul><li><b>急性肾衰</b>：肾缺血/肾小管坏死；少尿期(尿少、高钾)、多尿期（肾小管功能未恢复，原尿不能浓缩）。</li>\n<li><b>慢性肾衰</b>：尿变化、水电解质紊乱、肾性高血压、肾性贫血(EPO↓)、肾性骨病。</li>\n</ul></div>"}, {"name": "九、感觉器官", "html": "\n<div class=\"kp\"><b>⭐视觉 & 听觉</b>\n<ul>\n<li>折光：角膜最强；调节靠晶状体变凸（看近）。视网膜：<b>视杆(暗视觉、黑白、周边) / 视锥(明视觉、色觉、中心)</b>。</li>\n<li><b>视紫红质</b>：视杆感光物质（视蛋白+11-顺视黄醛），光下分解。</li>\n<li><b>暗适应</b>：暗处视紫红质合成增加，敏感度升高。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐耳蜗与听觉</b>\n<ul>\n<li>传音：外耳→鼓膜→听骨链→卵圆窗；骨传导（临床鉴别传导性/感音神经性聋）。</li>\n<li><b>耳蜗感音</b>：基底膜不同部位对不同频率敏感——<b>底部感受高频、顶部感受低频</b>。</li>\n<li>⭐<b>耳蜗顶部受损→低频听力下降；底部受损→高频听力下降</b>（历年高频）。</li>\n<li>前庭：半规管(角加速度)、椭圆囊/球囊(直线加速度、位置)。</li>\n</ul></div>"}, {"name": "十、神经系统", "html": "\n<div class=\"kp\"><b>⭐突触 & 递质受体</b>\n<ul>\n<li><b>经典突触传递</b>：AP→Ca²⁺内流→递质释放→与突触后膜受体结合→<b>EPSP(兴奋性突触后电位，去极化)最先在突触后膜发生</b>/IPSP。</li>\n<li>递质：ACh、NE、DA、5-HT、GABA、谷氨酸等。外周胆碱能(N/M)、肾上腺素能(α/β)受体。</li>\n<li><b>中枢抑制</b>：突触后（IPSP）、突触前（减少递质释放）。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐感觉/运动/自主神经</b>\n<ul>\n<li>特异投射（引起特定感觉、点对点）→大脑皮层；非特异（维持觉醒）。</li>\n<li><b>牵涉痛</b>：内脏痛放射到体表（如心肌缺血→左臂痛）。</li>\n<li><b>牵张反射</b>：腱反射(快速)、肌紧张(缓慢持续，维持姿势)；<b>维持人体姿势的反射=肌紧张</b>。</li>\n<li><b>去大脑僵直</b>：切脑干→伸肌紧张亢进。</li>\n<li>基底神经节（帕金森、舞蹈病）、小脑（协调、平衡）运动调节。</li>\n<li><b>自主神经</b>：交感(应激、心↑、支气管扩、胃肠↓)、副交感(休息消化)。脊髓/低位脑干/下丘脑调节内脏。</li>\n</ul></div>"}, {"name": "十一、内分泌", "html": "\n<div class=\"kp\"><b>⭐激素与作用</b>\n<ul>\n<li>激素分类：肽类/胺类(膜受体)、固醇类(胞内受体)。一般特性：高效、信使、特异、相互作用(允许作用)。</li>\n<li><b>下丘脑-垂体</b>：下丘脑调节肽→腺垂体(生长素 GH、TSH、ACTH、FSH/LH、催乳素)；神经垂体释放<b>ADH(抗利尿)、催产素</b>。</li>\n<li><b>生长激素</b>：促生长(肝产生 IGF-1)，幼年期缺乏→侏儒、过多→巨人；成年过多→肢端肥大。</li>\n<li><b>甲状腺激素</b>：促进代谢/耗氧/神经发育；合成需碘；<b>碘转运入甲状腺滤泡上皮=继发性主动转运</b>；分泌受 TRH-TSH 调节。</li>\n<li>⭐<b>糖皮质激素</b>：升血糖、抗炎、抗过敏、抗休克（<b>首选用于重度感染性休克</b>）；长期用抑免疫、致感染扩散、Cushing 征；分泌受 ACTH、CRH 调节（昼夜节律）。</li>\n<li><b>胰岛素</b>：降血糖（促糖原/脂肪/蛋白合成，促葡萄糖利用）；缺乏→糖尿病。<b>胰高血糖素</b>升血糖。</li>\n<li>钙磷调节：PTH(升血钙)、降钙素(降血钙)、Vit D(升两者)。</li>\n</ul></div>"}]}, {"subject": "病理学（含组织学）", "score": 20, "hours": "约10小时", "chapters": [{"name": "一–三、绪论、适应损伤、修复", "html": "\n<div class=\"kp\"><b>⭐适应与损伤</b>\n<ul>\n<li>适应性改变：<b>萎缩、肥大、增生、化生</b>（一种分化成熟组织→另一种，如支气管假复层纤毛柱状→鳞状上皮化生，与癌前病变相关）。</li>\n<li><b>可逆性损伤(变性)</b>：细胞水肿(线粒体、内质网水肿，最轻)、脂肪变(肝最常见)、玻璃样变(细胞内/血管壁/结缔组织，如高血压细动脉)、淀粉样变。</li>\n<li><b>不可逆损伤</b>：<b>坏死</b>（核固缩/碎裂/溶解为标志）；类型：凝固性(心、肾、脾梗死)、液化性(脑、脓肿)、纤维素样坏死(结缔组织/血管壁，免疫/风湿)、干酪样(结核)、脂肪坏死。<b>凋亡</b>=程序性、单个细胞、不引起炎症。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐修复</b>\n<ul>\n<li><b>再生能力</b>：不稳定细胞(表皮、黏膜、造血)、稳定细胞(肝、肾、平滑肌)、永久细胞(<b>神经细胞、心肌细胞</b>，不能再生的)。</li>\n<li><b>肉芽组织</b>：新生的毛细血管+成纤维细胞+炎细胞，鲜红、颗粒状、柔软湿润；功能=抗感染、填补缺损、机化；结局→瘢痕。⭐<b>不（不易）产生肉芽组织的病变</b>：如单纯性萎缩、某些肿瘤等（题目常考\"下列不产生肉芽组织的是\"）。</li>\n<li>创伤愈合：<b>一期愈合</b>(创缘整齐、无感染、少瘢痕，如手术切口)、<b>二期愈合</b>(创口大、感染、多瘢痕)。</li>\n</ul></div>"}, {"name": "四、局部血液循环障碍", "html": "\n<div class=\"kp\"><b>⭐血栓 & 栓塞 & 梗死</b>\n<ul>\n<li><b>血栓</b>形成条件：心/血管内皮损伤、血流缓慢/涡流、血液高凝。类型：白色血栓(心瓣膜、头部，血小板)、混合血栓(体部)、红色血栓(尾部，红细胞)、透明血栓(微血管，DIC)。</li>\n<li><b>栓塞</b>：栓子运行与血流方向一致（静脉→右心→肺；动脉→全身）；<b>血栓栓塞最常见</b>；脂肪栓塞(长骨骨折)、气体栓塞(减压病)、羊水栓塞(产科，致死率高)。</li>\n<li><b>梗死</b>：<b>贫血性梗死</b>(动脉阻塞、组织结构致密、侧支少：心、肾、脾、脑，呈灰白色)、<b>出血性梗死</b>(静脉淤血+双重血供：肺、肠，呈红色)。</li>\n</ul></div>"}, {"name": "五、炎症", "html": "\n<div class=\"kp\"><b>⭐炎症基本病理 & 类型</b>\n<ul>\n<li><b>基本病理变化</b>：<b>变质(变性与坏死)、渗出(最重要，血液成分逸出)、增生</b>。</li>\n<li>急性炎症类型：\n <br>· <b>浆液性炎</b>(血清/浆液，如感冒初期、烧伤水疱)\n <br>· <b>纤维素性炎</b>(纤维蛋白，如<b>大叶性肺炎</b>、绒毛心、假膜性炎)\n <br>· <b>化脓性炎</b>(中性粒细胞，如脓肿、蜂窝织炎、表面化脓)\n <br>· 出血性炎(如流行性出血热)</li>\n<li>慢性炎症：<b>肉芽肿性炎</b>（结核结节、风湿小体、伤寒小结、梅毒树胶肿）。⭐<b>慢性炎症的病变特征=肉芽肿/单核巨噬细胞增生</b>。</li>\n<li><b>炎性介质</b>：组胺(早期血管扩张通透)、前列腺素(痛/热)、白三烯、细胞因子等。</li>\n</ul></div>"}, {"name": "六、肿瘤学", "html": "\n<div class=\"kp\"><b>⭐肿瘤总论</b>\n<ul>\n<li><b>肿瘤性增生</b> vs 非肿瘤性：自主性、异常分化、对机体有害。</li>\n<li><b>异型性</b>：细胞/组织结构与成熟细胞的差异，是良恶性判别依据；异型性越大恶性越高。</li>\n<li><b>转移途径</b>：淋巴(癌常见)、血行(肉瘤、癌晚期)、种植(腹腔，如 Krukenberg 瘤=胃黏液腺癌种植卵巢)。</li>\n<li><b>良恶区别</b>：分化高/低、异型性小/大、不/有浸润转移、生长慢/快、包膜有/无。</li>\n<li><b>癌前病变</b>：黏膜白斑、慢性宫颈炎伴宫颈糜烂、结肠腺瘤性息肉、肝硬化、萎缩性胃炎、乳腺导管上皮不典型增生等。<b>原位癌</b>=上皮内，未突破基底膜。</li>\n<li><b>癌 vs 肉瘤</b>：癌(上皮来源、淋巴转移、实质/间质分明)；肉瘤(间叶来源、血行转移、细胞弥漫)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐上皮性肿瘤 & 妇科肿瘤</b>\n<ul>\n<li><b>上皮源性肿瘤</b>：良性(乳头状瘤、腺瘤)；恶性(鳞癌、腺癌等)。</li>\n<li>⭐<b>葡萄胎</b>：滋养层增生、绒毛水肿、无胎儿；<b>侵袭性葡萄胎</b>=葡萄胎侵入子宫肌层/血管（有绒毛）；<b>绒毛膜癌</b>=无绒毛、无间质、出血坏死、滋养层细胞单向/双向增生（<b>原发/继发皆可，常继发于葡萄胎后</b>）。</li>\n<li><b>子宫上皮内瘤变(CIN)</b>：宫颈鳞状上皮不典型增生/原位癌统称，与 HPV 相关。</li>\n<li><b>乳腺癌</b>：最常见浸润性导管癌；与<b>雌激素升高相关</b>（⭐<b>子宫腺肌症与雌激素升高无关</b>，属常考干扰项）。</li>\n</ul></div>"}, {"name": "七、心血管系统疾病", "html": "\n<div class=\"kp\"><b>⭐动脉粥样硬化 & 冠心病</b>\n<ul>\n<li><b>动脉粥样硬化(AS)</b>：危险因素=高脂血症(尤其 LDL↑)、高血压、吸烟、糖尿病、年龄。病变：脂纹→纤维斑块→粥样斑块(复合病变)。好发<b>主动脉、冠状动脉、脑动脉</b>。</li>\n<li><b>管腔狭窄分级</b>：Ⅰ<25%、Ⅱ 26-50%、Ⅲ 51-75%、<b>Ⅳ>75%</b>（临床常称\"堵塞超过 75%\"为重度/有症状）。</li>\n<li><b>冠心病</b>：心绞痛(稳定/不稳定/变异型)、心肌梗死(透壁性，左前降支常见，贫血性梗死，并发症：心律失常/心衰/室壁瘤/心破裂)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐高血压 & 风湿病</b>\n<ul>\n<li><b>良性高血压</b>分期：机能紊乱期→<b>细小动脉玻璃样变</b>(肾/脑/视网膜细动脉)→内脏病变期(心向心性肥大→离心性；肾<b>原发性颗粒性固缩肾</b>；脑出血最常见死因)。</li>\n<li><b>风湿病</b>：A 组乙型溶血性链球菌感染；基本病变=<b>变质渗出→增生(Aschoff 小体/风湿小体)→纤维化</b>；累及心内膜(二尖瓣最常见)、心外膜(绒毛心)、心肌、关节(游走性大关节炎)。</li>\n</ul></div>"}, {"name": "八、呼吸系统疾病", "html": "\n<div class=\"kp\"><b>⭐大叶性/小叶性肺炎</b>\n<ul>\n<li><b>大叶性肺炎</b>：肺炎链球菌，<b>纤维素性炎</b>；四期(充血水肿→红色肝样变→灰色肝样变→溶解消散)；青年、铁锈色痰。</li>\n<li><b>小叶性(支气管)肺炎</b>：化脓菌，小儿老弱；散在化脓性病灶。</li>\n<li><b>病毒性肺炎</b>：间质性炎，<b>透明膜形成</b>，损伤部位多在<b>肺泡壁/间质</b>（如新冠、流感）。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐COPD & 肺癌 & 肺心病</b>\n<ul>\n<li><b>慢性支气管炎</b>：咳、痰、喘每年>3月连2年；<b>呼气性呼吸困难</b>(因小气道阻塞)；可发展为<b>肺气肿→肺心病</b>。⭐常考\"错误的是\"：好发于40岁以上男性、有呼气性呼吸困难、可发展为肺心病均为正确，错误项常为\"好发于女性/无咳痰\"之类。</li>\n<li><b>肺气肿</b>：肺泡扩大、壁破坏（腺泡中央型最常见）。<b>支气管扩张</b>：慢性咳嗽、大量脓痰、咯血。</li>\n<li><b>慢性肺心病</b>：COPD 致肺动脉高压→右心肥大衰竭。并发症：肺性脑病(最重)、酸碱失衡。</li>\n<li>⭐<b>肺癌</b>：类型=鳞状细胞癌(中央型多见)、腺癌(周围型多见，现已最常见)、小细胞癌(神经内分泌，恶性高、放化疗敏感)。常考\"正确的是\"：中央型多为鳞癌；\"错误的是\"：腺癌多位于周围、小细胞癌神经内分泌预后差等。</li>\n</ul></div>"}, {"name": "九、消化系统疾病", "html": "\n<div class=\"kp\"><b>⭐胃炎、溃疡、肝炎</b>\n<ul>\n<li><b>消化性溃疡</b>：胃溃疡(胃小弯、胃窦)；十二指肠溃疡(球部)；机制=幽门螺杆菌+胃酸/黏液屏障受损；并发症=出血(最常见)、穿孔、幽门梗阻、癌变(仅 GU)。</li>\n<li>⭐<b>病毒性肝炎</b>：HAV/HEV 消化道、HBV/HCV/HGV 血液；基本病变=肝细胞变性(气球样变)、坏死(点状/碎片状/桥接)、炎细胞浸润、Kupffer 细胞增生。临床型：急性普通、慢性(轻中重)、重型肝炎(暴发)。</li>\n<li><b>肝硬化</b>：假小叶形成（特征）；门脉高压(脾大、腹水、侧支循环如食管静脉曲张→<b>蜘蛛痣因雌激素灭活减少</b>)、肝功能不全。</li>\n<li><b>食管癌/胃癌/结肠癌/肝癌</b>：肝癌常伴肝硬化、AFP↑；胃癌好发胃窦小弯。</li>\n</ul></div>"}, {"name": "十–十一、淋巴造血 & 泌尿系统", "html": "\n<div class=\"kp\"><b>⭐淋巴瘤 & 肾炎</b>\n<ul>\n<li>淋巴瘤：霍奇金(镜影细胞/R-S 细胞为特征)与非霍奇金。</li>\n<li>⭐<b>肾小球肾炎</b>：\n <br>· <b>急性弥漫性增生性肾炎(毛细血管内增生性)</b>：链球菌感染后，<b>大红肾/蚤咬肾</b>，驼峰状电子致密物，儿童多见，预后好。\n <br>· <b>新月体性(快速进展性)</b>：新月体(壁层上皮+单核)形成，血尿少尿。\n <br>· <b>膜性肾病</b>：基底膜增厚、钉突（成人肾病综合征常见）。\n <br>· <b>慢性肾炎</b>：颗粒性固缩肾(继发性，区别于高血压原发)、<b>引起原发性颗粒性固缩肾的是高血压</b>。\n <br>· <b>肾盂肾炎</b>：化脓性、上行感染、肾盂肾盏+间质。</li>\n</ul></div>"}, {"name": "十二–十四、生殖乳腺、内分泌、神经", "html": "\n<div class=\"kp\"><b>⭐生殖系统 & 乳腺</b>\n<ul>\n<li><b>子宫颈上皮内瘤变(CIN)</b>：HPV 相关，分Ⅰ-Ⅲ，Ⅲ≈原位癌。</li>\n<li><b>葡萄胎/侵袭性葡萄胎/绒癌</b>：见肿瘤学。</li>\n<li><b>乳腺癌</b>：浸润性导管癌最多；ER/PR、Her2 状态指导治疗。</li>\n<li>前列腺癌、前列腺增生（良性，尿道周围）。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐甲状腺 & 神经疾病</b>\n<ul>\n<li>甲状腺肿：地方性(缺碘)、单纯性/毒性(功能亢进，<b>与碘/免疫相关</b>)。</li>\n<li>甲状腺癌：乳头状(最常见、预后好，有乳头中心纤维血管轴心)、滤泡性、髓样(C 细胞、降钙素)、未分化(最差)。</li>\n<li>⭐<b>流脑(脑膜炎球菌，化脓)</b> vs <b>乙脑(虫媒病毒，变质性、筛状软化灶)</b>：传播途径、病变不同。</li>\n</ul></div>"}, {"name": "十五、传染病", "html": "\n<div class=\"kp\"><b>⭐结核病</b>\n<ul>\n<li><b>基本病变</b>：渗出(浆液纤维素性)、增生(<b>结核结节=上皮样细胞+朗汉斯巨细胞+干酪样坏死</b>)、坏死(干酪样)。转化规律：好转(吸收、纤维化、钙化)或恶化(浸润、溶解播散)。</li>\n<li><b>原发性肺结核</b>：初次感染，原发综合征(原发病灶+淋巴管炎+肺门淋巴结结核)，多自愈；<b>继发性肺结核</b>：成人，病变多样，<b>浸润性肺结核最常见</b>，好发上叶尖后段/下叶背段；类型含空洞性、干酪性肺炎、结核球、纤维空洞性。</li>\n<li><b>肺外结核</b>：肠结核(回盲部)、结核性脑膜炎、骨/肾结核。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐伤寒、菌痢、其他</b>\n<ul>\n<li><b>伤寒</b>：伤寒杆菌，经口；病变在<b>回肠末端淋巴组织</b>（集合淋巴小结），髓样肿胀→坏死→溃疡(便于记忆：伤寒\"伤\"回肠)；并发症=肠出血、肠穿孔。⭐治疗=喹诺酮类(氟喹诺酮)首选、氯霉素。</li>\n<li><b>细菌性痢疾</b>：痢疾杆菌，直肠乙状结肠，假膜性炎(地图状溃疡)，黏液脓血便。</li>\n<li><b>梅毒</b>：三期(硬下疳→梅毒疹→树胶肿/神经梅毒)；基本病变=小动脉炎+树胶肿。</li>\n<li><b>阿米巴</b>：盲肠升结肠，烧瓶状溃疡，果酱样便。</li>\n<li><b>血吸虫</b>：虫卵沉积致肝硬化(干线型)、门脉高压。</li>\n</ul></div>"}]}, {"subject": "药理学", "score": 16, "hours": "约8小时", "chapters": [{"name": "一–三、药效学、药动学、影响因素", "html": "\n<div class=\"kp\"><b>⭐不良反应 & 量效</b>\n<ul>\n<li>不良反应：<b>副反应</b>(治疗量、难避免)、<b>毒性反应</b>(过量)、后遗效应、停药反应(反跳)、<b>变态反应(过敏)</b>、特异质反应。</li>\n<li>量效：<b>效能</b>(最大效应)、<b>效价</b>(等效剂量大小，越小效价越高)；<b>治疗指数 TI=LD₅₀/ED₅₀</b>(越大越安全)。</li>\n<li>受体：激动药(激活)、拮抗药(阻断)；竞争性拮抗(可逆、可被浓度逆转、Emax 不变)、非竞争性(Emax↓)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐药动学</b>\n<ul>\n<li><b>首过消除</b>：口服经胃肠吸收→肝代谢→入体循环前被消除（舌下/直肠/注射可避免）。</li>\n<li>分布：血浆蛋白结合率、血脑/胎盘屏障、解离度与 pH。</li>\n<li>代谢：肝药酶(CYP450)；<b>药酶诱导剂</b>(苯巴比妥、利福平、苯妥英→加速自身/他药代谢)、<b>抑制剂</b>(西咪替丁、酮康唑)。</li>\n<li>排泄：肾(尿 pH 影响重吸收，碱化促酸性药排泄)；<b>肝肠循环</b>延长作用时间。</li>\n<li>参数：<b>半衰期 t½</b>(消除一半时间，5个t½基本消除)、清除率、生物利用度(F)、表观分布容积。</li>\n<li>稳态血药浓度：恒速给药达稳态需约 4-5 个 t½；<b>负荷剂量</b>使迅速达稳态。</li>\n</ul></div>"}, {"name": "四–八、胆碱、肾上腺素、镇静催眠、抗癫痫、抗震颤", "html": "\n<div class=\"kp\"><b>⭐胆碱系统</b>\n<ul>\n<li><b>毛果芸香碱(匹鲁卡品)</b>：M 受体激动→<b>缩瞳、降眼压、调节痉挛(近视)</b>（滴眼后瞳孔缩小、视力近清远糊）；用于青光眼。</li>\n<li>⭐<b>新斯的明</b>：易逆性抗胆碱酯酶(AChE)→ACh↑；用于重症肌无力、术后腹胀/尿潴；<b>机制=抑制胆碱酯酶(作用于酶)</b>。毒扁豆碱亦可。</li>\n<li><b>有机磷中毒</b>(敌敌畏等)：难逆性抑制 AChE→ACh 堆积；<b>与 AChE 的丝氨酸羟基结合(磷酰化)</b>；解救=阿托品(对抗M)+氯解磷定(胆碱酯酶复活，解磷定类)。</li>\n<li><b>阿托品</b>：M 阻断→扩瞳升眼压调节麻痹、心率↑、抑制腺体/胃肠平滑肌；中毒用新斯的明/毛果芸香碱?</li>\n</ul></div>\n<div class=\"kp\"><b>⭐肾上腺素系统</b>\n<ul>\n<li><b>肾上腺素</b>：α+β；强心、升压、扩支气管；过敏性休克首选。</li>\n<li><b>去甲肾上腺素</b>：α 为主；升压；不良反应：局部缺血坏死、肾衰。</li>\n<li><b>异丙肾上腺素</b>：β1+β2；平喘、强心；可致心律失常。</li>\n<li><b>多巴胺</b>：小剂量扩肾血管、强心，抗休克。</li>\n<li><b>酚妥拉明</b>：α阻断，用于嗜铬细胞瘤、心衰。</li>\n<li>⭐<b>β阻断药(普萘洛尔等)</b>：阻断 β；用于高血压、心绞痛、心律失常；<b>禁忌</b>=支气管哮喘、严重心衰、房室阻滞。⭐<b>心力衰竭合并慢性支气管哮喘禁用普萘洛尔(β阻断加重支气管痉挛)</b>。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐镇静催眠 & 抗癫痫 & 帕金森</b>\n<ul>\n<li><b>苯二氮䓬类(地西泮)</b>：增强 GABA 作用；抗焦虑、镇静、抗惊厥、肌松；<b>过量中毒用氟马西尼(特异性拮抗)</b>。相比巴比妥类：安全、不易成瘾、无肝药酶诱导。</li>\n<li><b>苯妥英钠</b>：大发作、三叉神经痛；齿龈增生。<b>乙琥胺</b>：小发作(失神)。<b>卡马西平</b>：部分性、三叉神经痛。<b>丙戊酸钠</b>：广谱。</li>\n<li><b>左旋多巴</b>：帕金森(进脑转多巴胺)；<b>卡比多巴</b>抑制外周脱羧，增效减副。<b>苯海索</b>：抗胆碱，改善震颤。</li>\n</ul></div>"}, {"name": "九–十四、抗精神、镇痛、解热、钙通道、抗心律失常、心衰", "html": "\n<div class=\"kp\"><b>⭐抗精神 & 镇痛 & 解热镇痛</b>\n<ul>\n<li><b>氯丙嗪</b>：阻断中脑-边缘/皮质 D₂；抗精神病、镇吐(除晕动)、降温(人工冬眠)；不良反应：锥体外系(帕金森、静坐不能、迟发性)、体位性低血压。</li>\n<li><b>碳酸锂</b>：躁狂；安全窗窄需监测。</li>\n<li>⭐<b>吗啡</b>：激动 μ；镇痛、镇静、欣快、镇咳、止泻；<b>禁忌</b>=支气管哮喘、颅脑损伤、严重肝功不全、分娩/哺乳、急性胰腺炎等；急性中毒用<b>纳洛酮</b>拮抗。</li>\n<li><b>哌替啶(度冷丁)</b>：人工合成镇痛，可用于分娩(不延长产程)。</li>\n<li>⭐<b>阿司匹林</b>：抑制 COX→解热、镇痛、抗炎、抗血小板；不良反应=胃肠道溃疡出血、凝血障碍、水杨酸反应、Reye 综合征(儿童病毒感染)；<b>禁忌</b>=胃溃疡、哮喘、G6PD、儿童病毒感染。</li>\n<li><b>对乙酰氨基酚</b>：解热镇痛强、抗炎弱；过量肝毒性。</li>\n<li><b>布洛芬/塞来昔布</b>：解热镇痛抗炎；塞来昔布(COX-2 抑制)胃肠反应少。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐心血管用药</b>\n<ul>\n<li><b>钙通道阻滞药(CCB)</b>：硝苯地平(降压、心绞痛)、维拉帕米/地尔硫䓬(心律失常)；<b>心衰合并哮喘不宜用硝苯地平? </b>(CCB 一般不影响支气管)。</li>\n<li>⭐<b>抗心律失常</b>：<b>利多卡因</b>(室性，心梗首选)、<b>普萘洛尔</b>(室上性、交感相关)、<b>胺碘酮</b>(广谱，但肺/甲状腺/肝毒性)、维拉帕米(室上性)。</li>\n<li>⭐<b>强心苷(地高辛)</b>：抑制 Na⁺-K⁺-ATPase→Ca²⁺↑→正性肌力；用于心衰+房颤；中毒=室早二联律，解救用苯妥英钠/利多卡因+补钾。</li>\n<li><b>ACEI(卡托普利等)</b>：抑制 ACE→AngⅡ↓，扩血管、抗重构；心衰/高血压首选之一；干咳副作用。</li>\n<li><b>AT1 阻断(氯沙坦)</b>：不干咳。</li>\n<li><b>硝酸甘油</b>：释放 NO→扩静脉(减前负荷)+冠脉→缓解心绞痛。</li>\n</ul></div>"}, {"name": "十五–二十二、调脂、降压、利尿、血液、组胺、呼吸、消化、皮质激素", "html": "\n<div class=\"kp\"><b>⭐调脂 & 降压 & 利尿</b>\n<ul>\n<li><b>他汀类(HMG-CoA 还原酶抑制)</b>：降 LDL 最强，抗 AS；不良反应肌病、肝酶↑。</li>\n<li><b>贝特类</b>：降 TG 为主。</li>\n<li>⭐<b>利尿药</b>：<b>袢利尿(呋塞米)</b>作用于髓袢升支粗段 Na-K-2Cl，强效，用于急性肺水肿/肾衰；<b>噻嗪类</b>(氢氯噻嗪)远曲小管，降压、轻中度水肿，慎糖尿病；<b>保钾(螺内酯)</b>拮抗醛固酮；<b>乙酰唑胺</b>碳酸酐酶抑制；<b>甘露醇</b>渗透性利尿(降颅压)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐血液系统用药</b>\n<ul>\n<li>⭐<b>肝素</b>：增强抗凝血酶Ⅲ(ATⅢ)活性→灭活凝血酶/Ⅹa；<b>机制=增强 ATⅢ</b>；静注、起效快、监测 APTT；过量鱼精蛋白解救；用于血栓、DIC、抗凝。</li>\n<li><b>香豆素类(华法林)</b>：抑制 Vit K 环氧还原酶→抑制ⅡⅦⅨⅩ；口服、起效慢、监测 INR；过量 Vit K 解救。</li>\n<li>⭐<b>抗血小板</b>：<b>阿司匹林</b>(不可逆抑制 COX-1→TXA₂↓)；<b>氯吡格雷</b>(抑制 ADP 受体 P2Y₁₂，阻断血小板活化)；用于冠心病/支架。</li>\n<li><b>t-PA(阿替普酶)</b>：溶栓(激活纤溶酶原)。</li>\n<li>抗贫血：铁剂(缺铁)、叶酸/B12(巨幼)。右旋糖酐(扩容)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐组胺/呼吸/消化/皮质激素</b>\n<ul>\n<li><b>H1 阻断(氯苯那敏、氯雷他定)</b>：抗过敏、止吐晕；<b>H2 阻断(雷尼替丁)</b>：抑酸，消化性溃疡。</li>\n<li>⭐<b>平喘药</b>：<b>急性哮喘发作首选 β₂ 激动剂(沙丁胺醇、特布他林)吸入</b>；氨茶碱(平喘、强心利尿，治疗窗窄)；糖皮质激素(抗炎平喘首选控制用药)；异丙托溴铵(M 阻断)；色甘酸钠(预防，稳定肥大细胞)。</li>\n<li><b>质子泵抑制剂(奥美拉唑)</b>：抑制 H⁺-K⁺-ATPase，强抑酸，溃疡/GERD。</li>\n<li>⭐<b>糖皮质激素</b>：抗炎、免疫抑制、抗休克；<b>首选用于重度感染性休克</b>；长期用致感染扩散、Cushing、骨质疏松、高血压糖尿病。</li>\n</ul></div>"}, {"name": "二十三–二十八、甲状腺、降糖、β内酰胺、大环内酯、氨基苷、四环素", "html": "\n<div class=\"kp\"><b>⭐甲状腺 & 降糖</b>\n<ul>\n<li><b>硫脲类(甲巯咪唑、丙硫氧嘧啶)</b>：抑制过氧化物酶→抑制甲状腺激素合成；用于甲亢；不良反应粒细胞减少。</li>\n<li><b>碘及碘化物</b>：小剂量促合成、大剂量抑制释放(术前准备、甲亢危象)。</li>\n<li>⭐<b>胰岛素</b>：降血糖唯一蛋白类；用于1型、酮症酸中毒(DKA 静脉)；不良反应低血糖。<b>口服降糖</b>：双胍(二甲双胍，减肝糖输出、增外周利用，不促泌)、磺酰脲(促胰岛素分泌)、α-葡萄糖苷酶抑制(阿卡波糖，延缓糖吸收)、格列奈(餐时)、噻唑烷二酮(罗格列酮，增敏)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐β-内酰胺类</b>\n<ul>\n<li>⭐<b>青霉素 G</b>：G⁺菌、螺旋体强；<b>过敏性休克</b>最危险，用 <b>肾上腺素</b>抢救，用药前皮试；机制抑制转肽酶(细胞壁肽聚糖合成)。</li>\n<li>广谱青霉素：氨苄/阿莫(对 G⁻ 也有效，阿莫口服好)。<b>头孢菌素</b>：四代，代次↑对 G⁻ 强、肾毒性↓。</li>\n<li><b>碳青霉烯(亚胺培南)</b>：最广谱，需配西司他丁(防肾脱氢肽酶降解)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐大环内酯/氨基苷/四环素</b>\n<ul>\n<li><b>红霉素/阿奇霉素</b>：G⁺、非典型(支原体衣原体)；阿奇霉素半衰期长。</li>\n<li>⭐<b>氨基苷类(庆大、链、阿米卡星)</b>：G⁻ 强；机制抑制 30S；不良反应=<b>耳毒性(前庭+听神经)、肾毒性、神经肌肉阻滞</b>；<b>对铜绿假单胞菌</b>：庆大/妥布/阿米卡星有效，<b>链霉素不针对铜绿(无效)</b>。</li>\n<li><b>四环素类(多西、米诺)</b>：广谱(立克次体、支原体、衣原体、螺旋体)；不良反应=儿童牙釉质黄染、肝损。</li>\n</ul></div>"}, {"name": "二十九–三十六、喹诺酮、磺胺、抗真菌病毒、抗结核、抗肿瘤", "html": "\n<div class=\"kp\"><b>⭐人工合成抗菌药</b>\n<ul>\n<li>⭐<b>第三代喹诺酮(左氧氟沙星、环丙沙星)</b>：抑制 DNA 回旋酶/拓扑异构酶Ⅳ；广谱(尤其 G⁻、泌尿系、肠道)；机制=<b>抑制 DNA 回旋酶</b>。<b>伤寒首选氟喹诺酮</b>。</li>\n<li><b>磺胺类</b>：抑制二氢叶酸合成酶(与 PABA 竞争)；<b>甲氧苄啶(TMP)</b>抑制二氢叶酸还原酶，二者协同(复方新诺明 SMZco)。</li>\n<li>⭐<b>甲硝唑(灭滴灵)</b>：抗<b>厌氧菌</b>(脆弱类杆菌)、滴虫、阿米巴；机制=损伤 DNA。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐抗真菌/抗病毒/抗结核</b>\n<ul>\n<li>抗真菌：氟康唑(念珠菌、隐球菌)、两性霉素B(深部真菌，肾毒性大)。</li>\n<li>抗病毒：<b>阿昔洛韦</b>(HSV，抑制病毒 DNA 聚合酶、需病毒激酶活化)；利巴韦林(广谱，呼吸道合胞病毒)；干扰素(抗病毒、抗肿瘤、免疫调节)；<b>HIV 中和抗原的包膜蛋白=gp120</b>(结合 CD4)，gp41 介导融合。</li>\n<li>⭐<b>抗结核</b>：<b>异烟肼(INH)</b>杀菌(细胞壁分枝菌酸)、周围神经炎(补 Vit B6)；<b>利福平</b>杀细胞内/外菌、肝毒性、诱导药酶(橙红尿、降效避孕药)；<b>乙胺丁醇</b>球后视神经炎；<b>吡嗪酰胺</b>细胞内杀菌、痛风样关节疼。<b>对结核无效的药</b>：如青霉素、普通头孢(无细胞壁合成靶点在分枝杆菌外)等常作干扰项。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐抗肿瘤药</b>\n<ul>\n<li>分类：①干扰核酸合成：甲氨蝶呤(二氢叶酸还原酶)、5-FU(胸苷酸合成酶)、巯嘌呤(嘌呤类似)；②破坏 DNA：顺铂、环磷酰胺(需肝激活，出血性膀胱炎用美司钠)；③干扰转录：阿霉素(蒽环，心脏毒性)、放线菌素；④抑制蛋白：长春碱/紫杉醇(微管)。</li>\n<li>非细胞毒：激素类、分子靶向(曲妥珠单抗等)、免疫(CTLA-4/PD-1 抑制剂)。</li>\n</ul></div>"}]}, {"subject": "人体解剖学", "score": 8, "hours": "约4小时", "chapters": [{"name": "一、运动系统", "html": "\n<div class=\"kp\"><b>⭐骨与关节</b>\n<ul>\n<li><b>躯干骨</b>：椎骨(26：颈椎7、胸椎12、腰椎5、骶骨1、尾骨1)、胸骨、肋(12对)。</li>\n<li><b>脑颅骨 8</b>：额、顶×2、枕、颞×2、蝶、筛。<b>面颅骨 15</b>：上颌×2、下颌、颧×2、鼻×2、泪×2、腭×2、下鼻甲×2、犁骨、舌骨。口诀\"下颌犁舌各一，其余成对\"。</li>\n<li><b>上肢骨</b>：锁骨、肩胛骨、肱骨、桡骨、尺骨、腕骨(8)、掌、指。<b>下肢骨</b>：髋、股骨、髌、胫骨、腓骨、跗骨(7)、跖、趾。</li>\n<li><b>关节基本结构</b>：关节面、关节囊、关节腔(负压，含滑液)；辅助：韧带、关节盘、半月板。</li>\n<li><b>胸锁乳突肌</b>：起胸骨柄+锁骨内侧，止颞骨乳突；一侧收缩头向同侧、面转向对侧；双侧收缩仰头。</li>\n<li>⭐<b>膈三个裂孔</b>：<b>主动脉裂孔</b>(T12，主动脉+胸导管)、<b>食管裂孔</b>(T10，食管+迷走神经)、<b>腔静脉孔</b>(T8，下腔静脉)。</li>\n</ul></div>"}, {"name": "二–七、消化、呼吸、泌尿、生殖、腹膜", "html": "\n<div class=\"kp\"><b>⭐消化 & 呼吸解剖</b>\n<ul>\n<li>⭐<b>食管三个狭窄</b>：①起始(咽与食管，C6)；②与左主支气管交叉(T4/T5)；③穿膈食管裂孔(T10)。临床意义=异物/肿瘤/插管好发处。</li>\n<li><b>胃</b>：贲门(左季肋区)、幽门(通十二指肠)；分贲门/胃底/胃体/幽门部；大部分在左季肋区。</li>\n<li><b>小肠</b>=十二指肠(球部溃疡好发)+空肠+回肠；<b>大肠</b>=盲肠(阑尾)、结肠(升横降乙状)、直肠、肛管。回盲瓣防返流。</li>\n<li><b>肝</b>：膈面隆凸、脏面\"H\"沟(左/右纵沟、横沟=肝门，有门静脉/肝动脉/肝管/神经淋巴出入，称肝蒂)；<b>输胆管道</b>：肝管→胆总管→十二指肠大乳头；胆汁肝分泌。</li>\n<li>⭐<b>鼻旁窦(鼻窦)开口</b>：额窦、上颌窦、前中筛窦→中鼻道；后筛窦→上鼻道；蝶窦→蝶筛隐窝。<b>上颌窦开口高、容积大→易积脓</b>。</li>\n<li><b>左/右主支气管</b>：左细长平(约45°)，右粗短陡(约25°)→异物易入右。</li>\n<li><b>肺门/肺根</b>：主支气管、血管、淋巴、神经出入；肺根内结构排列(从前到后：上肺静脉、肺动脉、主支气管)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐泌尿 & 生殖 & 腹膜</b>\n<ul>\n<li><b>泌尿系统</b>：肾(腹膜后，左高右低，肾门约 T12-L1 水平，出入=肾蒂：从前到后肾静脉、肾动脉、肾盂)、输尿管(三狭窄：肾盂移行、跨髂血管、壁内段)、膀胱、尿道。</li>\n<li><b>男性尿道</b>：分部=前列腺部+膜部+海绵体部；<b>三狭窄</b>(尿道内口、膜部、外口最窄)、<b>三扩大</b>(前列腺部、球部、舟状窝)、<b>两弯曲</b>(耻骨下弯固定、耻骨前弯可消)。</li>\n<li><b>女性生殖</b>：卵巢(产生卵细胞)、输卵管(壶腹受精)、子宫(前倾前屈)、阴道。</li>\n<li><b>腹膜/腹膜腔</b>：男性腹膜腔封闭，女性经输卵管通外界(易上行感染)；<b>直肠子宫陷凹(道格拉斯窝)</b>为直立最低点(积液)。</li>\n</ul></div>"}, {"name": "八–九、脉管、感觉器", "html": "\n<div class=\"kp\"><b>⭐脉管系统</b>\n<ul>\n<li><b>心的位置外形</b>：胸腔中纵隔，2/3 居左；心底朝右后上，心尖朝左前下(左第5肋间隙锁骨中线内)。</li>\n<li><b>主动脉</b>：升主动脉(起自左心室，发出冠状动脉)→主动脉弓(三大分支从右向左=<b>头臂干、左颈总、左锁骨下</b>)→降主动脉(胸、腹)。</li>\n<li>⭐<b>肝门静脉</b>：由肠系膜上静脉+脾静脉汇合；属支=肠系膜上/下静脉、脾静脉、胃左静脉、附脐静脉等；收集腹腔不成对脏器(胃、肠、脾、胰)静脉血，经肝窦→肝静脉→下腔静脉（无瓣膜，门脉高压时侧支循环开放：食管静脉曲张、脐周海蛇头、痔）。</li>\n<li><b>淋巴系统</b>：淋巴管道(毛细淋巴→淋巴管→淋巴结→淋巴干→导管)、淋巴器官(淋巴结、脾、胸腺、扁桃体)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐感觉器</b>\n<ul>\n<li><b>眼球外肌</b>：提上睑肌、上直肌(上)、下直肌(下)、内直肌(内)、外直肌(外)、上斜肌(外下，滑车神经)、下斜肌(外上)。</li>\n<li>⭐<b>鼓室六壁</b>：上(盖壁)、下(颈静脉壁)、前(颈动脉壁，通咽鼓管)、后(乳突壁，通乳突窦)、内侧(迷路壁，有前庭窗/蜗窗)、外侧(鼓膜壁)。⭐<b>鼓室前壁通咽鼓管</b>(与鼻咽相通，小儿易致中耳炎)。</li>\n<li><b>听觉感受器</b>=螺旋器(Corti器，蜗管基底膜)；<b>位置觉感受器</b>=壶腹嵴(半规管)、椭圆囊斑/球囊斑(前庭)。</li>\n</ul></div>"}, {"name": "十、神经系统", "html": "\n<div class=\"kp\"><b>⭐脑神经 & 传导通路</b>\n<ul>\n<li><b>12 对脑神经</b>(口诀：一嗅二视三动眼，四滑五叉六外展，七面八听九舌咽，十迷十一副十二舌下)。性质：感觉(ⅠⅡⅧ)、运动(ⅢⅣⅥⅪⅫ)、混合(ⅤⅦⅨⅩ)。</li>\n<li>⭐<b>膈神经(C3-C5)</b>：支配膈(运动+感觉)；<b>面神经</b>含特殊内脏运动(面肌)、一般内脏运动(泪腺/涎腺副交感)、特殊内脏感觉(味觉)、一般躯体感觉；⭐<b>面神经中\"没有\"的特殊内脏神经?</b>(题目常考面神经组成，需记其含一般躯体感觉缺如)。</li>\n<li><b>内囊</b>：丘脑与尾状核/豆状核之间；完全受损→\"三偏\"(对侧偏瘫、偏身感觉障碍、偏盲)。</li>\n<li>⭐<b>意识性本体觉/精细触觉通路</b>：脊神经节→薄束/楔束→薄/楔束核→内侧丘系交叉→丘脑→皮质。</li>\n<li><b>痛温觉/粗触通路</b>：脊髓后角→白质前连合交叉→脊髓丘脑束→丘脑。</li>\n<li><b>视觉通路</b>：视锥视杆→双极→节细胞→视神经→视交叉(鼻侧交叉)→视束→外侧膝状体→视辐射→枕叶视区。一侧视神经损伤→同侧全盲；视交叉中部损→双颞侧偏盲。</li>\n<li><b>皮质脊髓束</b>：皮质→内囊→延髓锥体交叉→脊髓前角(躯干四肢随意运动)；<b>皮质核束</b>：支配脑神经运动核(除面神经下份、舌下神经受对侧支配→中枢性面瘫/舌瘫为对侧)。</li>\n<li>⭐<b>脑动脉来源</b>：颈内动脉+椎-基底动脉(Willis 环)；<b>脑脊液</b>：由各脑室脉络丛产生，侧脑室→室间孔→第三脑室→中脑导水管→第四脑室→正中孔/外侧孔→蛛网膜下腔→蛛网膜颗粒→上矢状窦。</li>\n<li><b>内脏运动神经 vs 躯体运动神经</b>：内脏运动需两级神经元(节前+节后)、不受意识支配、支配平滑肌/心肌/腺体；躯体运动一级、受意识支配、支配骨骼肌。</li>\n</ul></div>"}]}, {"subject": "医学微生物学", "score": 8, "hours": "约4小时", "chapters": [{"name": "一–六、绪论、细菌形态、生理、噬菌体、遗传变异、耐药", "html": "\n<div class=\"kp\"><b>⭐微生物分类</b>\n<ul>\n<li>三大类：<b>非细胞型</b>(病毒，无典型细胞结构、仅一种核酸)、<b>原核细胞型</b>(细菌、支原体、衣原体、立克次体、螺旋体、放线菌，无核膜)、<b>真核细胞型</b>(真菌，有核膜细胞器)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐细菌结构与特殊结构</b>\n<ul>\n<li>基本结构：细胞壁(肽聚糖，G⁺厚、G⁻薄且外膜含脂多糖 LPS)、细胞膜(中介体=拟线粒体，呼吸酶所在)、细胞质(核糖体70S=50S+30S)、核质(拟核，无核膜)。</li>\n<li><b>G⁺ vs G⁻ 壁差异</b>：G⁺ 肽聚糖厚、磷壁酸、无外膜；G⁻ 肽聚糖薄、有外膜(LPS内毒素)、无磷壁酸。</li>\n<li><b>细菌 L 型</b>：细胞壁缺陷型，呈多形性，高渗环境生长，与慢性/反复感染相关。</li>\n<li>⭐<b>特殊结构</b>：<b>荚膜</b>(抗吞噬，与致病力相关，如肺炎链球菌)、<b>鞭毛</b>(运动、H抗原)、<b>菌毛</b>(黏附，性菌毛传递质粒)、<b>芽胞</b>(休眠体，耐热力强，炭疽/破伤风/肉毒/产气荚膜形成；<b>灭菌以杀灭芽胞为标准</b>)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐细菌生理 & 遗传 & 耐药</b>\n<ul>\n<li>营养/生长：20-30min 一代；<b>生长曲线</b>：迟缓期、对数期(生长最快、形态典型，<b>观察/研究细菌最好选此期</b>)、稳定期、衰亡期。</li>\n<li><b>专性厌氧菌不能在有氧生长</b>：因缺 SOD/过氧化氢酶、易氧中毒。</li>\n<li>合成代谢产物：热原质(细菌内毒素致热，G⁻ LPS)、毒素、抗生素、维生素、色素、细菌素。</li>\n<li><b>消毒 vs 灭菌</b>：消毒=杀灭病原微生物(不一定杀芽胞)；灭菌=杀灭所有微生物(含芽胞)。<b>高压蒸汽灭菌</b>(121℃,15-20min)最常用；巴氏消毒(62℃30min/72℃15s，牛奶酒类)；紫外线(损伤 DNA，表面消毒)；滤过除菌(不耐热的血清/药液)。</li>\n<li>遗传：质粒(可自主复制、可转移，F质粒致性菌毛、R质粒致耐药)；转导/转化/接合/溶原性转换。</li>\n<li><b>耐药性</b>：固有/获得；机制=产钝化酶(β-内酰胺酶)、靶位改变、膜通透↓、主动外排、生物被膜。</li>\n</ul></div>"}, {"name": "七–八、感染免疫、检测防治", "html": "\n<div class=\"kp\"><b>⭐感染与免疫</b>\n<ul>\n<li><b>正常菌群</b>：人体常驻有益菌（如肠道菌群合成Vit K、拮抗病原）。<b>机会致病菌</b>：寄居部位改变/宿主免疫力↓/菌群失调时致病。</li>\n<li>⭐<b>菌群失调症(二重感染)</b>：长期用广谱抗生素→敏感菌被抑、耐药菌(如白念珠菌、艰难梭菌)过度繁殖→新感染。</li>\n<li><b>毒力</b>=侵袭力+毒素。⭐<b>外毒素 vs 内毒素</b>：外毒素(由 G⁺/部分G⁻分泌、蛋白质、强、有特异性、可成类毒素)；内毒素(<b>G⁻ 细胞壁 LPS</b>、耐热、无特异性、致热休克DIC)。</li>\n<li>感染类型：隐性/显性；局部/全身。<b>菌血症、毒血症、败血症、脓毒血症、内毒素血症</b>概念需掌握。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐疫苗 & 免疫防治</b>\n<ul>\n<li><b>死疫苗</b>(灭活，如伤寒、霍乱、乙脑、狂犬病)、<b>活疫苗</b>(减毒，如卡介苗、脊灰糖丸、麻疹、水痘)、<b>类毒素</b>(白百破中白喉/破伤风类毒素)、<b>亚单位/基因工程疫苗</b>(乙肝基因工程、HPV)。</li>\n<li>⭐<b>卡介苗(BCG)=减毒活疫苗</b>(牛型结核杆菌减毒)，用于预防结核。</li>\n<li>人工被动免疫：抗毒素(破伤风/白喉)、丙种球蛋白、抗菌血清。</li>\n</ul></div>"}, {"name": "九–十五、球菌、肠杆菌、弧菌、螺杆菌、厌氧、分枝、其他细菌", "html": "\n<div class=\"kp\"><b>⭐球菌</b>\n<ul>\n<li>⭐<b>金黄色葡萄球菌</b>：G⁺、SPA(与IgG Fc结合)、血浆凝固酶(+)、金黄色色素；致病物质=凝固酶、毒素(肠毒素→食物中毒、TSST-1→TSS)；所致=疖痈、肺炎、败血症、食物中毒。<b>对青霉素耐药率高，常用耐酶青霉素/万古霉素</b>；甲氧西林耐药MRSA用万古霉素。</li>\n<li>⭐<b>A群链球菌</b>：M蛋白(抗吞噬)、链球菌溶血素O(ASO 试验)、致热外毒素(猩红热)；所致=咽炎、猩红热、风湿热、肾小球肾炎(免疫复合物)；秋季化脓性感染首选<b>青霉素</b>。</li>\n<li><b>肺炎链球菌</b>：G⁺、荚膜(致病)、optochin 敏感；大叶性肺炎、脑膜炎。</li>\n<li><b>脑膜炎奈瑟菌</b>：G⁻双球菌、飞沫传播、脑脊液中中性粒细胞↑；流脑；青霉素。</li>\n<li><b>淋病奈瑟菌</b>：G⁻双球菌、泌尿生殖道、性传播；头孢曲松。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐肠杆菌 & 弧菌 & 螺杆菌</b>\n<ul>\n<li><b>大肠埃希菌</b>：肠道正常菌，某些致病(ETEC旅游腹泻、EHEC O157:H7出血性)、泌尿系统感染最常见；卫生指标(大肠菌群数)。</li>\n<li>⭐<b>志贺菌</b>：细菌性痢疾(黏液脓血便)；<b>沙门菌</b>：伤寒/副伤寒、食物中毒(禽蛋)；伤寒=回肠末端，肥达反应；治疗氟喹诺酮。</li>\n<li>⭐<b>霍乱弧菌</b>：G⁻逗点状、嗜碱、鞭毛；<b>霍乱肠毒素(CT)</b>激活腺苷酸环化酶→cAMP↑→大量水样泻(米泔水样)；补液为主。</li>\n<li><b>副溶血性弧菌</b>：嗜盐，海产品致胃肠炎。</li>\n<li><b>幽门螺杆菌</b>：G⁻、螺形、尿素酶(+)、胃内；致慢性胃炎、消化性溃疡、胃癌；与<b>慢性胃炎和胃癌相关</b>。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐厌氧菌 & 分枝杆菌 & 其他</b>\n<ul>\n<li>⭐<b>厌氧芽胞梭菌</b>：<b>破伤风梭菌</b>(土壤、深部伤口、痉挛毒素→苦笑面容角弓反张，预防破伤风类毒素/抗毒素、清创)；<b>产气荚膜梭菌</b>(气性坏疽、α毒素)；<b>肉毒梭菌</b>(肉毒毒素→肌肉弛缓性麻痹，毒素致死最强，不耐热)。</li>\n<li>⭐<b>结核分枝杆菌</b>：抗酸染色(+)细长略弯、细胞壁含大量脂质(分枝菌酸)→抗干燥；致病靠菌体成分(索状因子、蜡质D)；免疫为<b>有菌免疫(感染免疫)</b>；<b>结核菌素试验(PPD/OT)</b>测Ⅳ型迟发超敏，阳性=曾感染/接种卡介苗、强阳性提示活动性结核；预防=卡介苗。</li>\n<li>其他：布鲁菌(波浪热)、鼠疫耶尔森(鼠蚤→人，黑死病)、炭疽(皮肤炭疽、Ascoli 试验)、白喉棒状(异染颗粒、白喉毒素)、百日咳、军团菌、铜绿假单胞菌(绿脓、医源性、对庆大/妥布有效对链霉素无效)。</li>\n</ul></div>"}, {"name": "十六–二十、支原体、立克次体、衣原体、螺旋体、病毒性状", "html": "\n<div class=\"kp\"><b>⭐非典型病原体</b>\n<ul>\n<li><b>支原体</b>：无细胞壁、最小原核、油煎蛋菌落；<b>肺炎支原体</b>(非典型肺炎、冷凝集试验)、<b>解脲脲原体</b>(泌尿生殖感染、不育)。</li>\n<li><b>立克次体</b>：节肢动物媒介、胞内寄生；普氏(人虱→流行性斑疹伤寒)、斑疹伤寒立克次体(鼠蚤→地方性)。</li>\n<li><b>衣原体</b>：有独特发育周期(原体→网状体)；<b>沙眼衣原体</b>(沙眼、性病淋巴肉芽肿、NGU)、<b>肺炎衣原体</b>(肺炎)。</li>\n<li><b>螺旋体</b>：<b>钩端螺旋体</b>(鼠尿污染水、钩体病、眼结膜充血)、<b>梅毒螺旋体</b>(性传播、镀银染色、TPHA/FTA 检测、青霉素)；回归热疏螺旋体。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐病毒基本性状</b>\n<ul>\n<li>体积最小(nm)、<b>非细胞型</b>、只含一种核酸(DNA或RNA)、<b>三种对称型</b>(螺旋、二十面体、复合)；结构=核酸+衣壳(+包膜)。</li>\n<li><b>复制周期</b>：吸附→穿入→脱壳→生物合成→装配释放。</li>\n<li><b>干扰现象</b>：一种病毒抑制另一种；<b>顿挫感染</b>(细胞条件不全)、<b>缺陷病毒</b>(如丁型肝炎病毒需 HBV 辅助)。</li>\n<li><b>灭活</b>：理化因素使病毒失去感染性(仍保留抗原性)。</li>\n</ul></div>"}, {"name": "二十一–二十六、病毒感染免疫、检查方法、呼吸道/肠道/胃肠/肝炎病毒", "html": "\n<div class=\"kp\"><b>⭐病毒感染与免疫</b>\n<ul>\n<li>致病：直接杀细胞、包涵体形成(诊断价值，如狂犬病 Negri 小体、 CMV 猫头鹰眼)、免疫病理(IFN-γ、CTL)、整合致瘤(HPV→宫颈癌、HBV→肝癌、EBV→鼻咽癌/Burkitt、HTLV→白血病)。</li>\n<li><b>抗病毒免疫</b>：固有=干扰素(IFN-α/β 抗病毒、抗肿瘤、免疫调节，<b>抗病毒主要靠细胞免疫(CD8+CTL)</b>)；适应性=抗体(中和病毒，防再感染)、CTL。</li>\n<li><b>垂直传播</b>：胎盘/产道(风疹、CMV、HBV、HIV)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐各论病毒</b>\n<ul>\n<li><b>流感病毒</b>：包膜 HA/NA；<b>抗原漂移(小变，年流行)与抗原转换(大变，大流行)</b>；分型甲/乙/丙。</li>\n<li><b>麻疹、腮腺炎、风疹、腺病毒、RSV、副流感</b>：儿童呼吸道；麻疹科氏斑、风疹致畸。</li>\n<li><b>脊髓灰质炎</b>：粪口、侵犯前角运动神经元→弛缓性麻痹；疫苗=减毒(Sabin)或灭活(Salk)。</li>\n<li><b>轮状病毒</b>：婴幼儿秋季腹泻(水样泻)。</li>\n<li>⭐<b>甲肝(HAV)</b>：粪口、急性自限、<b>无慢性</b>、有疫苗(减毒/灭活)。<b>乙肝(HBV)</b>：DNA 病毒、<b>HBsAg(表面，感染标志)、HBeAg(复制活跃传染强)、HBcAg(核心)、抗-HBs(保护)、抗-HBc</b>；经血/母婴/性；<b>与原发性肝癌相关</b>；基因工程疫苗(重组 HBsAg)。<b>丙肝(HCV)</b>：血传、易慢性、肝癌。<b>丁肝(HDV)</b>需 HBV 辅助。<b>戊肝(HEV)</b>：粪口、孕妇重。</li>\n</ul></div>"}, {"name": "二十七–三十四、虫媒、出血热、疱疹、逆转录、其他、朊粒、真菌", "html": "\n<div class=\"kp\"><b>⭐特殊病毒 & 真菌</b>\n<ul>\n<li><b>乙脑病毒</b>：蚊媒、猪为储存宿主、蚊→人；脑膜脑炎(小儿)。</li>\n<li><b>汉坦病毒</b>：鼠媒、肾综合征出血热(三红三痛、肾损)。</li>\n<li><b>疱疹病毒</b>：HSV-1(口唇)、HSV-2(生殖)、VZV(水痘/带状疱疹)、EBV(传单、鼻咽癌)、CMV(巨细胞包涵体)、HHV-8(Kaposi)。潜伏感染特点。</li>\n<li>⭐<b>HIV</b>：逆转录病毒、<b>gp120 结合 CD4</b>(T 细胞/巨噬细胞)、gp41 融合；破坏 CD4⁺T→AIDS；经性/血/母婴；抗逆转录(核苷类+蛋白酶/整合酶抑制剂)。</li>\n<li><b>狂犬病</b>：弹状病毒、动物咬伤、Negri小体、病死率近100%、暴露后疫苗+免疫球蛋白。</li>\n<li><b>HPV</b>：性传播、<b>与宫颈癌相关</b>、有疫苗。</li>\n<li><b>朊粒(Prion)</b>：无核酸、蛋白质感染因子、PrPᶜ→PrPˢᶜ；致海绵状脑病(疯牛病、克雅病)；对理化强抗、焚烧处理。</li>\n<li><b>真菌</b>：单细胞(酵母，如白假丝酵母菌)、多细胞(菌丝+孢子，皮肤癣菌)；机会致病=白念珠菌、新生隐球菌(脑膜)、肺孢子菌(艾滋病肺炎)。</li>\n</ul></div>"}]}, {"subject": "医学免疫学", "score": 8, "hours": "约4小时", "chapters": [{"name": "一–四、免疫学概述、免疫系统、抗原", "html": "\n<div class=\"kp\"><b>⭐免疫学基础</b>\n<ul>\n<li><b>现代免疫</b>=机体识别\"自己/非己\"并清除，维持稳态；功能=免疫防御(抗感染)、免疫自稳(清衰老/损伤)、免疫监视(抗肿瘤)。</li>\n<li><b>固有免疫</b>(先天、非特异、无记忆) vs <b>适应性免疫</b>(获得、特异、有记忆)；适应性应答基本过程=识别→活化增殖→效应。</li>\n<li><b>Burnet 克隆选择学说</b>：体内存在多种淋巴细胞克隆，抗原选择相应克隆扩增分化。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐免疫系统 & 抗原</b>\n<ul>\n<li><b>中枢免疫器官</b>：骨髓(造血、B 细胞成熟)、胸腺(T 细胞成熟)。<b>外周</b>：脾、淋巴结、黏膜相关(MALT)。<b>淋巴细胞再循环</b>：淋巴细胞经血液↔淋巴组织循环，增加接触抗原机会。</li>\n<li>⭐<b>抗原</b>：两个基本特征=<b>免疫原性+抗原性(反应原性)</b>。决定 immunogenicity 因素：异物性、分子量(>10kDa好)、结构复杂、宿主遗传。</li>\n<li><b>抗原表位(决定簇)</b>：抗原被 TCR/BCR/抗体识别的片段。</li>\n<li><b>共同抗原/交叉反应</b>：不同抗原含相同表位→抗体可与两者结合(如链球菌与心瓣膜)。</li>\n<li>⭐<b>TD-Ag(胸腺依赖)</b>：需 Th 辅助，引起体液+细胞免疫(大多数蛋白抗原)；<b>TI-Ag(非胸腺依赖)</b>：不需 Th，只引起体液(多糖、LPS)。</li>\n<li><b>异嗜性抗原</b>(Forssman)：与种属无关的共同抗原(如 A 族链球菌 M 蛋白与人心肌)。</li>\n<li><b>超抗原</b>(如金葡肠毒素)、丝裂原(非特异性促淋巴细胞增殖)。</li>\n</ul></div>"}, {"name": "五–八、抗体、补体、细胞因子、白细胞分化抗原", "html": "\n<div class=\"kp\"><b>⭐抗体(Ig)</b>\n<ul>\n<li><b>免疫球蛋白(Ig)</b>是化学概念，<b>抗体</b>是功能概念；抗体都是 Ig，Ig 不都是抗体(如骨髓瘤蛋白)。</li>\n<li>⭐<b>结构</b>：基本单位=2 重链(H)+2 轻链(L)；可变区 VH/VL(结合抗原，高变区=CDR)、恒定区 CH/CL(效应)。<b>水解片段</b>：木瓜蛋白酶→2 Fab(抗原结合)+1 Fc(效应)；胃蛋白酶→F(ab')₂+ pFc'。</li>\n<li><b>五类 Ig</b>：<b>IgM</b>(五聚体、分子量最大、<b>最早产生、初级应答、血型天然抗体、宫内感染 IgM↑</b>)；<b>IgG</b>(含量最多、唯一过胎盘、再次应答主力、中和)；<b>IgA</b>(分泌型 sIgA 黏膜免疫)；<b>IgE</b>(亲细胞、I 型超敏、抗寄生虫)；<b>IgD</b>(B 细胞表面标志)。</li>\n<li><b>抗体多样性</b>：胚系多基因、V(D)J 重组、 somatic 高频突变、轻重链组合。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐补体 & 细胞因子</b>\n<ul>\n<li><b>补体</b>：30+ 血浆蛋白；三条激活途径=<b>经典途径</b>(Ag-Ab 复合物启动、C1q 开始、适应性)、<b>旁路途径</b>(微生物表面直接、固有)、<b>凝集素途径</b>(MBL 结合甘露糖)。共有末端=C5b-9 膜攻击复合物(MAC)溶细胞。</li>\n<li><b>补体生物学作用</b>：溶菌溶细胞、调理吞噬(调理素)、炎症介质(C3a/C5a 过敏毒素、趋化)、清除免疫复合物。</li>\n<li>⭐<b>细胞因子(CK)</b>：小分子蛋白、旁/自/内分泌、多效/重叠/拮抗/协同(network)；<b>不是粘附分子</b>(CK 与粘附分子是两类)。分类：白细胞介素(IL)、干扰素(IFN)、肿瘤坏死因子(TNF)、集落刺激因子(CSF)、生长因子(GF)、趋化因子。<b>功能</b>=调节免疫、促造血、炎症、抗肿瘤。</li>\n<li><b>粘附分子</b>：整合素、选择素、免疫球蛋白超家族、钙粘蛋白；介导细胞黏附、迁移、识别。</li>\n</ul></div>"}, {"name": "九–十三、MHC、固有免疫、APC、B细胞、T细胞", "html": "\n<div class=\"kp\"><b>⭐MHC/HLA</b>\n<ul>\n<li><b>MHC(主要组织相容性复合体)</b>：人=HLA 复合体(第6号染色体)。<b>MHC 限制性</b>=T 细胞识别抗原须同时识别自身 MHC（如 CTL 杀伤、Th 辅助均受 MHC 限制）。</li>\n<li><b>HLA 分子结构</b>：Ⅰ类(α链+β2m)=所有有核细胞表达，提呈内源性抗原给 CD8⁺；Ⅱ类(α+β)=APC/活化内皮表达，提呈外源性抗原给 CD4⁺。</li>\n<li><b>MHC 功能</b>：抗原提呈、约束 T 细胞识别、诱导自身耐受、参与移植排斥。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐固有免疫 & APC & 淋巴细胞</b>\n<ul>\n<li><b>固有免疫屏障</b>：皮肤黏膜(物理/化学/生物)、内部(血脑/血胎屏障)。</li>\n<li>⭐<b>PAMP(病原相关分子模式)</b>识别<b>PRR(模式识别受体)</b>：巨噬细胞/DC 表达 TLR 等；NK 细胞识别\"丢失自我\"(MHCⅠ↓)→杀伤，ADCC 经 FcγRⅢ(CD16)。</li>\n<li><b>APC</b>：专职=DC(最强、唯一激活初始T)、巨噬细胞、B 细胞；兼职=内皮、成纤维等。<b>提呈途径</b>：<b>外源性</b>(MHCⅡ，溶酶体)、<b>内源性</b>(MHCⅠ，胞质，病毒/肿瘤)、<b>交叉提呈</b>(DC 将外源蛋白经 MHCⅠ提呈)。</li>\n<li><b>B 细胞</b>：在骨髓成熟，阴性选择(自身耐受)；受体 BCR=膜表面 Ig(mIg)。<b>类别转换</b>(IgM→IgG等)、<b>等位/同型排斥</b>。亚群=B1(TI 应答、天然)、B2(TD 应答、适应性)。</li>\n<li>⭐<b>T 细胞</b>：在胸腺成熟；<b>阳性选择</b>(获得 MHC 限制性、DP→SP)、<b>阴性选择</b>(清除自身反应性、中枢耐受)；受体 TCR(αβ 为主，γδ 为上皮内)；CD4 结合 MHCⅡ、CD8 结合 MHCⅠ；共刺激 CD28(结合 B7)、CTLA-4/PD-1 抑制。亚群：Th(CD4)、CTL(CD8)、Treg、Th1/2/17。</li>\n</ul></div>"}, {"name": "十四–十九、T/B介导应答、免疫耐受、超敏反应、肿瘤免疫、移植", "html": "\n<div class=\"kp\"><b>⭐适应性免疫应答</b>\n<ul>\n<li>⭐<b>T 细胞应答</b>：APC 提呈→TCR 识别(pMHC)+CD28/B7 双信号→活化增殖→效应：CD4⁺Th1 分泌 IFN-γ 等活化巨噬/促进 DTH；CD8⁺<b>CTL 经穿孔素/颗粒酶、FasL 杀伤靶细胞</b>(受 MHCⅠ限制)。</li>\n<li>⭐<b>B 细胞应答</b>：BCR 识别 TD-Ag + Th 辅助(CD40L-CD40、细胞因子)→活化增殖→生发中心(体细胞高频突变、类别转换、亲和力成熟)→浆细胞分泌抗体。<b>初次应答</b>(潜伏期长、IgM 为主、低亲和)、<b>再次应答</b>(快、IgG 为主、高亲和、量大)。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐免疫耐受 & 超敏反应</b>\n<ul>\n<li><b>免疫耐受</b>：对特定抗原不应答；中枢(胸腺/骨髓阴性选择删除)、外周(克隆失能/忽视/调节性T/AICD)。</li>\n<li>⭐<b>四型超敏反应</b>：\n <br>· <b>Ⅰ型(速发/过敏)</b>：IgE+肥大/嗜碱，如青霉素过敏、哮喘、荨麻疹；防治=回避、肾上腺素、抗组胺、脱敏。\n <br>· <b>Ⅱ型(细胞毒)</b>：IgG/IgM 针对细胞表面抗原，如<b>输血反应、新生儿溶血症、Graves、Goodpasture、自身免疫溶血</b>。\n <br>· <b>Ⅲ型(免疫复合物)</b>：Ag-Ab 复合物沉积，如血清病、SLE、Arthus、类风湿性关节炎。\n <br>· <b>Ⅳ型(迟发/细胞介导)</b>：T 细胞(Th1/CTL)，如<b>结核菌素试验、接触性皮炎、移植排斥、肉芽肿</b>。</li>\n</ul></div>\n<div class=\"kp\"><b>⭐肿瘤免疫 & 移植免疫</b>\n<ul>\n<li><b>肿瘤抗原</b>：TSA(肿瘤特异)、TAA(肿瘤相关，如 AFP、CEA、PSA)、TSTA。机体抗肿瘤：CTL、NK、巨噬、抗体(ADCC)。<b>逃逸</b>=抗原调变、MHC↓、分泌抑制因子、诱导 Treg。</li>\n<li>⭐<b>移植免疫</b>：<b>直接识别</b>(受者 T 识别供者 APC 的 MHC，急性排斥主因)、<b>间接识别</b>(受者 APC 提呈供者抗原)。<b>超急性排斥</b>=预存抗体(抗 ABO/HLA)→数分钟至24h内血管内凝血、不可逆(术前必须交叉配型/ABO 相合)；急性(细胞免疫为主，数天-数周)；慢性(血管内膜增生，数月-年)。</li>\n</ul></div>"}]}];
const QUIZ = [{"id": "b1", "s": 0, "c": 0, "q": "蛋白质分子一定具有的结构层次是：", "o": ["四级结构", "亚基", "三级结构", "β-折叠"], "a": 2, "e": "单链蛋白质三级结构即具有完整生物学活性，四级结构与亚基仅多亚基蛋白才有；二级结构(α螺旋/β折叠)也是常见但'一定'具备的是三级结构。"}, {"id": "b2", "s": 0, "c": 0, "q": "维系蛋白质一级结构稳定的主要化学键是：", "o": ["氢键", "肽键", "离子键", "疏水作用"], "a": 1, "e": "一级结构是氨基酸排列顺序，连接键为肽键；氢键等维系高级结构。"}, {"id": "b3", "s": 0, "c": 0, "q": "关于α-螺旋的叙述，错误的是：", "o": ["右手螺旋", "每圈含3.6个氨基酸残基", "侧链伸向螺旋内侧", "靠氢键维系稳定性"], "a": 2, "e": "α-螺旋侧链伸向外侧，氢键在链内相邻圈之间形成。"}, {"id": "b4", "s": 0, "c": 0, "q": "蛋白质变性时不被破坏的是：", "o": ["二硫键", "氢键", "疏水作用", "肽键"], "a": 3, "e": "变性破坏次级键(氢键、疏水、离子键)及二硫键，空间构象破坏，但一级结构(肽键)不变。"}, {"id": "b5", "s": 0, "c": 1, "q": "DNA的碱基组成规律(Chargaff规则)是：", "o": ["A=G，C=T", "A=T，G=C", "A+C=G+T不成立", "A+U=G+C"], "a": 1, "e": "DNA中A=T、G=C，嘌呤总和=嘧啶总和。"}, {"id": "b6", "s": 0, "c": 1, "q": "真核生物染色质的基本结构单位是：", "o": ["核糖体", "核小体", "端粒", "中心体"], "a": 1, "e": "DNA缠绕组蛋白八聚体形成核小体，是染色质基本单位。"}, {"id": "b7", "s": 0, "c": 1, "q": "tRNA分子上负责识别mRNA密码子的结构是：", "o": ["氨基酸臂", "反密码子环", "TψC环", "额外环"], "a": 1, "e": "tRNA反密码子环含反密码子，与mRNA密码子互补配对。"}, {"id": "b8", "s": 0, "c": 2, "q": "竞争性抑制作用的特点是：", "o": ["Km降低，Vmax不变", "Km升高，Vmax不变", "Km不变，Vmax降低", "Km和Vmax均降低"], "a": 1, "e": "竞争性抑制剂与底物竞争活性中心，增大表观Km，Vmax不变(增加底物可克服)。"}, {"id": "b9", "s": 0, "c": 2, "q": "酶原激活的本质是：", "o": ["辅酶结合", "酶蛋白变性", "切除部分肽段形成/暴露活性中心", "别构调节"], "a": 2, "e": "酶原经水解切除肽段，形成有活性的活性中心(如胰蛋白酶原→胰蛋白酶)。"}, {"id": "b10", "s": 0, "c": 2, "q": "含维生素B1的辅酶是：", "o": ["NAD+", "TPP", "FAD", "CoA"], "a": 1, "e": "TPP(硫胺素焦磷酸)含Vit B1；NAD+(B3)、FAD(B2)、CoA(B5)。"}, {"id": "b11", "s": 0, "c": 3, "q": "糖酵解途径的三个关键限速酶不包括：", "o": ["己糖激酶", "6-磷酸果糖激酶-1", "丙酮酸激酶", "葡萄糖-6-磷酸酶"], "a": 3, "e": "葡萄糖-6-磷酸酶是肝糖原分解相关酶，非糖酵解关键酶；糖酵解三关键酶为前述三者。"}, {"id": "b12", "s": 0, "c": 3, "q": "短期饥饿时机体内增强的代谢过程是：", "o": ["脂肪合成", "糖酵解", "糖原合成", "肝糖异生"], "a": 3, "e": "饥饿时血糖下降，胰高血糖素升高，肝糖异生活跃以维持血糖；脂肪动员也增强但供能不直接升血糖。历年题高频。"}, {"id": "b13", "s": 0, "c": 3, "q": "磷酸戊糖途径的主要生理意义是生成：", "o": ["ATP和NADH", "NADPH和5-磷酸核糖", "丙酮酸", "乙酰CoA"], "a": 1, "e": "该途径产生NADPH(供氢/抗氧化)和5-磷酸核糖(核苷酸合成)，关键酶6-磷酸葡萄糖脱氢酶(缺之致蚕豆病)。"}, {"id": "b14", "s": 0, "c": 3, "q": "肌肉组织不能补充血糖的原因是：", "o": ["缺乏葡萄糖激酶", "缺乏葡萄糖-6-磷酸酶", "缺乏糖原合酶", "缺乏磷酸化酶"], "a": 1, "e": "肌糖原分解产生G-6-P，但肌肉无葡萄糖-6-磷酸酶，不能将G-6-P转为葡萄糖释放入血；肝有此酶可补血糖。"}, {"id": "b15", "s": 0, "c": 4, "q": "体内ATP生成的最主要方式是：", "o": ["底物水平磷酸化", "氧化磷酸化", "肌肉收缩", "糖酵解"], "a": 1, "e": "氧化磷酸化(呼吸链+ATP合酶)是机体最主要供能方式；底物水平磷酸化贡献较少。"}, {"id": "b16", "s": 0, "c": 5, "q": "脂肪酸β-氧化的部位和主要产物是：", "o": ["胞浆，乙酰CoA", "线粒体，乙酰CoA+NADH+FADH2", "内质网，酮体", "溶酶体，甘油"], "a": 1, "e": "脂肪酸β-氧化在线粒体进行，每轮生成1乙酰CoA、1 NADH、1 FADH2。"}, {"id": "b17", "s": 0, "c": 5, "q": "酮体生成的限速酶是：", "o": ["HMG-CoA还原酶", "HMG-CoA合酶", "肉碱脂酰转移酶Ⅰ", "乙酰CoA羧化酶"], "a": 1, "e": "HMG-CoA合酶是酮体生成关键酶(在肝)；HMG-CoA还原酶是胆固醇合成关键酶。"}, {"id": "b18", "s": 0, "c": 5, "q": "血浆中逆向转运胆固醇、抗动脉粥样硬化的脂蛋白是：", "o": ["CM", "VLDL", "LDL", "HDL"], "a": 3, "e": "HDL将外周胆固醇运回肝(逆向转运)具抗AS作用；LDL转运胆固醇至外周，致AS。"}, {"id": "b19", "s": 0, "c": 6, "q": "人体营养必需氨基酸的数量是：", "o": ["8种", "10种", "12种", "20种"], "a": 0, "e": "成人为8种：缬、异亮、亮、苯丙、甲硫(蛋)、色、苏、赖。"}, {"id": "b20", "s": 0, "c": 6, "q": "体内氨的主要转运形式和主要去路分别是：", "o": ["谷氨酰胺转运，合成尿素", "丙氨酸转运，合成谷氨酰胺", "尿素直接排出，合成蛋白质", "NH4+，合成尿酸"], "a": 0, "e": "脑/肌以谷氨酰胺运氨，肌以丙氨酸-葡萄糖循环运氨；氨主要在肝经鸟氨酸循环合成尿素解毒。"}, {"id": "b21", "s": 0, "c": 6, "q": "苯丙酮尿症(PKU)是由于缺乏：", "o": ["酪氨酸酶", "苯丙氨酸羟化酶", "多巴脱羧酶", "二氢生物蝶呤还原酶"], "a": 1, "e": "PKU因苯丙氨酸羟化酶缺陷，苯丙氨酸不能转酪氨酸，蓄积并经旁路→尿有鼠臭味、智力低下(饮食控制可治)。"}, {"id": "b22", "s": 0, "c": 6, "q": "一碳单位的载体是：", "o": ["SAM", "四氢叶酸(FH4)", "生物素", "CoA"], "a": 1, "e": "一碳单位由四氢叶酸携带；SAM是活性甲硫氨酸(甲基供体)。"}, {"id": "b23", "s": 0, "c": 7, "q": "痛风患者嘌呤分解代谢的终产物堆积，该产物是：", "o": ["尿素", "尿酸", "β-丙氨酸", "氨"], "a": 1, "e": "人类嘌呤分解终产物为尿酸，尿酸过高→痛风；别嘌醇抑制黄嘌呤氧化酶治疗。"}, {"id": "b24", "s": 0, "c": 7, "q": "核苷酸抗代谢物中，抑制二氢叶酸还原酶的是：", "o": ["6-巯基嘌呤", "5-氟尿嘧啶", "甲氨蝶呤", "阿糖胞苷"], "a": 2, "e": "甲氨蝶呤(MTX)是叶酸类似物，抑制二氢叶酸还原酶；6-MP为嘌呤类似物，5-FU抑制胸苷酸合成酶。"}, {"id": "b25", "s": 0, "c": 8, "q": "遗传密码的摆动性(wobble)是指：", "o": ["密码子第1位与反密码子第3位配对不严格", "反密码子第1位与密码子第3位配对不严格", "密码子可任意排列", "同义密码子完全等同"], "a": 1, "e": "摆动性：tRNA反密码子5'端(第1位)与mRNA密码子3'端(第3位)配对不严格，使一种tRNA识别多个同义密码子。"}, {"id": "b26", "s": 0, "c": 8, "q": "DNA复制的方式是：", "o": ["全保留复制", "半保留复制", "分散复制", "端粒复制"], "a": 1, "e": "DNA复制为半保留、半不连续(领头链连续、随从链冈崎片段)。"}, {"id": "b27", "s": 0, "c": 8, "q": "DNA损伤后主要修复途径、且与紫外线所致嘧啶二聚体相关的是：", "o": ["SOS修复", "切除修复", "光修复", "重组修复"], "a": 2, "e": "UV致TT二聚体由光修复酶(光解酶)修复；切除修复是最普遍的主要修复方式。题中'光修复'对应UV二聚体最直接。"}, {"id": "b28", "s": 0, "c": 8, "q": "原核生物乳糖操纵子的阻遏蛋白结合于：", "o": ["CAP位点", "操纵序列O", "启动子P", "结构基因"], "a": 1, "e": "Lac阻遏蛋白结合操纵序列O，阻止转录(负调控)；CAP结合于启动子上游正调控。"}, {"id": "b29", "s": 0, "c": 9, "q": "下列物质中不属于第二信使的是：", "o": ["cAMP", "IP3", "DAG", "AC(腺苷酸环化酶)"], "a": 3, "e": "第二信使有cAMP、cGMP、IP3、DAG、Ca2+等；AC是催化cAMP生成的酶，不是第二信使(历年高频)。"}, {"id": "b30", "s": 0, "c": 9, "q": "cAMP-蛋白激酶A信号通路中，cAMP是由哪种酶催化生成的：", "o": ["磷脂酶C", "腺苷酸环化酶(AC)", "蛋白激酶A", "鸟苷酸环化酶"], "a": 1, "e": "GPCR→Gs→AC催化ATP→cAMP，激活PKA。"}, {"id": "b31", "s": 0, "c": 10, "q": "成熟红细胞获得能量的主要途径是：", "o": ["有氧氧化", "糖酵解和磷酸戊糖途径", "脂肪酸β-氧化", "氨基酸氧化"], "a": 1, "e": "成熟红细胞无细胞核和线粒体，仅靠糖酵解和磷酸戊糖途径供能。"}, {"id": "b32", "s": 0, "c": 10, "q": "游离(间接)胆红素与结合(直接)胆红素的区别，错误的是：", "o": ["游离胆红素脂溶性，结合胆红素水溶性", "游离胆红素与白蛋白结合运输", "结合胆红素可经尿排出", "游离胆红素可经尿排出"], "a": 3, "e": "游离胆红素与白蛋白结合，不能经尿排出；结合胆红素水溶性可尿排。"}, {"id": "b33", "s": 0, "c": 10, "q": "肝细胞中催化血红素合成的关键酶是：", "o": ["ALA合酶", "尿卟啉原脱羧酶", "亚铁螯合酶", "过氧化氢酶"], "a": 0, "e": "ALA合酶是血红素合成限速酶，受血红素反馈抑制。"}, {"id": "p1", "s": 1, "c": 0, "q": "判断组织细胞兴奋性高低的常用指标是：", "o": ["动作电位幅度", "阈值", "静息电位大小", "传导速度"], "a": 1, "e": "兴奋性高低与阈值成反比，阈值越小兴奋性越高(历年题高频)。"}, {"id": "p2", "s": 1, "c": 0, "q": "葡萄糖和氨基酸在小肠黏膜和肾小管被重吸收,主要跨膜转运方式是：", "o": ["单纯扩散", "经通道易化扩散", "继发性主动转运", "胞吞"], "a": 2, "e": "借助Na+梯度由Na+-葡萄糖/氨基酸共转运体完成，属继发性主动转运。"}, {"id": "p3", "s": 1, "c": 0, "q": "碘离子(I-)转运进入甲状腺滤泡上皮细胞的方式是：", "o": ["单纯扩散", "原发性主动转运", "继发性主动转运", "易化扩散"], "a": 2, "e": "I-逆浓度梯度靠Na+-I-同向转运(依赖Na+梯度)进入上皮，属继发性主动转运(历年高频)。"}, {"id": "p4", "s": 1, "c": 0, "q": "神经细胞兴奋后，绝对不应期内其兴奋性为：", "o": ["高于正常", "低于正常", "零(对任何刺激无反应)", "无限高"], "a": 2, "e": "绝对不应期Na+通道失活，兴奋性为零，保证动作电位不融合、单方向传导(历年高频)。"}, {"id": "p5", "s": 1, "c": 0, "q": "兴奋-收缩耦联的关键因子是：", "o": ["Na+", "K+", "Ca2+", "Cl-"], "a": 2, "e": "骨骼肌兴奋-收缩耦联靠Ca2+，由肌浆网释放， trigger 肌丝滑行。"}, {"id": "p6", "s": 1, "c": 0, "q": "神经-骨骼肌接头处，终板电位(EPSP)最先发生的部位是：", "o": ["突触前膜", "突触后膜(终板膜)", "肌纤维中段", "轴突末梢"], "a": 1, "e": "ACh释放与终板膜N2受体结合产生终板电位(属局部兴奋)，最先在突触后膜(历年高频)。"}, {"id": "p7", "s": 1, "c": 1, "q": "血浆中参与生理止血的主要细胞成分是：", "o": ["红细胞", "白细胞", "血小板", "单核细胞"], "a": 2, "e": "血小板参与初期止血(黏附、聚集、释放)；红细胞主要携氧。"}, {"id": "p8", "s": 1, "c": 1, "q": "输血时最应首先考虑的是：", "o": ["献血者年龄", "ABO血型相合与交叉配血", "血液采集时间", "血液温度"], "a": 1, "e": "输血原则是同型输血、交叉配血主侧不凝；ABO/Rh均需相合。"}, {"id": "p9", "s": 1, "c": 2, "q": "属于心脏快反应自律细胞的是：", "o": ["窦房结P细胞", "房室结细胞", "浦肯野细胞", "心房肌细胞"], "a": 2, "e": "浦肯野细胞是快反应自律细胞(0期Na+内流、4期自动去极)；窦房结/房室结为慢反应(历年高频)。工作肌(心房心室肌)非自律。"}, {"id": "p10", "s": 1, "c": 2, "q": "关于动脉血压的叙述，正确的是：", "o": ["收缩压主要取决于外周阻力", "舒张压主要取决于每搏输出量", "主动脉和大动脉弹性贮器作用缓冲血压波动", "心输出量减少时舒张压下降更明显"], "a": 2, "e": "大动脉弹性缓冲收缩压、维持舒张压；收缩压主要取决于每搏量，舒张压主要取决于外周阻力。"}, {"id": "p11", "s": 1, "c": 2, "q": "颈动脉窦和主动脉弓压力感受器最敏感的动脉血压水平约为：", "o": ["50mmHg", "100mmHg", "150mmHg", "200mmHg"], "a": 1, "e": "压力感受器在正常的动脉血压(约100mmHg)附近最敏感，通过减压反射维持血压稳定(历年高频)。"}, {"id": "p12", "s": 1, "c": 2, "q": "心力衰竭患者出现下肢水肿的主要机制是：", "o": ["血浆胶体渗透压升高", "毛细血管静水压升高", "淋巴回流增强", "血浆蛋白合成增加"], "a": 1, "e": "心衰→体循环淤血→毛细血管静水压升高→组织液生成>回流→下肢水肿(历年高频)。"}, {"id": "p13", "s": 1, "c": 3, "q": "肺通气的原动力来自：", "o": ["肺内压与大气压之差", "呼吸肌的收缩和舒张", "胸膜腔负压", "气体分压差"], "a": 1, "e": "原动力=呼吸肌舒缩；直接动力=肺内压与大气压差(历年高频)。"}, {"id": "p14", "s": 1, "c": 3, "q": "肺泡通气量的计算公式是：", "o": ["潮气量×呼吸频率", "(潮气量-无效腔气量)×呼吸频率", "肺活量×频率", "功能残气量×频率"], "a": 1, "e": "肺泡通气量=(潮气量-解剖无效腔)×呼吸频率，深慢呼吸效率更高(历年考计算)。"}, {"id": "p15", "s": 1, "c": 3, "q": "血液中CO2最主要的运输形式是：", "o": ["物理溶解", "碳酸氢盐(HCO3-)", "氨基甲酸血红蛋白", "与血浆蛋白结合"], "a": 1, "e": "CO2约70%以HCO3-形式运输，其次氨基甲酸Hb和溶解。"}, {"id": "p16", "s": 1, "c": 4, "q": "胃酸的作用不包括：", "o": ["激活胃蛋白酶原", "杀灭食物中的细菌", "促进铁、钙吸收", "促进维生素B12吸收"], "a": 3, "e": "胃酸促进铁钙吸收、杀菌、激活胃蛋白酶原、促胰液胆汁分泌；Vit B12吸收依赖胃壁细胞分泌的内因子，而非胃酸(历年高频)。"}, {"id": "p17", "s": 1, "c": 4, "q": "机体最主要的供能方式是：", "o": ["糖酵解", "底物水平磷酸化", "氧化磷酸化", "脂肪酸β-氧化"], "a": 2, "e": "氧化磷酸化是体内绝大多数ATP来源，最主要供能方式。"}, {"id": "p18", "s": 1, "c": 5, "q": "肾小球滤过的动力是：", "o": ["肾小囊内压", "有效滤过压(毛细血管压-胶渗压-囊内压)", "肾小管重吸收压", "肾血浆流量"], "a": 1, "e": "有效滤过压=肾小球毛细血管压-(血浆胶体渗透压+囊内压)。"}, {"id": "p19", "s": 1, "c": 5, "q": "近端小管重吸收的特点是：", "o": ["重吸收物质种类少", "等渗性重吸收，重吸收量大(约65-70%)", "主要重吸收水而不重吸收Na+", "不受激素调节"], "a": 1, "e": "近端小管等渗重吸收，重吸收约65-70%Na+和水及几乎全部糖/氨基酸(历年高频)。"}, {"id": "p20", "s": 1, "c": 5, "q": "肾糖阈是指：", "o": ["尿中开始出现葡萄糖时的血糖浓度(约180mg/dl)", "肾小管最大重吸收能力", "血浆葡萄糖浓度", "肾小球滤过葡萄糖的量"], "a": 0, "e": "肾糖阈≈180mg/dl，超过则尿中出现葡萄糖。"}, {"id": "p21", "s": 1, "c": 6, "q": "耳蜗基底膜不同部位对不同频率声波的敏感性规律是：", "o": ["顶部感受高频，底部感受低频", "底部感受高频，顶部感受低频", "全段均感受中频", "与频率无关"], "a": 1, "e": "基底膜底部窄硬感高频，顶部宽软感低频(历年高频)。"}, {"id": "p22", "s": 1, "c": 6, "q": "耳蜗顶部受损会影响的听力是：", "o": ["高频听力", "中频听力", "低频听力", "全频听力"], "a": 2, "e": "顶部感受低频，顶部受损→低频听力下降(历年题直接考)。"}, {"id": "p23", "s": 1, "c": 6, "q": "耳蜗底部受损会影响的听力是：", "o": ["高频听力", "中频听力", "低频听力", "仅影响音色"], "a": 0, "e": "底部感受高频，底部受损→高频听力下降(历年题直接考)。"}, {"id": "p24", "s": 1, "c": 7, "q": "维持人体正常姿势(如站立)最基本的反射是：", "o": ["腱反射", "肌紧张", "屈肌反射", "对侧伸肌反射"], "a": 1, "e": "肌紧张是缓慢持续的牵张反射，维持姿势(历年高频)。"}, {"id": "p25", "s": 1, "c": 7, "q": "牵涉痛是指：", "o": ["体表痛放射到内脏", "内脏疾病引起体表某部位疼痛", "中枢痛觉过敏", "幻肢痛"], "a": 1, "e": "牵涉痛为内脏病变引起体表特定区域疼痛(如心肌缺血→左臂内侧痛)。"}, {"id": "p26", "s": 1, "c": 8, "q": "糖皮质激素对物质代谢和应激的作用，正确的是：", "o": ["抑制蛋白质分解", "降低血糖", "抗炎、抗过敏、抗休克，首选用于重度感染性休克", "促进免疫增强"], "a": 2, "e": "糖皮质激素升血糖、促蛋白分解、抗炎抗过敏抗休克，首选重度感染性休克(历年高频)。"}, {"id": "p27", "s": 1, "c": 8, "q": "甲状腺激素合成过程中，碘的摄取进入滤泡上皮的方式是：", "o": ["单纯扩散", "继发性主动转运", "易化扩散", "胞吞"], "a": 1, "e": "同p3，I-经Na+-I-同向转运逆浓度进入上皮，继发性主动转运。"}, {"id": "pa1", "s": 2, "c": 0, "q": "细胞水肿和脂肪变属于：", "o": ["适应性改变", "可逆性损伤(变性)", "不可逆性损伤(坏死)", "凋亡"], "a": 1, "e": "细胞水肿、脂肪变、玻璃样变、淀粉样变均为可逆性损伤(变性)。"}, {"id": "pa2", "s": 2, "c": 0, "q": "下列不属于永久性细胞(不能再生的)是：", "o": ["神经细胞", "心肌细胞", "骨骼肌细胞(部分再生弱但非永久)", "表皮细胞"], "a": 3, "e": "永久细胞=神经、心肌、骨骼肌(题干若指'不能再生'，表皮为不稳定细胞可再生；本题取表皮非永久细胞)。"}, {"id": "pa3", "s": 2, "c": 0, "q": "肉芽组织的成分不包括：", "o": ["新生毛细血管", "成纤维细胞", "炎细胞", "正常的骨骼肌纤维"], "a": 3, "e": "肉芽组织=新生毛细血管+成纤维细胞+炎细胞；不含正常骨骼肌纤维。"}, {"id": "pa4", "s": 2, "c": 0, "q": "一期愈合与二期愈合的主要区别在于：", "o": ["都需抗感染", "一期创缘整齐、无感染、瘢痕少；二期创口大、感染、瘢痕多", "一期无成纤维细胞", "二期愈合更快"], "a": 1, "e": "一期愈合(手术切口)创缘齐、无感染、瘢痕少；二期(感染/大伤口)瘢痕多。"}, {"id": "pa5", "s": 2, "c": 1, "q": "贫血性梗死最常发生于：", "o": ["肺", "肠", "心、肾、脾", "肝"], "a": 2, "e": "组织结构致密、侧支少、由动脉供血的器官(心、肾、脾、脑)发生贫血性梗死(灰白)；肺肠为出血性梗死。"}, {"id": "pa6", "s": 2, "c": 1, "q": "透明血栓最常见于：", "o": ["大动脉", "微循环(毛细血管)", "心瓣膜", "静脉"], "a": 1, "e": "透明血栓(纤维素性血栓)见于DIC时微循环。"}, {"id": "pa7", "s": 2, "c": 2, "q": "大叶性肺炎的炎症类型是：", "o": ["浆液性炎", "纤维素性炎", "化脓性炎", "出血性炎"], "a": 1, "e": "大叶性肺炎=纤维素性炎(肺炎链球菌，铁锈色痰，四期变化)(历年高频)。"}, {"id": "pa8", "s": 2, "c": 2, "q": "慢性炎症中形成的、由巨噬细胞及其衍生细胞构成的结节性病变称为：", "o": ["脓肿", "肉芽肿性炎", "假膜性炎", "蜂窝织炎"], "a": 1, "e": "慢性炎症特征性病变是肉芽肿(如结核结节、风湿小体)(历年考慢性炎症特征)。"}, {"id": "pa9", "s": 2, "c": 3, "q": "良性肿瘤与恶性肿瘤的根本区别在于：", "o": ["肿瘤大小", "有无包膜", "是否发生浸润和转移", "生长速度"], "a": 2, "e": "良恶性的根本区别是有无浸润和转移(异型性为形态依据)。"}, {"id": "pa10", "s": 2, "c": 3, "q": "原位癌是指：", "o": ["突破基底膜的早期癌", "局限于上皮内、未突破基底膜的癌", "已经发生转移的癌", "化生上皮"], "a": 1, "e": "原位癌局限于上皮层内、未突破基底膜，属早期癌前病变/早期癌。"}, {"id": "pa11", "s": 2, "c": 3, "q": "癌与肉瘤的主要区别是：", "o": ["都来源于上皮", "癌源于上皮、淋巴转移为主；肉瘤源于间叶、血行转移为主", "肉瘤源于上皮", "二者转移方式相同"], "a": 1, "e": "癌(上皮来源，淋巴转移多)与肉瘤(间叶来源，血行转移多)来源和转移途径不同。"}, {"id": "pa12", "s": 2, "c": 3, "q": "关于葡萄胎、侵袭性葡萄胎和绒毛膜癌，正确的是：", "o": ["三者都无绒毛结构", "葡萄胎有绒毛水肿、无肌层浸润；侵袭性葡萄胎有绒毛并侵入肌层；绒癌无绒毛", "葡萄胎一定恶变", "绒癌必有绒毛结构"], "a": 1, "e": "葡萄胎=绒毛水肿无浸润；侵袭性葡萄胎=绒毛侵入肌层/血管；绒癌=无绒毛、出血坏死、滋养层细胞增生(历年高频)。"}, {"id": "pa13", "s": 2, "c": 3, "q": "下列与雌激素水平升高无关的疾病是：", "o": ["乳腺癌", "子宫内膜癌", "子宫腺肌症", "子宫内膜增生症"], "a": 2, "e": "乳腺癌、子宫内膜癌、内膜增生均与雌激素相关；子宫腺肌症与雌激素升高无关(历年高频干扰项)。"}, {"id": "pa14", "s": 2, "c": 4, "q": "动脉粥样硬化粥样斑块中最重要的成分是：", "o": ["钙化", "脂质(胆固醇酯)和坏死物", "炎细胞", "平滑肌"], "a": 1, "e": "粥样斑块核心为脂质(胆固醇酯)及坏死物，表面纤维帽。"}, {"id": "pa15", "s": 2, "c": 4, "q": "动脉粥样硬化导致管腔狭窄程度超过多少常需临床干预(重度)：", "o": ["25%", "50%", "75%", "90%才需处理"], "a": 2, "e": "通常狭窄>75%(Ⅳ度)出现明显缺血症状，是介入/手术指征(历年考'超过75%算几度')。"}, {"id": "pa16", "s": 2, "c": 4, "q": "良性高血压肾病变表现为：", "o": ["大红肾", "原发性颗粒性固缩肾", "大白肾", "多囊肾"], "a": 1, "e": "长期高血压→肾细动脉硬化→原发性颗粒性固缩肾(历年高频：区别于肾炎所致继发性固缩肾)。"}, {"id": "pa17", "s": 2, "c": 4, "q": "风湿病的基本病变中具有诊断意义的小体是：", "o": ["结核结节", "风湿小体(Aschoff小体)", "伤寒小结", "梅毒树胶肿"], "a": 1, "e": "风湿病增生期形成Aschoff小体(风湿细胞)，为特征性病变。"}, {"id": "pa18", "s": 2, "c": 5, "q": "慢性支气管炎的典型临床表现是：", "o": ["吸气性呼吸困难", "慢性咳嗽、咳痰、喘息，常伴呼气性呼吸困难", "无咳嗽", "仅咯血"], "a": 1, "e": "慢支=咳、痰、喘每年>3月连2年，小气道阻塞→呼气性呼吸困难，可发展为肺气肿/肺心病(历年高频'错误的是'题)。"}, {"id": "pa19", "s": 2, "c": 5, "q": "关于肺癌，正确的是：", "o": ["多位于外周且多为腺癌", "中央型多为鳞状细胞癌；腺癌多位于周围；小细胞癌神经内分泌、恶性高", "肺癌均为鳞癌", "腺癌极少发生"], "a": 1, "e": "中央型多为鳞癌；腺癌现最常见且多周围型；小细胞癌具神经内分泌、预后差(历年'正确的是/错误的是'题)。"}, {"id": "pa20", "s": 2, "c": 7, "q": "急性弥漫性增生性肾小球肾炎的大体标本表现为：", "o": ["大白肾", "大红肾(蚤咬肾)", "颗粒固缩肾", "多囊肾"], "a": 1, "e": "急性链球菌感染后肾炎=大红肾/蚤咬肾，儿童多见，预后好(历年高频)。"}, {"id": "pa21", "s": 2, "c": 4, "q": "引起原发性颗粒性固缩肾的疾病是：", "o": ["慢性肾小球肾炎", "高血压", "动脉粥样硬化", "糖尿病"], "a": 1, "e": "原发性颗粒性固缩肾由良性高血压所致；慢性肾小球肾炎引起的是继发性颗粒性固缩肾(历年高频)。"}, {"id": "pa22", "s": 2, "c": 7, "q": "主要发生于肾盂肾盏和肾间质的化脓性炎症是：", "o": ["急性肾小球肾炎", "肾盂肾炎", "肾结核", "肾肿瘤"], "a": 1, "e": "肾盂肾炎是肾盂、肾间质化脓性炎症，上行感染多见。"}, {"id": "pa23", "s": 2, "c": 6, "q": "肝硬化时形成假小叶，患者蜘蛛痣的出现与下列哪项有关：", "o": ["醛固酮增多", "雌激素灭活减少", "雄激素增多", "抗利尿激素减少"], "a": 1, "e": "肝灭活雌激素减少→蜘蛛痣、肝掌(历年高频)。"}, {"id": "pa24", "s": 2, "c": 6, "q": "病毒性肝炎的基本病变不包括：", "o": ["肝细胞变性(气球样变)", "肝细胞坏死", "肝细胞增生和炎细胞浸润", "肺组织纤维化"], "a": 3, "e": "病毒性肝炎病变在肝，不涉及肺纤维化。"}, {"id": "pa25", "s": 2, "c": 9, "q": "关于原发性肺结核，正确的是：", "o": ["发生于成人，病变多样", "为初次感染，形成原发综合征(病灶+淋巴管炎+肺门淋巴结结核)，多自愈", "不会播散", "只累及肺门"], "a": 1, "e": "原发肺结核为初次感染、原发综合征、多自愈；继发性肺结核见于成人(历年高频)。"}, {"id": "pa26", "s": 2, "c": 9, "q": "伤寒的病变部位主要在：", "o": ["盲肠", "回肠末端淋巴组织", "结肠", "直肠"], "a": 1, "e": "伤寒累及回肠末端集合淋巴小结，可并发肠出血/穿孔(历年高频)。"}, {"id": "pa27", "s": 2, "c": 9, "q": "细菌性痢疾病变部位和特征性病变是：", "o": ["回肠，溃疡呈长轴", "直肠乙状结肠，假膜性炎(地图状溃疡)", "盲肠，烧瓶状溃疡", "全结肠，肉芽肿"], "a": 1, "e": "菌痢病变在直肠乙状结肠，假膜性炎、黏液脓血便。"}, {"id": "pa28", "s": 2, "c": 9, "q": "梅毒的基本病变是：", "o": ["小动脉炎和树胶肿", "大叶性肺炎", "肝硬化", "肾小球肾炎"], "a": 0, "e": "梅毒基本病变为小动脉炎+树胶肿(三期)。"}, {"id": "ph1", "s": 3, "c": 0, "q": "评价药物安全性的指标治疗指数(TI)是指：", "o": ["ED50/LD50", "LD50/ED50", "ED95/LD5", "LD5/ED95"], "a": 1, "e": "TI=LD50/ED50，越大越安全。"}, {"id": "ph2", "s": 3, "c": 0, "q": "连续用药后机体对药物反应性降低称为：", "o": ["耐药性", "耐受性", "依赖性", "高敏性"], "a": 1, "e": "耐受性=连续用药后反应性降低(机体)；耐药性=病原体/肿瘤细胞抗药。"}, {"id": "ph3", "s": 3, "c": 0, "q": "口服药物经胃肠吸收后首先通过肝脏被代谢，使进入体循环药量减少，称为：", "o": ["肝肠循环", "首过消除", "生物转化", "肾排泄"], "a": 1, "e": "首过消除使口服药部分在入体循环前被肝代谢(舌下/直肠可避免)。"}, {"id": "ph4", "s": 3, "c": 0, "q": "药物的半衰期(t1/2)是指：", "o": ["达峰时间", "血浆药物浓度下降一半所需时间", "起效时间", "作用持续时间"], "a": 1, "e": "t1/2为血药浓度下降一半的时间，决定给药间隔和达稳态时间(约4-5个t1/2达稳态)。"}, {"id": "ph5", "s": 3, "c": 1, "q": "毛果芸香碱(匹鲁卡品)滴眼后可引起：", "o": ["扩瞳、升眼压、调节麻痹", "缩瞳、降眼压、调节痉挛(近视)", "无变化", "仅降眼压不缩瞳"], "a": 1, "e": "毛果芸香碱激动M受体→缩瞳、降眼压、调节痉挛(看近清远糊)，用于青光眼(历年高频)。"}, {"id": "ph6", "s": 3, "c": 1, "q": "新斯的明的作用机制是：", "o": ["阻断M受体", "抑制胆碱酯酶", "激动N受体", "释放去甲肾上腺素"], "a": 1, "e": "新斯的明为易逆性抗胆碱酯酶药，抑制AChE→ACh↑，用于重症肌无力(历年高频)。"}, {"id": "ph7", "s": 3, "c": 1, "q": "有机磷农药(敌敌畏)中毒的机制是：", "o": ["抑制单胺氧化酶", "不可逆性抑制胆碱酯酶(磷酰化)", "阻断NM受体", "激动M受体"], "a": 1, "e": "有机磷与AChE的丝氨酸羟基共价结合(磷酰化)使其不可逆失活(历年题'敌敌畏与什么结合')。"}, {"id": "ph8", "s": 3, "c": 1, "q": "β受体阻断药(如普萘洛尔)的禁忌证不包括：", "o": ["支气管哮喘", "严重心力衰竭", "房室传导阻滞", "高血压"], "a": 3, "e": "β阻断药可用于高血压/心绞痛/心律失常；禁用于哮喘、严重心衰、传导阻滞(历年：心衰合并哮喘禁用普萘洛尔)。"}, {"id": "ph9", "s": 3, "c": 1, "q": "地西泮(苯二氮䓬类)过量中毒的特异性解救药是：", "o": ["纳洛酮", "氟马西尼", "阿托品", "新斯的明"], "a": 1, "e": "氟马西尼是苯二氮䓬受体特异性拮抗剂，用于地西泮中毒(历年：地西泮中毒用什么解救)。"}, {"id": "ph10", "s": 3, "c": 1, "q": "左旋多巴治疗帕金森病时，常合用卡比多巴的目的是：", "o": ["增强中枢多巴胺受体", "抑制外周多巴脱羧，提高疗效减少外周副作用", "阻断中枢胆碱", "促进多巴胺释放"], "a": 1, "e": "卡比多巴抑制外周L-芳香族氨基酸脱羧酶，减少外周多巴胺生成，使更多左旋多巴入脑。"}, {"id": "ph11", "s": 3, "c": 2, "q": "吗啡的禁忌证是：", "o": ["急性左心衰竭", "支气管哮喘、颅脑损伤、严重肝功不全", "慢性疼痛", "癌症晚期镇痛"], "a": 1, "e": "吗啡抑制呼吸、缩瞳、致便秘，禁用于支气管哮喘、颅脑损伤、严重肝肾功能不全、分娩哺乳等(历年高频)。"}, {"id": "ph12", "s": 3, "c": 2, "q": "阿司匹林的临床应用不包括：", "o": ["解热镇痛", "抗炎抗风湿", "小剂量抗血小板预防血栓", "促进胃酸分泌治疗溃疡"], "a": 3, "e": "阿司匹林抑制PG合成，用于解热镇痛抗炎抗栓；不良反应包括胃肠道溃疡(非促进胃酸分泌治疗)。"}, {"id": "ph13", "s": 3, "c": 3, "q": "急性哮喘发作的首选药物是：", "o": ["口服糖皮质激素", "吸入β2受体激动剂(沙丁胺醇)", "静脉用氨茶碱", "静点吗啡"], "a": 1, "e": "急性哮喘发作首选β2激动剂(沙丁胺醇)吸入，速效舒张支气管(历年高频)。"}, {"id": "ph14", "s": 3, "c": 2, "q": "强心苷(地高辛)治疗心力衰竭的主要机制是：", "o": ["阻断β受体", "抑制Na+-K+-ATP酶，增加细胞内Ca2+", "扩张动脉", "利尿"], "a": 1, "e": "地高辛抑制Na+-K+-ATPase→细胞内Na+↑→Ca2+↑→正性肌力(历年高频)。"}, {"id": "ph15", "s": 3, "c": 3, "q": "ACEI(如卡托普利)治疗心衰和高血压的作用机制是：", "o": ["阻断AT1受体", "抑制血管紧张素转化酶，使AngⅡ生成减少", "直接扩张静脉", "抑制醛固酮合成酶"], "a": 1, "e": "ACEI抑制ACE→AngⅡ↓、缓激肽↑→扩血管、逆转心室重构。"}, {"id": "ph16", "s": 3, "c": 3, "q": "肝素抗凝的作用机制是：", "o": ["抑制维生素K环氧还原酶", "增强抗凝血酶Ⅲ(ATⅢ)活性", "直接灭活凝血酶", "促进纤维蛋白溶解"], "a": 1, "e": "肝素与ATⅢ结合增强其活性，加速灭活凝血酶和Ⅹa等(历年高频)。"}, {"id": "ph17", "s": 3, "c": 3, "q": "氯吡格雷的抗血小板作用机制是：", "o": ["不可逆抑制COX-1", "抑制ADP(P2Y12)受体", "激活纤溶酶原", "增强ATⅢ"], "a": 1, "e": "氯吡格雷阻断血小板ADP受体P2Y12，抑制血小板活化聚集(历年高频)。"}, {"id": "ph18", "s": 3, "c": 3, "q": "呋塞米(呋喃苯胺酸)利尿的作用部位是：", "o": ["近曲小管", "髓袢升支粗段(抑制Na+-K+-2Cl-共转运)", "远曲小管", "集合管"], "a": 1, "e": "袢利尿剂作用于髓袢升支粗段Na+-K+-2Cl-共转运体，强效利尿(历年考利尿药作用位点)。"}, {"id": "ph19", "s": 3, "c": 3, "q": "糖皮质激素作为首选用于治疗：", "o": ["轻度过敏性鼻炎", "重度感染性休克", "普通感冒", "轻度高血压"], "a": 1, "e": "糖皮质激素抗炎、抗休克，首选用于重度感染性休克(历年高频)。"}, {"id": "ph20", "s": 3, "c": 3, "q": "奥美拉唑的抑酸作用机制是：", "o": ["阻断H2受体", "抑制H+-K+-ATP酶(质子泵)", "中和胃酸", "抑制胃泌素"], "a": 1, "e": "PPI抑制胃壁细胞H+-K+-ATPase，强效抑酸，用于溃疡/GERD。"}, {"id": "ph21", "s": 3, "c": 4, "q": "青霉素G最严重的不良反应是：", "o": ["胃肠道反应", "过敏性休克", "肾毒性", "耳毒性"], "a": 1, "e": "青霉素G最危险为过敏性休克，须皮试，抢救用肾上腺素(历年高频)。"}, {"id": "ph22", "s": 3, "c": 4, "q": "治疗金黄色葡萄球菌引起的骨髓炎，首选：", "o": ["青霉素G", "克林霉素", "红霉素", "四环素"], "a": 1, "e": "金葡骨髓炎首选克林霉素(骨组织浓度高；历年2023题直接考)。"}, {"id": "ph23", "s": 3, "c": 4, "q": "氨基苷类抗生素(庆大霉素等)的主要不良反应是：", "o": ["肝毒性", "耳毒性和肾毒性", "骨髓抑制", "心脏毒性"], "a": 1, "e": "氨基苷类有耳毒性(前庭+听神经)和肾毒性，孕妇/肾病慎用(历年：氨基苷类不良反应)。"}, {"id": "ph24", "s": 3, "c": 4, "q": "下列对铜绿假单胞菌无效的药物是：", "o": ["庆大霉素", "妥布霉素", "阿米卡星", "链霉素"], "a": 3, "e": "庆大/妥布/阿米卡星对铜绿假单胞菌有效；链霉素主要对结核、鼠疫等，对铜绿无效(历年'无效'题)。"}, {"id": "ph25", "s": 3, "c": 4, "q": "治疗伤寒的首选药物是：", "o": ["青霉素", "第三代喹诺酮类(氟喹诺酮)", "红霉素", "万古霉素"], "a": 1, "e": "伤寒(伤寒杆菌)治疗首选氟喹诺酮类(也可氯霉素)，历年高频。"}, {"id": "ph26", "s": 3, "c": 4, "q": "能用于治疗厌氧菌感染的药物是：", "o": ["甲硝唑", "青霉素G", "庆大霉素", "阿奇霉素"], "a": 0, "e": "甲硝唑(灭滴灵)对厌氧菌(脆弱类杆菌等)高效(历年高频)。"}, {"id": "ph27", "s": 3, "c": 4, "q": "对结核分枝杆菌无效的药物是：", "o": ["异烟肼", "利福平", "乙胺丁醇", "普通青霉素G"], "a": 3, "e": "普通青霉素对结核无效(结核杆菌细胞壁特殊，需专用药如INH/利福平)；历年'对结核无效的药'题。"}, {"id": "ph28", "s": 3, "c": 4, "q": "抗恶性肿瘤药中，破坏DNA结构与功能的代表药是：", "o": ["甲氨蝶呤", "顺铂", "5-氟尿嘧啶", "巯嘌呤"], "a": 1, "e": "顺铂与DNA交联破坏其结构与功能；甲氨蝶呤/5-FU/巯嘌呤干扰核酸合成。"}, {"id": "a1", "s": 4, "c": 0, "q": "膈的三个裂孔中，通过食管和迷走神经的是：", "o": ["主动脉裂孔(T12)", "食管裂孔(T10)", "腔静脉孔(T8)", "无此裂孔"], "a": 1, "e": "食管裂孔平T10，通过食管和迷走神经；主动脉裂孔T12、腔静脉孔T8(历年高频)。"}, {"id": "a2", "s": 4, "c": 0, "q": "脑颅骨的数量是：", "o": ["6块", "8块", "15块", "23块"], "a": 1, "e": "脑颅骨8块：额、枕、蝶、筛各1，顶、颞各2。"}, {"id": "a3", "s": 4, "c": 1, "q": "食管的三个生理性狭窄，最窄且异物最易滞留的是：", "o": ["第1狭窄(咽与食管起始)", "第2狭窄(与左主支气管交叉)", "第3狭窄(穿膈食管裂孔)", "无明显差异"], "a": 0, "e": "食管三狭窄均好发异物/肿瘤，第1狭窄(起始处)最窄。临床上三处均重要。"}, {"id": "a4", "s": 4, "c": 1, "q": "上颌窦开口于：", "o": ["上鼻道", "中鼻道", "下鼻道", "蝶筛隐窝"], "a": 1, "e": "额窦、上颌窦、前中筛窦开口于中鼻道；后筛窦→上鼻道；蝶窦→蝶筛隐窝(历年高频)。"}, {"id": "a5", "s": 4, "c": 1, "q": "左右主支气管的形态差异是：", "o": ["左主支气管粗短陡直", "右主支气管粗短陡直，故异物易坠入右", "两侧完全相同", "右主支气管细长"], "a": 1, "e": "右主支气管粗短走行陡直，异物易进入右侧(历年高频)。"}, {"id": "a6", "s": 4, "c": 1, "q": "男性尿道的三个狭窄由后向前依次为：", "o": ["尿道内口、膜部、外口(外口最窄)", "前列腺部、膜部、海绵体部", "外口、膜部、内口", "无狭窄"], "a": 0, "e": "男性尿道三狭窄：尿道内口、膜部、尿道外口(外口最窄)。"}, {"id": "a7", "s": 4, "c": 2, "q": "肝门静脉的属支不包括：", "o": ["肠系膜上静脉", "脾静脉", "胃左静脉", "下腔静脉"], "a": 3, "e": "肝门静脉由肠系膜上静脉+脾静脉汇合，属支含肠系膜下静脉、胃左静脉、附脐静脉等；下腔静脉是回流静脉不是属支。"}, {"id": "a8", "s": 4, "c": 2, "q": "鼓室的六个壁中，与鼻咽部相通、小儿中耳炎好发相关的是：", "o": ["上壁(盖壁)", "前壁(颈动脉壁，通咽鼓管)", "内侧壁(迷路壁)", "后壁(乳突壁)"], "a": 1, "e": "鼓室前壁通咽鼓管至鼻咽，小儿咽鼓管短平宽易致中耳炎(历年高频)。"}, {"id": "a9", "s": 4, "c": 2, "q": "听觉感受器和位置觉感受器分别位于：", "o": ["前庭和半规管", "蜗管的螺旋器和前庭/半规管", "鼓膜和听骨链", "耳蜗和咽鼓管"], "a": 1, "e": "听觉=耳蜗螺旋器(Corti器)；位置觉=前庭(椭圆囊斑/球囊斑)与半规管(壶腹嵴)。"}, {"id": "a10", "s": 4, "c": 3, "q": "内囊完全受损可出现：", "o": ["三偏综合征(对侧偏瘫、偏身感觉障碍、偏盲)", "同侧偏瘫", "仅有面瘫", "失语但无运动障碍"], "a": 0, "e": "内囊聚集上下行纤维，受损出现对侧'三偏'(偏瘫、偏身感觉障碍、偏盲)。"}, {"id": "a11", "s": 4, "c": 3, "q": "躯干、四肢意识性本体觉和精细触觉传导通路的第1级神经元位于：", "o": ["脊髓后角", "脊神经节", "薄束核/楔束核", "丘脑"], "a": 1, "e": "第1级神经元在脊神经节，经薄束/楔束→薄/楔束核(第2级)→内侧丘系交叉→丘脑→皮质。"}, {"id": "a12", "s": 4, "c": 3, "q": "脑的动脉主要来源于：", "o": ["颈内动脉和椎-基底动脉", "颈外动脉和锁骨下动脉", "面动脉和舌动脉", "只有椎动脉"], "a": 0, "e": "脑动脉来自颈内动脉和椎-基底动脉，二者在脑底形成Willis环。"}, {"id": "m1", "s": 5, "c": 0, "q": "按细胞结构特点，微生物分为三大类，正确的是：", "o": ["病毒、细菌、真菌均为原核细胞型", "非细胞型(病毒)、原核细胞型、真核细胞型(真菌)", "所有微生物都有细胞壁", "真菌属原核细胞型"], "a": 1, "e": "三大类：非细胞型(病毒)、原核细胞型(细菌/支原体/衣原体/立克次体/螺旋体/放线菌)、真核细胞型(真菌)。"}, {"id": "m2", "s": 5, "c": 0, "q": "G+菌与G-菌细胞壁的主要区别是：", "o": ["G+无肽聚糖", "G+肽聚糖厚且含磷壁酸，G-肽聚糖薄且有外膜(LPS)", "G-有磷壁酸", "二者完全相同"], "a": 1, "e": "G+壁厚、肽聚糖多、有磷壁酸、无外膜；G-壁薄、有外膜含LPS、无磷壁酸。"}, {"id": "m3", "s": 5, "c": 0, "q": "细菌的特殊结构中，与抗吞噬作用密切相关的是：", "o": ["鞭毛", "荚膜", "菌毛", "芽胞"], "a": 1, "e": "荚膜抗吞噬、与致病力相关(如肺炎链球菌)；芽胞与耐热/传播相关。"}, {"id": "m4", "s": 5, "c": 0, "q": "外科手术器械灭菌以杀灭什么为合格标准：", "o": ["繁殖体", "芽胞", "病毒", "真菌孢子"], "a": 1, "e": "灭菌须杀灭包括芽胞在内的所有微生物，芽胞抵抗力最强。"}, {"id": "m5", "s": 5, "c": 0, "q": "观察和研究细菌形态、染色及药物敏感试验最好选择生长曲线的哪一期：", "o": ["迟缓期", "对数生长期", "稳定期", "衰亡期"], "a": 1, "e": "对数期细菌生长最快、形态典型、代谢旺盛，最适观察/药敏(历年高频)。"}, {"id": "m6", "s": 5, "c": 1, "q": "长期使用广谱抗生素导致的新感染，称为：", "o": ["机会性感染", "菌群失调症(二重感染)", "外源性感染", "医院内感染"], "a": 1, "e": "广谱抗生素抑制正常菌群，耐药菌(念珠菌/艰难梭菌)过度繁殖→二重感染(历年高频)。"}, {"id": "m7", "s": 5, "c": 1, "q": "外毒素与内毒素的主要区别，正确的是：", "o": ["外毒素是G-细胞壁LPS", "内毒素是蛋白质、毒性强、有特异性", "外毒素是蛋白质、毒性强、可制成类毒素；内毒素是G-的LPS、耐热无特异性", "二者完全相同"], "a": 2, "e": "外毒素=蛋白质、强毒性、有特异性、可成类毒素；内毒素=G-细胞壁LPS、耐热、致热休克DIC(历年高频)。"}, {"id": "m8", "s": 5, "c": 1, "q": "卡介苗(BCG)属于：", "o": ["灭活疫苗", "减毒活疫苗", "类毒素", "亚单位疫苗"], "a": 1, "e": "卡介苗是减毒活疫苗(牛型结核杆菌减毒)，用于预防结核(历年高频)。"}, {"id": "m9", "s": 5, "c": 2, "q": "金黄色葡萄球菌的致病物质与所致疾病，错误的是：", "o": ["血浆凝固酶阳性", "产生肠毒素可致食物中毒", "对青霉素天然高度敏感", "可引起疖、痈、败血症"], "a": 2, "e": "金葡菌产青霉素酶，对青霉素多耐药；可用耐酶青霉素/万古霉素(历年考'金黄色葡萄球菌骨髓炎首选克林霉素')。"}, {"id": "m10", "s": 5, "c": 2, "q": "引起大叶性肺炎最常见的病原菌是：", "o": ["金黄色葡萄球菌", "肺炎链球菌(肺炎球菌)", "肺炎支原体", "结核分枝杆菌"], "a": 1, "e": "大叶性肺炎90%以上由肺炎链球菌(荚膜致病)引起，纤维素性炎。"}, {"id": "m11", "s": 5, "c": 2, "q": "伤寒的病原菌和病变部位是：", "o": ["痢疾杆菌，结肠", "伤寒沙门菌，回肠末端淋巴组织", "霍乱弧菌，小肠", "结核杆菌，肺"], "a": 1, "e": "伤寒=伤寒沙门菌，侵犯回肠末端集合淋巴小结(历年高频)。"}, {"id": "m12", "s": 5, "c": 2, "q": "霍乱弧菌的主要致病物质是：", "o": ["荚膜", "霍乱肠毒素(CT)", "内毒素", "血浆凝固酶"], "a": 1, "e": "霍乱肠毒素激活腺苷酸环化酶→cAMP↑→大量水样泻(米泔水样)。"}, {"id": "m13", "s": 5, "c": 2, "q": "幽门螺杆菌与哪种疾病密切相关：", "o": ["与慢性胃炎和胃癌相关", "仅引起皮肤感染", "与艾滋病相关", "与流感相关"], "a": 0, "e": "幽门螺杆菌与慢性胃炎、消化性溃疡、胃癌相关(历年高频)。"}, {"id": "m14", "s": 5, "c": 2, "q": "破伤风梭菌致病的主要毒素和典型表现是：", "o": ["肠毒素致腹泻", "痉挛毒素致肌肉强直性痉挛(苦笑面容、角弓反张)", "α毒素致气性坏疽", "肉毒毒素致弛缓性麻痹"], "a": 1, "e": "破伤风痉挛毒素阻断抑制性神经递质→骨骼肌强直性痉挛；预防用类毒素/抗毒素。"}, {"id": "m15", "s": 5, "c": 2, "q": "结核分枝杆菌的染色特点和预防措施是：", "o": ["革兰阳性，接种死疫苗", "抗酸染色阳性，接种卡介苗(减毒活疫苗)", "革兰阴性，无需预防", "不染色"], "a": 1, "e": "结核杆菌抗酸染色阳性；预防用卡介苗(减毒活疫苗)；结核菌素试验测感染。"}, {"id": "m16", "s": 5, "c": 3, "q": "肺炎支原体引起非典型肺炎，其诊断相关试验是：", "o": ["肥达试验", "冷凝集试验", "抗酸染色", "墨汁染色"], "a": 1, "e": "肺炎支原体感染可出现冷凝集试验阳性。"}, {"id": "m17", "s": 5, "c": 3, "q": "梅毒螺旋体的传播方式和首选治疗是：", "o": ["呼吸道传播，青霉素", "性传播，青霉素", "消化道传播，红霉素", "虫媒传播，多西环素"], "a": 1, "e": "梅毒经性传播/垂直传播，首选青霉素(镀银染色可见)。"}, {"id": "m18", "s": 5, "c": 3, "q": "病毒的基本特点，正确的是：", "o": ["有细胞结构", "只含一种核酸(DNA或RNA)", "同时进行DNA和RNA复制", "对干扰素不敏感"], "a": 1, "e": "病毒非细胞型、只含一种核酸、必须寄生于活细胞、对干扰素敏感。"}, {"id": "m19", "s": 5, "c": 4, "q": "甲型流感病毒容易引起大流行的原因是：", "o": ["抗原稳定不变", "表面抗原(HA/NA)发生抗原转换(大变异)", "无包膜", "只感染动物"], "a": 1, "e": "流感抗原漂移(小变)致年流行，抗原转换(大变)致大流行。"}, {"id": "m20", "s": 5, "c": 4, "q": "乙型肝炎病毒(HBV)的抗原中，作为感染标志且具有免疫原性、可诱导保护性抗体的是：", "o": ["HBeAg", "HBcAg", "HBsAg", "HBxAg"], "a": 2, "e": "HBsAg是感染标志；抗-HBs为保护性抗体(疫苗诱导)；HBeAg提示复制活跃传染强。"}, {"id": "m21", "s": 5, "c": 4, "q": "与原发性肝癌密切相关的病毒是：", "o": ["HAV", "HBV和HCV", "EBV(仅鼻咽癌)", "RV(风疹)"], "a": 1, "e": "HBV、HCV慢性感染与原发性肝癌密切相关；EBV与鼻咽癌/Burkitt淋巴瘤相关。"}, {"id": "m22", "s": 5, "c": 5, "q": "HIV病毒包膜上负责结合CD4分子的中和抗原是：", "o": ["gp41", "gp120", "p24", "pol蛋白"], "a": 1, "e": "gp120结合CD4(中和抗体靶标)，gp41介导膜融合(历年高频)。"}, {"id": "m23", "s": 5, "c": 5, "q": "人乳头瘤病毒(HPV)与哪种疾病最相关：", "o": ["宫颈癌", "流感", "甲型肝炎", "结核病"], "a": 0, "e": "高危型HPV(16/18)与宫颈癌密切相关，有疫苗预防。"}, {"id": "i1", "s": 6, "c": 0, "q": "抗原的两个基本特性是：", "o": ["大分子量和脂溶性", "免疫原性和抗原性(反应原性)", "只引起细胞免疫", "只引起体液免疫"], "a": 1, "e": "抗原须具备免疫原性(诱发免疫应答)和抗原性(与抗体/ TCR 特异性结合)。"}, {"id": "i2", "s": 6, "c": 0, "q": "胸腺依赖性抗原(TD-Ag)与胸腺非依赖性抗原(TI-Ag)的区别是：", "o": ["TD-Ag不需T细胞辅助，TI-Ag需要", "TD-Ag需Th辅助，引起体液+细胞免疫；TI-Ag不需Th，只引起体液免疫", "二者都只引起细胞免疫", "二者均无免疫原性"], "a": 1, "e": "TD-Ag(多为蛋白)需Th辅助；TI-Ag(多糖/LPS)不需Th，只引起体液免疫。"}, {"id": "i3", "s": 6, "c": 1, "q": "免疫球蛋白的基本结构单位是：", "o": ["一条重链", "两条重链和两条轻链(2H2L)", "四条重链", "仅轻链"], "a": 1, "e": "Ig基本单位=2重链+2轻链，借二硫键连接；可变区结合抗原，恒定区介导效应。"}, {"id": "i4", "s": 6, "c": 1, "q": "关于五类免疫球蛋白，错误的是：", "o": ["IgM是最早产生、分子量最大", "IgG含量最多、可过胎盘", "IgE参与I型超敏和抗寄生虫", "IgD是血清中含量最多的免疫球蛋白"], "a": 3, "e": "IgD主要作为B细胞表面受体，血清中含量极少；含量最多的是IgG，故'IgD含量最多'错误。"}, {"id": "i5", "s": 6, "c": 1, "q": "木瓜蛋白酶水解IgG得到：", "o": ["F(ab')2和pFc'", "2个Fab和1个Fc", "单条重链", "仅Fc"], "a": 1, "e": "木瓜蛋白酶切IgG得2 Fab(抗原结合)+1 Fc(效应)；胃蛋白酶得F(ab')2。"}, {"id": "i6", "s": 6, "c": 1, "q": "补体三条激活途径的共同末端效应是形成：", "o": ["C3转化酶", "C5转化酶", "膜攻击复合物(MAC，C5b-9)", "C1q"], "a": 2, "e": "三条途径最终汇聚于C5b-9(MAC)导致靶细胞溶解；经典途径由Ag-Ab启动，旁路/凝集素由微生物表面启动。"}, {"id": "i7", "s": 6, "c": 1, "q": "下列物质中，属于细胞因子而非粘附分子的是：", "o": ["整合素", "选择素", "白细胞介素(IL)", "钙粘蛋白"], "a": 2, "e": "细胞因子(IL、IFN、TNF等)与粘附分子(整合素、选择素等)是两类不同分子(历年'区分细胞因子和粘附分子'题)。"}, {"id": "i8", "s": 6, "c": 2, "q": "MHC限制性是指：", "o": ["MHC只表达于免疫细胞", "T细胞识别抗原肽时必须同时识别自身MHC分子", "MHC与抗体结合", "MHC限制仅存在于B细胞"], "a": 1, "e": "TCR识别pMHC，T细胞须同时识别抗原肽和自身MHC(CTL杀伤、Th辅助均受限制)(历年高频)。"}, {"id": "i9", "s": 6, "c": 2, "q": "HLAⅠ类分子表达于几乎所有有核细胞，主要提呈抗原给：", "o": ["CD4+ T细胞", "CD8+ T细胞", "B细胞", "NK细胞"], "a": 1, "e": "MHCⅠ提呈内源性抗原给CD8+CTL；MHCⅡ提呈外源性抗原给CD4+Th。"}, /* ---------- 倒计时 ---------- */
(function(){
  const exam = new Date("2026-07-10T08:30:00+08:00").getTime();
  function tick(){
    const now = Date.now();
    let d = exam - now;
    if(d<0){document.getElementById('cd').textContent="已开始/结束";return;}
    const day=Math.floor(d/86400000); d-=day*86400000;
    const h=Math.floor(d/3600000); d-=h*3600000;
    const m=Math.floor(d/60000); d-=m*60000;
    const s=Math.floor(d/1000);
    document.getElementById('cd').textContent=`${day}天 ${h}时 ${m}分 ${s}秒`;
  }
  tick(); setInterval(tick,1000);
})();

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ---------- 导航 ---------- */
function buildNav(){
  let html='<div class="nsec">复习</div>';
  REVIEW.forEach((s,si)=>{
    html+=`<a class="subj" data-view="review" data-s="${si}">${s.subject} <span class="small">(${s.score}分)</span></a>`;
    s.chapters.forEach((c,ci)=>{
      html+=`<a class="ch" data-view="review" data-s="${si}" data-c="${ci}">${c.name.split("、").slice(1).join("、")||c.name}</a>`;
    });
  });
  html+='<div class="nsec">刷题</div>';
  html+=`<a data-view="menu">🏠 刷题主页</a>`;
  html+=`<a data-view="exam" data-mode="full">📝 模拟考试(100单选)</a>`;
  html+=`<a data-view="chapter">📚 章节练习</a>`;
  html+=`<a data-view="wrong">❌ 错题本(${WRONG.length})</a>`;
  nav.innerHTML=html;
  nav.querySelectorAll('a').forEach(a=>a.onclick=()=>{
    nav.querySelectorAll('a').forEach(x=>x.classList.remove('active'));
    a.classList.add('active');
    const v=a.dataset.view;
    if(v==='review')renderReview(+a.dataset.s,+ (a.dataset.c!==undefined?a.dataset.c:-1));
    else if(v==='menu')renderMenu();
    else if(v==='exam')startExam('full');
    else if(v==='chapter')renderChapterPick();
    else if(v==='wrong')renderWrong();
  });
}

function renderReview(si, ci){
  leaveQuiz();
  const s=REVIEW[si];
  let html=`<div class="card"><h2>${s.subject}</h2>
    <div class="lead">大纲权重：${s.score}分 · 建议复习时长 ${s.hours} · 历年高频已用 ⭐ 标注</div>
    <input class="search" id="rsearch" placeholder="🔍 在本科目内搜索知识点（如：酮体、毛果芸香碱、肉芽组织）">`;
  s.chapters.forEach((c,idx)=>{
    if(ci>=0 && idx!=ci) return;
    html+=`<div class="chapter" id="ch${idx}"><h3>${c.name}</h3>${c.html}</div>`;
  });
  html+=`</div><div class="foot">本页内容依据山大《基础医学综合考试》大纲逐条整理，结合 2023-2025 历年题高频点。无课本也可独立复习。</div>`;
