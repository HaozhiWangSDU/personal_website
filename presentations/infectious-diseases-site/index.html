<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>传染病学期末复习智能指南</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Theme 1: 明亮医疗 (Default Light) */
      --bg-primary: #f0f4f8; /* Soft clinical grey-blue */
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f8fafc;
      --border-color: #dbeafe; /* Soft blue border */
      --border-color-hover: #3b82f6; /* Bright medical blue border */
      --text-primary: #1e293b; /* Slate 800 */
      --text-secondary: #475569;
      --text-muted: #64748b;
      
      --accent-primary: #2563eb; /* Royal medical blue */
      --accent-primary-glow: rgba(37, 99, 235, 0.08);
      --accent-secondary: #0d9488; /* Teal */
      --accent-secondary-glow: rgba(13, 148, 136, 0.08);
      --accent-success: #10b981; /* Green */
      --accent-success-glow: rgba(16, 185, 129, 0.08);
      --accent-warning: #f59e0b; /* Gold */
      --accent-warning-glow: rgba(245, 158, 11, 0.08);
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(37, 99, 235, 0.05), 0 2px 4px -1px rgba(37, 99, 235, 0.03);
      --shadow-lg: 0 10px 15px -3px rgba(37, 99, 235, 0.08), 0 4px 6px -2px rgba(37, 99, 235, 0.04);
      --shadow-glow: 0 0 15px rgba(37, 99, 235, 0.12);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      
      --transition-fast: 0.15s ease;
      --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      /* Theme 2: 静谧深蓝 */
      --bg-primary: #0a0e17;
      --bg-secondary: #101726;
      --bg-card: rgba(16, 23, 38, 0.85);
      --bg-card-hover: rgba(24, 34, 54, 0.9);
      --border-color: rgba(59, 130, 246, 0.15);
      --border-color-hover: rgba(59, 130, 246, 0.45);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      
      --accent-primary: #3b82f6;
      --accent-primary-glow: rgba(59, 130, 246, 0.15);
      --accent-secondary: #14b8a6;
      --accent-secondary-glow: rgba(20, 184, 166, 0.15);
      --accent-success: #10b981;
      --accent-success-glow: rgba(16, 185, 129, 0.15);
      --accent-warning: #f59e0b;
      --accent-warning-glow: rgba(245, 158, 11, 0.15);
      
      --shadow-glow: 0 0 20px rgba(59, 130, 246, 0.18);
    }

    [data-theme="sepia"] {
      /* Theme 3: 暖沙柔光 (Kindle Sepia) */
      --bg-primary: #f5efe6;
      --bg-secondary: #fdfaf2;
      --bg-card: #fdfaf2;
      --bg-card-hover: #f7f2e8;
      --border-color: #e6dbcb;
      --border-color-hover: #d97706;
      --text-primary: #473c33;
      --text-secondary: #6e5f52;
      --text-muted: #9c8a79;
      
      --accent-primary: #d97706;
      --accent-primary-glow: rgba(217, 119, 6, 0.08);
      --accent-secondary: #0d9488;
      --accent-secondary-glow: rgba(13, 148, 136, 0.08);
      --accent-success: #16a34a;
      --accent-success-glow: rgba(22, 163, 74, 0.08);
      --accent-warning: #b45309;
      --accent-warning-glow: rgba(180, 83, 9, 0.08);
      
      --shadow-glow: 0 0 15px rgba(217, 119, 6, 0.1);
    }

    [data-theme="mint"] {
      /* Theme 4: 温和薄荷 */
      --bg-primary: #eefaf4;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-card-hover: #f4fcf8;
      --border-color: #cbf0dd;
      --border-color-hover: #059669;
      --text-primary: #0f291e;
      --text-secondary: #334e40;
      --text-muted: #647c70;
      
      --accent-primary: #059669;
      --accent-primary-glow: rgba(5, 150, 105, 0.08);
      --accent-secondary: #0284c7;
      --accent-secondary-glow: rgba(2, 132, 199, 0.08);
      --accent-success: #10b981;
      --accent-success-glow: rgba(16, 185, 129, 0.08);
      --accent-warning: #d97706;
      --accent-warning-glow: rgba(217, 119, 6, 0.08);
      
      --shadow-glow: 0 0 15px rgba(5, 150, 105, 0.1);
    }

    [data-theme="cyberpunk"] {
      /* Theme 5: 赛博极客 */
      --bg-primary: #05050a;
      --bg-secondary: #0a0a16;
      --bg-card: rgba(10, 10, 26, 0.85);
      --bg-card-hover: rgba(18, 18, 38, 0.95);
      --border-color: #ff007f;
      --border-color-hover: #00ffff;
      --text-primary: #00ffff;
      --text-secondary: #ff007f;
      --text-muted: #8b5cf6;
      
      --accent-primary: #00ffff;
      --accent-primary-glow: rgba(0, 255, 255, 0.2);
      --accent-secondary: #ff007f;
      --accent-secondary-glow: rgba(255, 0, 127, 0.2);
      --accent-success: #39ff14;
      --accent-success-glow: rgba(57, 255, 20, 0.2);
      --accent-warning: #ffff00;
      --accent-warning-glow: rgba(255, 255, 0, 0.2);
      
      --shadow-glow: 0 0 25px rgba(255, 0, 127, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color var(--transition-normal), color var(--transition-normal);
      overflow-x: hidden;
    }

    /* Grid Background Effect */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(var(--border-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -1;
      opacity: 0.25;
      pointer-events: none;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-primary);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent-primary);
    }

    /* Container */
    .app-container {
      display: flex;
      flex: 1;
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
      gap: 24px;
      position: relative;
    }

    /* Sidebar */
    aside {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Fixed Left Sidebar Overflow */
    .sticky-sidebar {
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
      padding-right: 6px;
    }

    .sticky-sidebar::-webkit-scrollbar {
      width: 5px;
    }
    .sticky-sidebar::-webkit-scrollbar-track {
      background: transparent;
    }
    .sticky-sidebar::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    .sticky-sidebar::-webkit-scrollbar-thumb:hover {
      background: var(--accent-primary);
    }

    /* Main Area */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }

    /* Common Card Styles */
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-md);
      transition: all var(--transition-normal);
    }

    .glass-card:hover {
      border-color: var(--border-color-hover);
      box-shadow: var(--shadow-glow), var(--shadow-lg);
    }

    /* Brand / Header */
    .brand-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .brand-title {
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    /* Progress Widget */
    .progress-widget {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
    }

    .progress-bar-bg {
      height: 8px;
      background: var(--bg-primary);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-success));
      width: 0%;
      border-radius: 4px;
      transition: width var(--transition-slow);
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 5px;
    }

    .stat-box {
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 10px;
      text-align: center;
      transition: all var(--transition-fast);
    }

    [data-theme="dark"] .stat-box {
      background: rgba(255, 255, 255, 0.03);
    }

    .stat-box.active {
      border-color: var(--accent-warning);
      background: var(--accent-warning-glow);
    }

    .stat-val {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Region Selector Menu */
    .region-menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 400px;
      padding-right: 5px;
    }

    .region-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 500;
      transition: all var(--transition-normal);
    }

    .region-item:hover {
      background: rgba(0, 0, 0, 0.03);
      color: var(--text-primary);
    }

    [data-theme="dark"] .region-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .region-item.active {
      background: var(--accent-primary-glow);
      border-color: rgba(37, 99, 235, 0.2);
      color: var(--accent-primary);
    }

    .region-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .region-badge {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      transition: all var(--transition-fast);
    }

    .region-item.active .region-badge {
      background: var(--accent-primary);
      color: #fff;
      border-color: var(--accent-primary);
    }

    /* Main Toolbar */
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .toolbar-row-1 {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(0, 0, 0, 0.02);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 15px;
      outline: none;
      transition: all var(--transition-normal);
    }

    [data-theme="dark"] .search-input {
      background: rgba(255, 255, 255, 0.03);
    }

    .search-input:focus {
      border-color: var(--accent-primary);
      background: #fff;
      box-shadow: 0 0 0 3px var(--accent-primary-glow);
    }

    [data-theme="dark"] .search-input:focus {
      background: rgba(255, 255, 255, 0.05);
    }

    /* Filter Segments */
    .segmented-control {
      display: flex;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-color);
      padding: 4px;
      border-radius: var(--radius-md);
      gap: 4px;
    }

    [data-theme="dark"] .segmented-control {
      background: rgba(0, 0, 0, 0.2);
    }

    .segment-btn {
      padding: 10px 16px;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-normal);
    }

    .segment-btn:hover {
      color: var(--text-primary);
    }

    .segment-btn.active {
      background: var(--bg-card);
      color: var(--accent-primary);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    /* Toolbar Actions Row */
    .toolbar-row-2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .mode-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mode-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .mode-btn:hover {
      background: rgba(0, 0, 0, 0.02);
      color: var(--text-primary);
    }

    [data-theme="dark"] .mode-btn:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    .mode-btn.active {
      border-color: var(--accent-primary);
      background: var(--accent-primary-glow);
      color: var(--accent-primary);
    }

    .mode-btn svg {
      width: 16px;
      height: 16px;
    }

    .action-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-normal);
    }

    .btn-icon:hover {
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    /* Card Details */
    .study-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .study-card.mastered {
      opacity: 0.65;
      border-color: rgba(16, 185, 129, 0.2);
    }

    .study-card.mastered:hover {
      opacity: 1;
      border-color: var(--accent-success);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-badges {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    .badge-term {
      background: var(--accent-primary-glow);
      color: var(--accent-primary);
      border: 1px solid rgba(37, 99, 235, 0.2);
    }

    .badge-question {
      background: var(--accent-secondary-glow);
      color: var(--accent-secondary);
      border: 1px solid rgba(13, 148, 136, 0.2);
    }

    .badge-region {
      background: rgba(0, 0, 0, 0.03);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }

    [data-theme="dark"] .badge-region {
      background: rgba(255, 255, 255, 0.05);
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-action-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .card-action-btn:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
    }

    .card-action-btn.star-btn:hover,
    .card-action-btn.star-btn.active {
      color: var(--accent-warning);
      border-color: rgba(245, 158, 11, 0.4);
      background: var(--accent-warning-glow);
    }

    .card-action-btn.check-btn:hover,
    .card-action-btn.check-btn.active {
      color: var(--accent-success);
      border-color: rgba(16, 185, 129, 0.4);
      background: var(--accent-success-glow);
    }

    .card-action-btn svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .card-action-btn.active svg {
      fill: currentColor;
    }

    /* Card Title Typography - English Primary, Chinese Secondary */
    .card-title {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .english-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px; /* Big font for English */
      font-weight: 700;
      color: var(--accent-primary); /* Primary accent */
      line-height: 1.25;
    }

    .chinese-title {
      font-size: 14px; /* Smaller font for Chinese */
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
    }

    .card-body {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
      white-space: pre-wrap; /* Preserve manual whitespace & newlines precisely */
      transition: max-height var(--transition-normal), opacity var(--transition-normal);
    }

    .card-body strong {
      color: var(--text-primary);
      font-weight: 600;
      background: var(--accent-primary-glow);
      padding: 0 2px;
      border-radius: 3px;
    }

    /* Active Recall / Hide mode styling */
    .card-body.hidden-answer {
      max-height: 0;
      padding-top: 0;
      border-top-color: transparent;
      opacity: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .flashcard-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 24px;
      background: rgba(0, 0, 0, 0.01);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all var(--transition-normal);
      user-select: none;
    }

    [data-theme="dark"] .flashcard-placeholder {
      background: rgba(255, 255, 255, 0.02);
    }

    .flashcard-placeholder:hover {
      color: var(--accent-primary);
      border-color: var(--accent-primary);
      background: var(--accent-primary-glow);
    }

    /* Single Quiz Panel */
    .quiz-view-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      min-height: 400px;
    }

    .quiz-card-wrapper {
      width: 100%;
      max-width: 700px;
      perspective: 1000px;
    }

    .quiz-card {
      width: 100%;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
    }

    .quiz-actions-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 700px;
      margin-top: 10px;
    }

    .quiz-btn {
      flex: 1;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all var(--transition-normal);
    }

    .quiz-btn-primary {

    [data-tooltip]:hover::after {
      opacity: 1;
      visibility: visible;
    }

    /* Responsive */
    @media (max-width: 1024px) {

        if (filterType !== 'all' && item.type !== filterType) return false;
        
        // Starred filter
        if (filterStarred && !starredItems.includes(item.id)) return false;
        
        // Unstudied filter
        if (filterUnstudied && (masteredItems.includes(item.id) || starredItems.includes(item.id))) return false;
        
        // Search filter
        if (searchVal) {
          const matchTitle = item.title.toLowerCase().includes(searchVal);
          const matchEnglish = item.english.toLowerCase().includes(searchVal);
          const matchContent = item.content.toLowerCase().includes(searchVal);
          const matchRegion = item.region.toLowerCase().includes(searchVal);
          return matchTitle || matchEnglish || matchContent || matchRegion;
        }
        
        return true;

    // Highlight key anatomical terms/symbols helper - removes indentation and breaks lists onto new lines
    function formatContent(text) {
      // 1. Split into lines, trim each line's leading/trailing whitespace to get rid of indentations
      let lines = text.split('\n');
      let cleanedLines = lines.map(line => line.trim());
      
      // 2. Format list items: if a list marker like "X. " is inline, break it onto a new line
      let joinedText = cleanedLines.join('\n');
      // Replace "[punctuation] X. " with "[punctuation]\nX. " to enforce newline
      joinedText = joinedText.replace(/([;；。，：、])\s*(\d+\.)/g, '$1\n$2');
      
      // 3. Re-split and trim again to make sure there are NO leading spaces on any line
      lines = joinedText.split('\n');
      cleanedLines = lines.map(line => line.trim()).filter(line => line.length > 0);
      
      let finalHtml = cleanedLines.map(line => {
        // Escape HTML
        let escaped = line
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
          
        // Bold list numbers at start of line
        escaped = escaped.replace(/^(\d+\.)/g, "<strong>$1</strong>");
        
        // Bold other list numbers or special brackets/markers inside the line
        escaped = escaped.replace(/(①|②|③|④|⑤|⑥|⑦|⑧|⑨|⑩|(\b\d+\.))/g, "<strong>$1</strong>");
        
        return escaped;
      }).join('<br>');
      
      return finalHtml;
    }

            </svg>
            <div style="font-weight: 600; font-size: 18px; color: var(--text-primary);">太棒了！本轮测验已完成</div>
            <div style="font-size: 13px; color: var(--text-muted); max-width:400px; line-height:1.6; margin-top:5px;">
              您已经测验完了这一组所有的 <strong>${quizQueue.length}</strong> 道题。可以切换分类/区域，或者点击下方重新开始新一轮乱序抽题。
            </div>
            <button class="quiz-btn quiz-btn-primary" onclick="startQuiz()" style="margin-top:10px; max-width:200px;">重新开始测验</button>
          </div>
        `;
        return;
      }
      
      const item = quizQueue[quizIndex];
      const isMastered = masteredItems.includes(item.id);
      const isStarred = starredItems.includes(item.id);
      const typeLabel = item.type === "term" ? "名词解释" : "问答简答";
      const typeClass = item.type === "term" ? "badge-term" : "badge-question";

      // Title Swap in Quiz Mode
      let titleBlock = '';
      if (item.english) {
        titleBlock = `
          <div class="card-title" style="margin-bottom: 15px;">
            <span class="english-title" style="font-size:24px;">${item.english}</span>
            <span class="chinese-title" style="font-size:16px;">${item.title}</span>
          </div>
        `;
      } else {
        titleBlock = `
          <div class="card-title" style="margin-bottom: 15px;">
            <span class="english-title" style="font-size:24px;">${item.title}</span>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="quiz-view-container">
          <div class="quiz-progress-text">进度：${quizIndex + 1} / ${quizQueue.length} (全部 ${DATA.length} 题乱序自测)</div>
          
          <div class="quiz-card-wrapper">
            <div class="glass-card quiz-card" id="quiz-card-element">
              <!-- Meta -->
              <div class="card-meta">
                <div class="card-badges">
                  <span class="badge-tag ${typeClass}">${typeLabel}</span>
                  <span class="badge-tag badge-region">${item.region}</span>
                </div>
                <div class="card-actions">
                  <button class="card-action-btn star-btn ${isStarred ? 'active' : ''}" 
                          onclick="toggleStar(${item.id}, event)" 
                          data-tooltip="标星（需复习）">
                    <svg viewBox="0 0 24 24">
                      <path d="M11.48 3.499c.174-.427.772-.427.946 0l2.22 5.438a.5.5 0 00.376.315l5.88.756c.465.06.65.632.314.952l-4.4 4.192a.5.5 0 00-.14.453l1.196 5.8a.5.5 0 00-.736.564L12 18.9l-5.02 2.915a.5.5 0 00-.736-.564L7.44 15.44a.5.5 0 00-.14-.453l-4.4-4.192a.5.5 0 00.314-.952l5.88-.756a.5.5 0 00.376-.315l2.22-5.438z" />
                    </svg>
                  </button>
                  <button class="card-action-btn check-btn ${isMastered ? 'active' : ''}" 
                          onclick="toggleMastered(${item.id}, event)" 
                          data-tooltip="标为已掌握">
                    <svg viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                    </svg>
                  </button>
                </div>
              </div>
              
              <!-- Content -->
              <div>
                ${titleBlock}
                
                ${quizShowAnswer ? `<div class="card-body" style="display:block;">${formatContent(item.content)}</div>` : `
                  <div class="flashcard-placeholder" onclick="revealQuizAnswer()" style="padding:40px;">
                    <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                    点击思考，点击或敲击空格显示解析
                  </div>
                `}
              </div>
            </div>
          </div>

          <!-- Bottom Quiz Navigation -->
          <div class="quiz-actions-row">
            ${!quizShowAnswer ? `
              <button class="quiz-btn quiz-btn-primary" onclick="revealQuizAnswer()">显示解析 (Show Answer)</button>
            ` : `
              <button class="quiz-btn quiz-btn-hard" onclick="markQuizCard(false)">
                <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                仍需复习 (Star)
              </button>
              <button class="quiz-btn quiz-btn-easy" onclick="markQuizCard(true)">
                <svg style="width:16px;height:16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                已经掌握 (Got it)
              </button>
            `}
          </div>
        </div>
      `;

      // Allow spacebar key to reveal/confirm
      document.onkeydown = function(e) {
        if (viewMode !== 'quiz') return;
        if (e.keyCode === 32) { // Space
          e.preventDefault();
          if (!quizShowAnswer) {
            revealQuizAnswer();
          }
        } else if (e.keyCode === 49 && quizShowAnswer) { // "1" key
          markQuizCard(false);
        } else if (e.keyCode === 50 && quizShowAnswer) { // "2" key
          markQuizCard(true);
        }
      }
    }

    // Key handlers for quiz
    function revealQuizAnswer() {
      quizShowAnswer = true;
      renderQuizCard();
    }

    function markQuizCard(isGot) {
      const item = quizQueue[quizIndex];
      if (isGot) {
        if (!masteredItems.includes(item.id)) masteredItems.push(item.id);
        const starIdx = starredItems.indexOf(item.id);
        if (starIdx > -1) starredItems.splice(starIdx, 1);
      } else {
        if (!starredItems.includes(item.id)) starredItems.push(item.id);
        const masteredIdx = masteredItems.indexOf(item.id);
        if (masteredIdx > -1) masteredItems.splice(masteredIdx, 1);
      }
      
      updateStats();
      
      quizIndex++;
      quizShowAnswer = false;
      renderQuizCard();
    }

    function updateQuizCardState() {
      const item = quizQueue[quizIndex];
      if (!item) return;
      const isMastered = masteredItems.includes(item.id);
      const isStarred = starredItems.includes(item.id);
      
      const starBtn = document.querySelector('.quiz-card .star-btn');
      const checkBtn = document.querySelector('.quiz-card .check-btn');
      
      if (starBtn && checkBtn) {
        if (isStarred) starBtn.classList.add('active');
        else starBtn.classList.remove('active');
        
        if (isMastered) checkBtn.classList.add('active');
        else checkBtn.classList.remove('active');
      }
    }

  </script>
</body>
</html>
